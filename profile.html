<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile - REKAVO</title>
<script src="lang.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#f1f3f6;padding-bottom:80px}
.profile-wrap{padding:0;background:#f1f3f6}
.profile-top-card{background:#fff;text-align:center;padding:28px 15px 18px;border-bottom:8px solid #f1f3f6}
.img-wrap{position:relative;width:110px;height:110px;margin:0 auto}
.p-circle{width:110px;height:110px;background:#e9e9e9;color:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:800;border:2px solid #000;overflow:hidden}
.p-circle img{width:100%;height:100%;object-fit:cover}
.edit-pencil{position:absolute;bottom:2px;right:2px;width:30px;height:30px;background:#000;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;border:2px solid #fff;cursor:pointer}
.p-name{margin-top:14px;font-size:18px;font-weight:800;color:#000}
.p-mobile{margin-top:3px;font-size:14px;color:#555;font-weight:500}
.p-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px;background:#fff;border-bottom:8px solid #f1f3f6}
.p-grid-btn{border:1.5px solid #000;border-radius:8px;padding:14px 5px;text-align:center;font-size:13px;font-weight:700;background:#fff;cursor:pointer}
.p-list{background:#fff;padding:0}
.p-list-item{display:flex;justify-content:space-between;align-items:center;padding:16px 15px;border-bottom:1px solid #f0f0f0;font-size:14px;font-weight:600;cursor:pointer}
.empty-box{background:#fff;border-radius:8px;padding:40px 20px;text-align:center;margin-top:12px}
.page-section{position:fixed;top:0;left:0;width:100%;height:100%;background:#f1f3f6;z-index:10000;overflow-y:auto;padding-bottom:80px}
.page-header{background:#2874f0;color:#fff;padding:12px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:2}
.input,.select{width:100%;height:44px;border:1px solid #dbdbdb;border-radius:8px;padding:0 12px;outline:none;font-size:14px;margin:5px 0 2px;background:#fff}
.textarea{width:100%;min-height:70px;border:1px solid #dbdbdb;border-radius:8px;padding:10px 12px;outline:none;font-size:14px;margin:5px 0 2px;resize:none}
.btn{width:100%;height:44px;background:#2874f0;color:#fff;border:none;border-radius:8px;font-weight:800;font-size:14px;cursor:pointer;margin-top:6px}
.btn-blue{background:#2874f0}
.btn-outline{background:#fff;color:#2874f0;border:1.5px solid #2874f0}
.btn-danger{background:#fff;color:#ff3e6c;border:1.5px solid #ff3e6c;margin-top:8px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;padding:8px 0;border-top:1px solid #ddd;z-index:99;height:62px}
.bottom-nav a{text-align:center;text-decoration:none;color:#555;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.bottom-nav a.active{color:#2874f0}
.hidden{display:none!important}
.addr-card{background:#fff;border-radius:8px;padding:12px;margin-bottom:10px;border:1.5px solid #e0e0e0;display:flex;gap:12px;align-items:center}
.addr-card.selected{border-color:#2874f0;background:#f0f7ff}
.radio{width:20px;height:20px;border:2px solid #878787;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.radio.sel{border-color:#2874f0}.radio.sel div{width:10px;height:10px;background:#2874f0;border-radius:50%}
.form-row{display:flex;gap:8px}.form-row>div{flex:1}
.type-chip{border:1px solid #dbdbdb;border-radius:20px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;background:#fff}
.type-chip.active{background:#2874f0;color:#fff;border-color:#2874f0}
.addr-modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:10001;display:flex;align-items:center;justify-content:center;padding:14px}
.addr-modal{background:#fff;border-radius:12px;width:100%;max-width:380px;max-height:90vh;overflow-y:auto;padding:14px}
.delete-sheet-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:10002;display:flex;align-items:flex-end;justify-content:center}
.delete-sheet{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:420px;padding:20px 16px 24px}
</style>
</head>
<body>
<div class="profile-wrap">
  <div class="profile-top-card">
    <div class="img-wrap"><div class="p-circle" id="pIcon">UN</div><div class="edit-pencil" onclick="document.getElementById('profileFile').click()">✏️</div><input type="file" id="profileFile" accept="image/*" style="display:none"><input type="file" id="profileFileCamera" accept="image/*" capture="user" style="display:none"></div>
    <div class="p-name" id="pName"></div><div class="p-mobile" id="pMobile"></div>
    <div style="display:none" id="pEmail"></div>
  </div>
  <div class="p-grid">
    <div class="p-grid-btn" onclick="openPage('orders')">My orders</div>
    <div class="p-grid-btn" onclick="location.href='cart.html'">My Cart (<span id="pGridCart">0</span>)</div>
    <div class="p-grid-btn">coupons</div>
    <div class="p-grid-btn" onclick="openPage('wishlist')">wishlist</div>
  </div>
  <div class="p-list">
    <div class="p-list-item"><div>📧 Email - <span id="pEmailShow" style="color:#878787">........</span></div></div>
    <div class="p-list-item" onclick="openPage('address')"><div>📍 Saved Addresses</div><div>›</div></div>
    <div class="p-list-item" onclick="openPage('editprofile')"><div>👤 Edit profile</div><div>›</div></div>
    <div class="p-list-item" onclick="logout()"><div>🚪 Logout</div><div>›</div></div>
  </div>
</div>

<div id="page-orders" class="page-section hidden"><div class="page-header"><span onclick="closePage('orders')" style="font-size:22px;cursor:pointer">←</span><b>My Orders</b></div><div id="ordersContent"></div></div>
<div id="page-wishlist" class="page-section hidden"><div class="page-header"><span onclick="closePage('wishlist')" style="font-size:22px;cursor:pointer">←</span><b>My Wishlist</b></div><div id="wishlistContent"></div></div>
<div id="page-address" class="page-section hidden"><div class="page-header"><span onclick="closePage('address')" style="font-size:22px;cursor:pointer">←</span><b>My Addresses</b></div><div id="addressContent"></div></div>

<!-- FINAL PROFESSIONAL EDIT PROFILE - SINGLE SAVE BUTTON -->
<div id="page-editprofile" class="page-section hidden">
  <div class="page-header"><span onclick="closePage('editprofile')" style="font-size:22px;cursor:pointer">←</span><b>Edit Profile</b></div>
  <div style="max-width:500px;margin:0 auto;padding:12px">
    <div style="background:#fff;border-radius:12px;padding:22px 16px;text-align:center;border:1px solid #e5e7eb">
      <div class="img-wrap" style="margin:0 auto 14px;width:92px;height:92px"><div class="p-circle" id="editPicon" style="width:92px;height:92px;font-size:28px;border:2px solid #e5e7eb;background:#f3f4f6">UN</div></div>
      <div style="display:flex;gap:8px;justify-content:center">
        <button onclick="document.getElementById('profileFile').click()" style="border:1.5px solid #2874f0;color:#2874f0;background:#fff;border-radius:20px;padding:7px 16px;font-size:13px;font-weight:700;cursor:pointer">Change Photo</button>
        <button onclick="document.getElementById('profileFileCamera').click()" style="border:1.5px solid #e5e7eb;background:#fff;border-radius:20px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer">📷</button>
      </div>
      <div onclick="deletePhoto()" style="margin-top:10px;color:#ff3e6c;font-size:12px;font-weight:600;cursor:pointer">Remove Photo</div>
    </div>

    <div style="background:#fff;border-radius:12px;padding:16px;margin-top:12px;border:1px solid #e5e7eb">
      <label style="font-size:11px;font-weight:700;color:#6b7280;letter-spacing:.5px">FULL NAME</label>
      <input id="editName" class="input" style="margin-top:6px;height:48px;border-radius:10px" placeholder="Full name">
      <label style="font-size:11px;font-weight:700;color:#6b7280;letter-spacing:.5px;margin-top:14px;display:block">MOBILE NUMBER</label>
      <input id="editMobile" class="input" style="margin-top:6px;height:48px;border-radius:10px" placeholder="Mobile number" maxlength="10" inputmode="numeric">
      <label style="font-size:11px;font-weight:700;color:#6b7280;letter-spacing:.5px;margin-top:14px;display:block">EMAIL ADDRESS</label>
      <input id="editEmail" class="input" style="margin-top:6px;height:48px;border-radius:10px" placeholder="Email address">
      <button id="btnSaveProfile" onclick="handleSaveProfile()" style="width:100%;height:48px;background:#2874f0;color:#fff;border:none;border-radius:10px;font-weight:800;font-size:14px;margin-top:18px;cursor:pointer">Save Profile</button>

      <div id="otpBox" class="hidden" style="margin-top:16px;background:#f8faff;border:1.5px dashed #2874f0;border-radius:12px;padding:16px">
        <b style="font-size:13px">Verify OTP</b>
        <p style="font-size:11px;color:#6b7280;margin:4px 0 10px">Code sent to <span id="otpSentTo" style="font-weight:700;color:#111"></span></p>
        <input id="editOtp" class="input" style="height:48px;border-radius:10px;text-align:center;letter-spacing:6px;font-size:20px;font-weight:800;border:1.5px solid #2874f0" placeholder="••••••" maxlength="6" inputmode="numeric">
        <button id="btnVerify" onclick="verifyAndSave()" style="width:100%;height:48px;background:#111827;color:#fff;border:none;border-radius:10px;font-weight:800;font-size:14px;margin-top:10px;cursor:pointer">Verify & Save</button>
        <p id="emailMsg" style="font-size:12px;margin-top:8px;text-align:center;color:#2874f0;font-weight:600"></p>
      </div>
    </div>
  </div>
</div>

<div class="bottom-nav">
<a href="index.html"><span>🏠</span><span>Home</span></a>
<a href="profile.html" class="active"><span>👤</span><span>Account</span></a>
<a href="cart.html"><span>🛒</span><span>Cart (<span id="cartCount">0</span>)</span></a>
</div>

<div id="editAddrModal" class="addr-modal-overlay hidden" onclick="if(event.target==this)closeEditModal()"><div class="addr-modal" id="editAddrModalBox"></div></div>
<div id="deleteSheet" class="delete-sheet-overlay hidden"><div class="delete-sheet"><h3>Confirm to delete?</h3><p>This address will be permanently deleted.</p><div style="display:flex;gap:10px"><button style="flex:1;height:44px;background:#f1f3f6;border:none;border-radius:8px;font-weight:700" onclick="document.getElementById('deleteSheet').classList.add('hidden')">Cancel</button><button style="flex:1;height:44px;background:#ff3e6c;color:#fff;border:none;border-radius:8px;font-weight:800" onclick="confirmDelete()">Delete</button></div></div></div>

<script>
const API_BASE="https://rekavo-backend.vercel.app";
let currentUser=null;
let selectedAddrId = localStorage.getItem('rekavo_selected_addr')||null;
let pendingDeleteId=null;
let pendingChanges={};
let validPinCache={};
const INDIAN_STATES=["Andhra Pradesh","Arunachal Pradesh","Assam","Bihar","Chhattisgarh","Goa","Gujarat","Haryana","Himachal Pradesh","Jharkhand","Karnataka","Kerala","Madhya Pradesh","Maharashtra","Manipur","Meghalaya","Mizoram","Nagaland","Odisha","Punjab","Rajasthan","Sikkim","Tamil Nadu","Telangana","Tripura","Uttar Pradesh","Uttarakhand","West Bengal","Delhi","Jammu and Kashmir","Ladakh"];

function openPage(type, push=true){
 if(!currentUser){alert('Please login first');return;}
 document.querySelectorAll('.page-section').forEach(s=>s.classList.add('hidden'));
 document.getElementById(`page-${type}`).classList.remove('hidden');
 if(push){ history.pushState({page:type}, '', '#'+type); }
 if(type==='address')renderAddress();
 if(type==='editprofile')fillEditProfile();
}
function closePage(type){ if(location.hash){ history.back(); } else { document.getElementById(`page-${type}`).classList.add('hidden'); } }
function getUid(){return currentUser?(currentUser.user_id||currentUser.id):null;}

function fillEditProfile(){
  document.getElementById('editName').value=currentUser.name||'';
  document.getElementById('editMobile').value=currentUser.phone||currentUser.mobile||'';
  document.getElementById('editEmail').value=currentUser.email||'';
  document.getElementById('otpBox').classList.add('hidden');
  document.getElementById('editOtp').value='';
  document.getElementById('emailMsg').innerText='';
  document.getElementById('btnSaveProfile').innerText='Save Profile';
  document.getElementById('btnSaveProfile').disabled=false;
  let c=document.getElementById('editPicon');
  let p=localStorage.getItem('rekavo_profile_photo');
  if(p){c.innerHTML=`<img src="${p}">`}else{c.innerText=getInitials(currentUser.name);}
}

async function handleSaveProfile(){
  let newName=document.getElementById('editName').value.trim();
  let newMobile=document.getElementById('editMobile').value.trim();
  let newEmail=document.getElementById('editEmail').value.trim().toLowerCase();
  let oldEmail=(currentUser.email||'').toLowerCase();
  let oldMobile=(currentUser.phone||currentUser.mobile||'').trim();
  let oldName=(currentUser.name||'').trim();
  if(!newName){alert('Name required');return;}
  pendingChanges={name:newName, mobile:newMobile, email:newEmail};
  let isEmailChanged=newEmail!==oldEmail;
  let isMobileChanged=newMobile!==oldMobile;
  let isNameChanged=newName!==oldName;

  if(!isNameChanged &&!isEmailChanged &&!isMobileChanged){ alert('No changes'); return; }

  // ONLY NAME CHANGED -> NO OTP
  if(isNameChanged &&!isEmailChanged &&!isMobileChanged){
    let btn=document.getElementById('btnSaveProfile'); btn.innerText='Saving...'; btn.disabled=true;
    try{
      let res=await fetch(`${API_BASE}/user/update-name`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:getUid(), name:newName})});
      if(!res.ok) throw new Error('failed');
      currentUser.name=newName; localStorage.setItem('rekavo_user',JSON.stringify(currentUser));
      document.getElementById('pName').innerText=newName;
      alert('Name updated'); closePage('editprofile');
    }catch(e){alert('Failed');}
    btn.innerText='Save Profile'; btn.disabled=false; return;
  }

  // EMAIL OR MOBILE CHANGED -> OTP TO OLD EMAIL
  let btn=document.getElementById('btnSaveProfile'); btn.innerText='Sending OTP...'; btn.disabled=true;
  try{
    let res=await fetch(`${API_BASE}/profile/request-change`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:getUid(), old_email:oldEmail, new_email:newEmail, new_phone:newMobile})});
    let out=await res.json(); if(!res.ok) throw new Error(out.error||'Failed');
    document.getElementById('otpSentTo').innerText=oldEmail;
    document.getElementById('otpBox').classList.remove('hidden');
    document.getElementById('emailMsg').innerText='OTP sent to '+oldEmail;
    btn.innerText='Save Profile'; btn.disabled=false;
  }catch(e){ alert(e.message); btn.innerText='Save Profile'; btn.disabled=false; }
}

async function verifyAndSave(){
  let otp=document.getElementById('editOtp').value.trim();
  if(otp.length!=6){alert('Enter 6 digit OTP');return;}
  let btn=document.getElementById('btnVerify'); btn.innerText='Verifying...'; btn.disabled=true;
  try{
    let res=await fetch(`${API_BASE}/profile/verify-and-update`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:getUid(), old_email:currentUser.email.toLowerCase(), new_email:pendingChanges.email, new_phone:pendingChanges.mobile, name:pendingChanges.name, otp:otp})});
    let out=await res.json(); if(!res.ok) throw new Error(out.error||'Wrong OTP');
    alert('Profile updated! Please login again');
    logout();
  }catch(e){ alert(e.message); }
  btn.innerText='Verify & Save'; btn.disabled=false;
}

// ADDRESS + OTHER FUNCS SAME AS BEFORE (SHORT)
async function renderAddress(){ /* same as your old code */ let el=document.getElementById('addressContent'); el.innerHTML='<div style="padding:20px;text-align:center">Loading...</div>'; try{ let uid=getUid(); let res=await fetch(`${API_BASE}/address/get?user_id=${uid}`); let raw=await res.json(); let addr = Array.isArray(raw)? raw : (raw.data || raw.addresses || []); if(!Array.isArray(addr)||addr.length===0){ el.innerHTML=`<div style="padding:12px"><div style="background:#fff;border-radius:8px;padding:14px"><h3>Add Address</h3><p style="font-size:12px;color:#666">Go to cart to add address</p></div></div>`; return;} let html=`<div style="padding:12px">`; addr.forEach(a=>{ html+=`<div style="background:#fff;border-radius:8px;padding:12px;margin-bottom:8px"><b>${a.full_name}</b><p style="font-size:12px">${a.phone}</p><p style="font-size:12px">${a.full_address||''} ${a.city||''}</p></div>`}); el.innerHTML=html+`</div>`; }catch(e){ el.innerHTML='Error'; } }
function getInitials(name){if(!name)return"UN";let parts=name.trim().split(" ").filter(Boolean);if(parts.length>=2)return(parts[0][0]+parts[1][0]).toUpperCase();return parts[0].substring(0,2).toUpperCase();}
function logout(){localStorage.removeItem('rekavo_user');location.href='account.html';}
function deletePhoto(){localStorage.removeItem('rekavo_profile_photo');document.getElementById('pIcon').innerText=getInitials(currentUser.name);document.getElementById('editPicon').innerText=getInitials(currentUser.name);}
function handlePhotoFile(e){let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=function(ev){let b=ev.target.result;localStorage.setItem('rekavo_profile_photo',b);document.getElementById('pIcon').innerHTML=`<img src="${b}">`;document.getElementById('editPicon').innerHTML=`<img src="${b}">`;};reader.readAsDataURL(file);}
document.getElementById('profileFile').addEventListener('change',handlePhotoFile);
document.getElementById('profileFileCamera').addEventListener('change',handlePhotoFile);
(function(){ let u=localStorage.getItem('rekavo_user');if(!u){location.href='account.html';return;} currentUser=JSON.parse(u);currentUser.user_id=currentUser.user_id||currentUser.id; document.getElementById('pName').innerText=currentUser.name||'User'; document.getElementById('pMobile').innerText=currentUser.phone||currentUser.mobile||''; document.getElementById('pEmailShow').innerText=currentUser.email||''; document.getElementById('pIcon').innerText=getInitials(currentUser.name); let ph=localStorage.getItem('rekavo_profile_photo'); if(ph) document.getElementById('pIcon').innerHTML=`<img src="${ph}">`; })();
</script>
</body>
</html>
