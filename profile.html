<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile - REKAVO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#f1f3f6;padding-bottom:80px}
.profile-top-card{background:#fff;text-align:center;padding:28px 15px 18px;border-bottom:8px solid #f1f3f6}
.img-wrap{position:relative;width:110px;height:110px;margin:0 auto}
.p-circle{width:110px;height:110px;background:#e9e9e9;color:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:800;border:2px solid #000;overflow:hidden}
.p-circle img{width:100%;height:100%;object-fit:cover}
.edit-pencil{position:absolute;bottom:2px;right:2px;width:30px;height:30px;background:#000;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;border:2px solid #fff;cursor:pointer}
.p-name{margin-top:14px;font-size:18px;font-weight:800;color:#000}
.p-mobile{margin-top:3px;font-size:14px;color:#555;font-weight:500}
.p-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px;background:#fff;border-bottom:8px solid #f1f3f6}
.p-grid-btn{border:1.5px solid #000;border-radius:8px;padding:14px 5px;text-align:center;font-size:13px;font-weight:700;background:#fff;cursor:pointer;white-space:nowrap}
.p-list{background:#fff;padding:0}
.p-list-item{display:flex;justify-content:space-between;align-items:center;padding:16px 15px;border-bottom:1px solid #f0f0f0;font-size:14px;font-weight:600;cursor:pointer}
.empty-box{background:#fff;border-radius:8px;padding:40px 20px;text-align:center;margin-top:12px}
.page-section{position:fixed;top:0;left:0;width:100%;height:100%;background:#f1f3f6;z-index:10000;overflow-y:auto;padding-bottom:80px}
.page-header{background:#2874f0;color:#fff;padding:12px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:2}
.input,.select{width:100%;height:44px;border:1px solid #dbdbdb;border-radius:8px;padding:0 12px;outline:none;font-size:14px;margin:5px 0 2px;background:#fff}
.textarea{width:100%;min-height:70px;border:1px solid #dbdbdb;border-radius:8px;padding:10px 12px;outline:none;font-size:14px;margin:5px 0 2px;resize:none}
.input.err,.select.err{border-color:#ff3e6c;background:#fff5f7}
.btn{width:100%;height:44px;background:#2874f0;color:#fff;border:none;border-radius:8px;font-weight:800;font-size:14px;cursor:pointer;margin-top:6px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;padding:8px 0;border-top:1px solid #ddd;z-index:99;height:62px}
.bottom-nav a{text-align:center;text-decoration:none;color:#555;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.bottom-nav a.active{color:#2874f0}
.hidden{display:none!important}
.addr-card{background:#fff;border-radius:8px;padding:12px;margin-bottom:10px;border:1.5px solid #e0e0e0;display:flex;gap:12px;align-items:center}
.addr-card.selected{border-color:#2874f0;background:#f0f7ff}
.radio{width:20px;height:20px;border:2px solid #878787;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.radio.sel{border-color:#2874f0}.radio.sel div{width:10px;height:10px;background:#2874f0;border-radius:50%}
.form-row{display:flex;gap:8px}.form-row>div{flex:1}
.type-chip{border:1px solid #dbdbdb;border-radius:20px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;background:#fff}
.type-chip.active{background:#2874f0;color:#fff;border-color:#2874f0}
.addr-modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:10001;display:flex;align-items:center;justify-content:center;padding:14px}
.addr-modal{background:#fff;border-radius:12px;width:100%;max-width:380px;max-height:90vh;overflow-y:auto;padding:14px}
.pincode-ok{font-size:11px;color:#008000;margin-top:3px;font-weight:700}
.pincode-bad{font-size:11px;color:#ff3e6c;margin-top:3px;font-weight:700}
</style>
</head>
<body>
<div class="profile-top-card">
  <div class="img-wrap"><div class="p-circle" id="pIcon">UN</div><div class="edit-pencil" onclick="document.getElementById('profileFile').click()">✏️</div><input type="file" id="profileFile" accept="image/*" style="display:none"></div>
  <div class="p-name" id="pName"></div><div class="p-mobile" id="pMobile"></div>
</div>
<div class="p-grid">
  <div class="p-grid-btn" onclick="openPage('orders')">My orders</div>
  <div class="p-grid-btn" onclick="location.href='cart.html'">My Cart (<span id="pGridCart">0</span>)</div>
  <div class="p-grid-btn">coupons</div>
  <div class="p-grid-btn" onclick="openPage('wishlist')">wishlist</div>
</div>
<div class="p-list">
  <div class="p-list-item"><div>📧 Email - <span id="pEmailShow" style="color:#878787">........</span></div></div>
  <div class="p-list-item" onclick="openPage('address')"><div>📍 Saved Addresses</div><div>›</div></div>
  <div class="p-list-item" onclick="openPage('editprofile')"><div>👤 Edit profile</div><div>›</div></div>
  <div class="p-list-item" onclick="logout()"><div>🚪 Logout</div><div>›</div></div>
</div>

<div id="page-address" class="page-section hidden"><div class="page-header"><span onclick="closePage('address')" style="font-size:22px;cursor:pointer">←</span><b>My Addresses</b></div><div id="addressContent"></div></div>
<div id="page-orders" class="page-section hidden"><div class="page-header"><span onclick="closePage('orders')" style="font-size:22px;cursor:pointer">←</span><b>My Orders</b></div><div id="ordersContent"></div></div>
<div id="page-wishlist" class="page-section hidden"><div class="page-header"><span onclick="closePage('wishlist')" style="font-size:22px;cursor:pointer">←</span><b>My Wishlist</b></div><div id="wishlistContent"></div></div>
<div id="page-editprofile" class="page-section hidden"><div class="page-header"><span onclick="closePage('editprofile')" style="font-size:22px;cursor:pointer">←</span><b>Edit Profile</b></div><div style="padding:14px;background:#fff;margin:12px;border-radius:8px"><label style="font-size:12px;font-weight:700">Full Name</label><input id="editName" class="input" placeholder="Enter full name"><label style="font-size:12px;font-weight:700;margin-top:8px;display:block">Mobile</label><input id="editMobile" class="input" placeholder="Enter mobile number"><label style="font-size:12px;font-weight:700;margin-top:8px;display:block">Email</label><input id="editEmail" class="input" placeholder="Enter email"><button class="btn" style="margin-top:14px" onclick="saveProfile()">Save Profile</button></div></div>

<div class="bottom-nav">
<a href="index.html"><span>🏠</span><span>Home</span></a>
<a href="profile.html" class="active"><span>👤</span><span>Account</span></a>
<a href="cart.html"><span>🛒</span><span>Cart (<span id="cartCount">0</span>)</span></a>
</div>

<div id="editAddrModal" class="addr-modal-overlay hidden" onclick="if(event.target==this)closeEditModal()"><div class="addr-modal" id="editAddrModalBox"></div></div>
<div id="deleteConfirmModal" class="addr-modal-overlay hidden" style="align-items:flex-end;padding:0" onclick="if(event.target==this)closeDeleteConfirm()">
  <div style="background:#fff;width:100%;border-radius:16px 16px 0 0;padding:20px">
    <div style="width:40px;height:4px;background:#ddd;border-radius:10px;margin:0 auto 14px"></div>
    <h3 style="font-size:16px;font-weight:800">Confirm to delete address?</h3>
    <p style="font-size:13px;color:#555;margin-top:6px">This address will be removed from backend permanently.</p>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn" style="background:#f1f3f6;color:#000;flex:1" onclick="closeDeleteConfirm()">Cancel</button>
      <button class="btn" style="background:#ff3e6c;flex:1" onclick="confirmDelete()">Delete</button>
    </div>
  </div>
</div>

<script>
const API_BASE="https://rekavo-backend.vercel.app";
let currentUser=null;
let selectedAddrId = localStorage.getItem('rekavo_selected_addr')||null;
let pendingDeleteId = null;
const INDIAN_STATES=["Andhra Pradesh","Arunachal Pradesh","Assam","Bihar","Chhattisgarh","Goa","Gujarat","Haryana","Himachal Pradesh","Jharkhand","Karnataka","Kerala","Madhya Pradesh","Maharashtra","Manipur","Meghalaya","Mizoram","Nagaland","Odisha","Punjab","Rajasthan","Sikkim","Tamil Nadu","Telangana","Tripura","Uttar Pradesh","Uttarakhand","West Bengal","Delhi","Jammu and Kashmir","Ladakh"];

function getUid(){return currentUser?(currentUser.user_id||currentUser.id):null;}
function openPage(type, push=true){
 document.querySelectorAll('.page-section').forEach(s=>s.classList.add('hidden'));
 document.getElementById(`page-${type}`).classList.remove('hidden');
 if(push){ history.pushState({page:type}, '', '#'+type); }
 if(type==='address')renderAddress();
 if(type==='orders')renderOrders();
 if(type==='wishlist')renderWishlist();
 if(type==='editprofile')fillEditProfile();
}
function closePage(type){ if(location.hash){ history.back(); } else { document.getElementById(`page-${type}`).classList.add('hidden'); } }

// PINCODE ONLY VERIFY - NO AUTO FILL
async function verifyPincodeOnly(pincode, prefix){
 if(!/^\d{6}$/.test(pincode)) return;
 let loader = document.getElementById(prefix+'PinLoader');
 if(loader){ loader.className='pincode-ok'; loader.innerText='Checking...'; }
 try{
  let res = await fetch(`https://api.postalpincode.in/pincode/${pincode}`);
  let data = await res.json();
  if(data[0].Status==="Success"){ if(loader){ loader.className='pincode-ok'; loader.innerText='✓ Pincode Verified'; } }
  else { if(loader){ loader.className='pincode-bad'; loader.innerText='Invalid pincode'; } }
 }catch(e){ if(loader){ loader.className='pincode-ok'; loader.innerText='✓ Pincode Verified'; } }
}
function attachPincodeListener(prefix){
 setTimeout(()=>{
  let pinEl = document.getElementById(prefix+'Pin');
  if(!pinEl) return;
  let clone = pinEl.cloneNode(true);
  pinEl.parentNode.replaceChild(clone, pinEl);
  pinEl = clone;
  pinEl.addEventListener('input', function(){
   let v = this.value.replace(/\D/g,'').slice(0,6);
   this.value = v;
   this.classList.remove('err');
   let loader = document.getElementById(prefix+'PinLoader');
   if(v.length===6){ verifyPincodeOnly(v, prefix); }
   else { if(loader) loader.innerText=''; }
  });
 },100);
}

function addressFormHTML(prefix, data={}){
 let stateOpts=`<option value="">Select State</option>`+INDIAN_STATES.map(s=>`<option value="${s}" ${data.state===s?'selected':''}>${s}</option>`).join('');
 return `
<div class="form-row"><div><label style="font-size:11px;font-weight:700">Full Name *</label><input id="${prefix}Name" class="input" placeholder="Enter full name" value="${data.full_name||''}"></div><div><label style="font-size:11px;font-weight:700">Mobile *</label><input id="${prefix}Phone" class="input" placeholder="Enter 10-digit mobile" value="${data.phone||''}" inputmode="numeric" maxlength="10"></div></div>
<label style="font-size:11px;font-weight:700">Alternate Phone</label><input id="${prefix}AltPhone" class="input" placeholder="Enter alternate phone (optional)" value="${data.alt_phone||''}">
<div class="form-row"><div><label style="font-size:11px;font-weight:700">Pincode *</label><input id="${prefix}Pin" class="input" placeholder="Enter 6-digit pincode" value="${data.pincode||''}" inputmode="numeric" maxlength="6"><div id="${prefix}PinLoader"></div></div><div><label style="font-size:11px;font-weight:700">City *</label><input id="${prefix}City" class="input" placeholder="Enter city name" value="${data.city||''}"></div></div>
<label style="font-size:11px;font-weight:700">State *</label><select id="${prefix}State" class="select">${stateOpts}</select>
<label style="font-size:11px;font-weight:700">House No, Building Name *</label><input id="${prefix}Line1" class="input" placeholder="Enter house no, building name" value="${data.line1||''}">
<label style="font-size:11px;font-weight:700">Area, Street, Sector</label><textarea id="${prefix}Line2" class="textarea" placeholder="Enter area, colony, street">${data.line2||''}</textarea>
<label style="font-size:11px;font-weight:700">Landmark</label><input id="${prefix}Landmark" class="input" placeholder="Enter nearby landmark" value="${data.landmark||''}">
<label style="font-size:11px;font-weight:700">Address Type</label><div style="display:flex;gap:8px;margin:6px 0"><div class="type-chip ${(!data.type||data.type==='Home')?'active':''}" id="${prefix}TypeHome" onclick="setAddrType('${prefix}','Home')">Home</div><div class="type-chip ${data.type==='Office'?'active':''}" id="${prefix}TypeOffice" onclick="setAddrType('${prefix}','Office')">Office</div></div><input type="hidden" id="${prefix}Type" value="${data.type||'Home'}">`;
}
function setAddrType(prefix,t){document.getElementById(prefix+'Type').value=t;document.getElementById(prefix+'TypeHome').classList.toggle('active',t==='Home');document.getElementById(prefix+'TypeOffice').classList.toggle('active',t==='Office');}

async function renderAddress(){
 let el=document.getElementById('addressContent');el.innerHTML='<div style="padding:20px;text-align:center">Loading...</div>';
 try{
  let uid=getUid(); let email=currentUser.email||'';
  let res=await fetch(`${API_BASE}/address/get?user_id=${uid}&email=${encodeURIComponent(email)}`);let addr=await res.json();
  if(!Array.isArray(addr)||addr.length===0){
   el.innerHTML=`<div style="padding:12px"><div style="background:#fff;border-radius:8px;padding:14px"><h3 style="font-size:14px;margin-bottom:10px">Add New Address</h3>${addressFormHTML('new')}<button class="btn" onclick="addNewAddress()">Save Address</button></div></div>`;
   attachPincodeListener('new'); return;
  }
  let html=`<div style="padding:12px">`;
  addr.forEach((a,i)=>{
   let aid=a.id||a._id||a.address_id||i;
   let isSel=(selectedAddrId==aid)?'selected':'';let radioSel=(selectedAddrId==aid)?'sel':'';
   let fullAddr = a.full_address || [a.line1,a.line2,a.landmark,a.locality,a.city,a.state,a.pincode? '- '+a.pincode : ''].filter(Boolean).join(', ');
   html+=`<div class="addr-card ${isSel}"><div class="radio ${radioSel}" onclick="selectAddress('${aid}')"><div></div></div><div style="flex:1" onclick="selectAddress('${aid}')"><b style="font-size:13px">${a.full_name||a.name} - ${a.type||'Home'}</b><p style="font-size:12px;color:#555;margin-top:2px">${a.phone||a.mobile}</p><p style="font-size:12px;color:#222;margin-top:4px;line-height:16px">${fullAddr}</p></div><div style="font-size:12px;color:#2874f0;font-weight:700;cursor:pointer;min-width:45px;min-height:35px;display:flex;align-items:center;justify-content:center" onclick="openEditModal('${aid}')">Edit</div></div>`;
  });
  html+=`<div style="background:#fff;border-radius:8px;padding:14px;margin-top:10px"><h3 style="font-size:14px;margin-bottom:8px">+ Add New Address</h3>${addressFormHTML('new')}<button class="btn" onclick="addNewAddress()">Add New Address</button></div></div>`;
  el.innerHTML=html;
  window._addrCache=addr;
  attachPincodeListener('new');
 }catch(e){el.innerHTML=`<div class="empty-box"><h3>Error loading address</h3></div>`;}
}
function selectAddress(id){selectedAddrId=id;localStorage.setItem('rekavo_selected_addr',id);renderAddress();}

function openEditModal(id){
 let raw = (window._addrCache||[]).find((a,i)=>{let aid=a.id||a._id||a.address_id||i;return aid==id;});
 if(!raw) return;
 let normalized = {
  full_name: raw.full_name || raw.name || '',
  phone: raw.phone || raw.mobile || '',
  alt_phone: raw.alt_phone || '',
  pincode: raw.pincode || '',
  city: raw.city || '',
  state: raw.state || '',
  line1: raw.line1 || '',
  line2: raw.line2 || '',
  landmark: raw.landmark || raw.locality || '',
  type: raw.type || 'Home'
 };
 // Agar backend ne full_address me sab joda hai to line1 me wahi dikhega, landmark alag se nikal lo
 if(!normalized.line1 && raw.full_address) normalized.line1 = raw.full_address;
 if(!normalized.line2 && raw.locality) normalized.line2 = raw.locality;

 let box=document.getElementById('editAddrModalBox');
 box.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b style="font-size:15px">Edit Address</b><span onclick="closeEditModal()" style="font-size:20px;cursor:pointer">✕</span></div>${addressFormHTML('edit',normalized)}<button id="updateBtn" class="btn" onclick="saveEditAddress('${id}')">Update Address</button><button class="btn" style="background:#fff;color:#ff3e6c;border:1.5px solid #ff3e6c;margin-top:8px" onclick="openDeleteConfirm('${id}')">Delete Address</button>`;
 document.getElementById('editAddrModal').classList.remove('hidden');
 attachPincodeListener('edit');
}
function closeEditModal(){document.getElementById('editAddrModal').classList.add('hidden');}
function openDeleteConfirm(id){ pendingDeleteId = id; document.getElementById('deleteConfirmModal').classList.remove('hidden'); }
function closeDeleteConfirm(){ document.getElementById('deleteConfirmModal').classList.add('hidden'); pendingDeleteId = null; }
async function confirmDelete(){
 let id = pendingDeleteId; if(!id) return;
 let uid=getUid(); let email=currentUser.email||'';
 try{ await fetch(`${API_BASE}/address/delete`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:uid,email:email,address_id:id,id:id})}); }catch(e){}
 closeDeleteConfirm(); closeEditModal(); renderAddress();
}

function clearErr(prefix){ ['Name','Phone','Pin','City','State','Line1'].forEach(k=>{ let el=document.getElementById(prefix+k); if(el) el.classList.remove('err'); }); }
function validateAddress(prefix){
 clearErr(prefix);
 let fn=document.getElementById(prefix+'Name').value.trim();
 let ph=document.getElementById(prefix+'Phone').value.trim();
 let pin=document.getElementById(prefix+'Pin').value.trim();
 let city=document.getElementById(prefix+'City').value.trim();
 let state=document.getElementById(prefix+'State').value.trim();
 let l1=document.getElementById(prefix+'Line1').value.trim();
 let ok=true;
 if(!fn){ document.getElementById(prefix+'Name').classList.add('err'); ok=false; }
 if(!/^\d{10}$/.test(ph)){ document.getElementById(prefix+'Phone').classList.add('err'); ok=false; }
 if(!/^\d{6}$/.test(pin)){ document.getElementById(prefix+'Pin').classList.add('err'); ok=false; }
 if(!city){ document.getElementById(prefix+'City').classList.add('err'); ok=false; }
 if(!state){ document.getElementById(prefix+'State').classList.add('err'); ok=false; }
 if(!l1){ document.getElementById(prefix+'Line1').classList.add('err'); ok=false; }
 if(!ok) return null;
 return {fn,ph,pin,city,state,l1};
}

async function saveEditAddress(id){
 let btn = document.getElementById('updateBtn');
 if(btn){ btn.innerText='Updating...'; btn.disabled=true; }
 let v = validateAddress('edit');
 if(!v){ if(btn){ btn.innerText='Update Address'; btn.disabled=false; } return; }
 let p='edit';
 let alt=document.getElementById(p+'AltPhone').value.trim();
 let l2=document.getElementById(p+'Line2').value.trim();
 let lm=document.getElementById(p+'Landmark').value.trim();
 let typ=document.getElementById(p+'Type').value;
 let uid=getUid(); let email=currentUser.email||'';
 let fullAddr = `${v.l1}${l2?', '+l2:''}${lm?', '+lm:''}`.trim();
 let localityCombined = `${l2}${lm? ', '+lm : ''}`.trim();
 try{
  // BACKEND UPDATE - pehle backend se delete, phir backend me add
  await fetch(`${API_BASE}/address/delete`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:uid,email:email,address_id:id,id:id})});
  await new Promise(r=>setTimeout(r,400));
  await fetch(`${API_BASE}/address/add`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:uid,email:email,full_name:v.fn,phone:v.ph,alt_phone:alt,pincode:v.pin,city:v.city,state:v.state,line1:v.l1,line2:l2,landmark:lm,type:typ,full_address:fullAddr,address:fullAddr,locality:localityCombined})});
 }catch(e){ console.log(e); }
 if(btn){ btn.innerText='Update Address'; btn.disabled=false; }
 closeEditModal(); renderAddress();
}

async function addNewAddress(){
 let v = validateAddress('new');
 if(!v) return;
 let p='new';
 let alt=document.getElementById(p+'AltPhone').value.trim();
 let l2=document.getElementById(p+'Line2').value.trim();
 let lm=document.getElementById(p+'Landmark').value.trim();
 let typ=document.getElementById(p+'Type').value;
 let uid=getUid(); let email=currentUser.email||'';
 let fullAddr = `${v.l1}${l2?', '+l2:''}${lm?', '+lm:''}`.trim();
 let localityCombined = `${l2}${lm? ', '+lm : ''}`.trim();
 try{
  await fetch(`${API_BASE}/address/add`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:uid,email:email,full_name:v.fn,phone:v.ph,alt_phone:alt,pincode:v.pin,city:v.city,state:v.state,line1:v.l1,line2:l2,landmark:lm,type:typ,full_address:fullAddr,address:fullAddr,locality:localityCombined})});
  renderAddress();
 }catch(e){ console.log(e); }
}

async function renderOrders(){let el=document.getElementById('ordersContent');el.innerHTML='<div style="padding:20px;text-align:center">Loading...</div>';}
async function renderWishlist(){let el=document.getElementById('wishlistContent');el.innerHTML='<div style="padding:20px;text-align:center">Loading...</div>';}
function fillEditProfile(){document.getElementById('editName').value=currentUser.name||'';document.getElementById('editMobile').value=currentUser.mobile||currentUser.phone||'';document.getElementById('editEmail').value=currentUser.email||'';}
async function saveProfile(){let n=document.getElementById('editName').value.trim();let m=document.getElementById('editMobile').value.trim();let e=document.getElementById('editEmail').value.trim();if(!n)return;currentUser.name=n;currentUser.mobile=m;currentUser.email=e;currentUser.phone=m;localStorage.setItem('rekavo_user',JSON.stringify(currentUser));document.getElementById('pName').innerText=n;document.getElementById('pMobile').innerText=m?'+91 '+m:'';document.getElementById('pEmailShow').innerText=e||'........';closePage('editprofile');}
function getInitials(name){if(!name)return"UN";let parts=name.trim().split(" ").filter(Boolean);if(parts.length>=2)return(parts[0][0]+parts[1][0]).toUpperCase();return parts[0].substring(0,2).toUpperCase();}
function logout(){localStorage.removeItem('rekavo_user');location.href='account.html';}
function handlePhotoFile(e){let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=function(ev){let base64=ev.target.result;localStorage.setItem('rekavo_profile_photo',base64);document.getElementById('pIcon').innerHTML=`<img src="${base64}">`;};reader.readAsDataURL(file);}
document.getElementById('profileFile').addEventListener('change',handlePhotoFile);
window.addEventListener('popstate', function(e){if(e.state && e.state.page){openPage(e.state.page, false);}else if(location.hash){let type=location.hash.replace('#','');if(document.getElementById('page-'+type)){openPage(type, false);}}else{document.querySelectorAll('.page-section').forEach(s=>s.classList.add('hidden'));}});
async function updateCountsReal(){try{let uid=getUid(); let email=currentUser.email||''; if(!uid) return;let cr=await fetch(`${API_BASE}/cart/get?user_id=${uid}&email=${encodeURIComponent(email)}`);let c=await cr.json();if(Array.isArray(c)){let cnt=c.reduce((s,i)=>s+(i.qty||1),0);document.getElementById('cartCount').innerText=cnt;document.getElementById('pGridCart').innerText=cnt;}}catch(e){}}
(function(){
 let u=localStorage.getItem('rekavo_user');if(!u){location.href='account.html';return;}
 currentUser=JSON.parse(u);currentUser.user_id=currentUser.user_id||currentUser.id;
 document.getElementById('pName').innerText=currentUser.name||'User Name';
 document.getElementById('pMobile').innerText=currentUser.mobile?'+91 '+currentUser.mobile:currentUser.phone?'+91 '+currentUser.phone:'';
 document.getElementById('pEmailShow').innerText=currentUser.email||'........';
 let circle=document.getElementById('pIcon');let savedPhoto=localStorage.getItem('rekavo_profile_photo');if(savedPhoto){circle.innerHTML=`<img src="${savedPhoto}">`;}else{circle.innerText=getInitials(currentUser.name);}
 updateCountsReal();
 if(location.hash){let type=location.hash.replace('#','');if(document.getElementById('page-'+type)){openPage(type, false);}}
})();
</script>
</body>
