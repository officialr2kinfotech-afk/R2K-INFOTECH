<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://mandi-bahi-backend.vercel.app https://api.postalpincode.in; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';">
<title data-i18n="edit_profile_title">Edit Profile - Mandi Bahi</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
html,body{height:100dvh;overflow:hidden;background:#f9fafb}
.phone{width:100%;height:100dvh;display:flex;flex-direction:column;background:#f9fafb;overflow:hidden}
.header{background:#15803d;color:#fff;padding:12px 14px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.wrap{flex:1;overflow-y:auto;padding:12px}
.card{background:#fff;border-radius:14px;padding:14px}
.img-wrap{position:relative;width:90px;height:90px;margin:0 auto}
.p-circle{width:90px;height:90px;background:#e5e7eb;color:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;border:2px solid #000;overflow:hidden}
.p-circle img{width:100%;height:100%;object-fit:cover}
.edit-pencil{position:absolute;bottom:0;right:0;width:28px;height:28px;background:#000;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;border:2px solid #fff;cursor:pointer}
.input{width:100%;height:42px;border:1px solid #e5e7eb;border-radius:10px;padding:0 12px;outline:none;font-size:13px;margin:4px 0 10px;background:#fff}
.btn{width:100%;height:42px;background:#15803d;color:#fff;border:none;border-radius:999px;font-weight:800;font-size:14px;cursor:pointer;margin-top:10px}
.btn:disabled{opacity:0.6}
.hidden{display:none!important}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:200;background:#14532d;color:#fff;padding:8px 16px;border-radius:999px;font-size:12px;font-weight:700;display:none;white-space:nowrap}
.chooser{position:fixed;left:0;right:0;bottom:0;background:#fff;z-index:150;border-radius:16px 16px 0 0;padding:12px;box-shadow:0 -2px 20px rgba(0,0,0,0.15)}
.chooser-btn{width:100%;padding:14px;border-radius:10px;border:1px solid #e5e7eb;background:#fff;font-weight:700;font-size:14px;margin-top:8px;cursor:pointer}
.photo-actions{display:flex;gap:8px;margin:10px 0}
.photo-actions button{flex:1;padding:8px;border-radius:8px;border:1px solid #e5e7eb;background:#fff;font-weight:700;font-size:11px;cursor:pointer}
.otp-input{letter-spacing:6px;text-align:center;font-size:20px;font-weight:800}
.resend-btn{transition:all .3s ease}
.resend-glow{background:#15803d!important;color:#fff!important;box-shadow:0 0 18px rgba(21,128,61,.85);animation:glowPulse 1.2s infinite}
@keyframes glowPulse{0%{box-shadow:0 0 10px rgba(21,128,61,.6)}50%{box-shadow:0 0 22px rgba(21,128,61,1)}100%{box-shadow:0 0 10px rgba(21,128,61,.6)}}
.err{color:#ef4444;font-size:11px;margin:-6px 0 8px;display:none;font-weight:700}
</style>
</head>
<body>
<div class="phone">
<div class="header"><span onclick="location.href='profile.html'" style="font-size:22px;cursor:pointer">←</span><b data-i18n="edit_profile_title">Edit Profile</b></div>
<div class="wrap">
  <div class="card">
    <div style="text-align:center;margin-bottom:8px">
      <div class="img-wrap"><div class="p-circle" id="editIcon"></div><div class="edit-pencil" onclick="openPhotoChooser()">✏️</div></div>
      <div class="photo-actions">
        <button onclick="pickGallery()" data-i18n="gallery">Gallery</button>
        <button onclick="pickCamera()" data-i18n="camera">Camera</button>
        <button onclick="deletePhoto()" data-i18n="delete_photo" style="color:#ef4444">Delete</button>
      </div>
    </div>
    <label style="font-size:11px;font-weight:700" data-i18n="shop_name">Shop Name</label><input id="editShop" class="input" autocomplete="off">
    <label style="font-size:11px;font-weight:700" data-i18n="owner_name">Owner Name</label><input id="editOwner" class="input" autocomplete="off">
    <label style="font-size:11px;font-weight:700" data-i18n="mandi_name">Mandi Name</label><input id="editMandi" class="input" autocomplete="off">
    <label style="font-size:11px;font-weight:700" data-i18n="mobile_number">Mobile Number</label><input id="editMobile" class="input" maxlength="10" inputmode="numeric" autocomplete="off">
    <div id="mobileError" class="err"></div>
    <label style="font-size:11px;font-weight:700" data-i18n="email_address">Email Address</label><input id="editEmail" class="input" autocomplete="off">
    <div id="emailError" class="err"></div>
    <button class="btn" id="saveBtn" data-i18n="save_profile" onclick="handleSave()">Save Profile</button>
  </div>
</div>
</div>
<div id="photoChooser" class="chooser hidden">
  <div style="text-align:center;font-weight:800;padding:8px" data-i18n="choose_photo">Choose Photo</div>
  <button class="chooser-btn" onclick="pickGallery()" data-i18n="gallery">Gallery</button>
  <button class="chooser-btn" onclick="pickCamera()" data-i18n="camera">Camera</button>
  <button class="chooser-btn" onclick="deletePhoto()" data-i18n="delete_photo" style="color:#ef4444">Delete Photo</button>
  <button class="chooser-btn" onclick="closePhotoChooser()" data-i18n="cancel">Cancel</button>
</div>
<input type="file" id="profileFile" accept="image/*" style="display:none">
<input type="file" id="profileCamera" accept="image/*" capture="environment" style="display:none">
<div id="otpBox" class="chooser hidden">
  <div style="text-align:center;font-weight:800;padding:8px" data-i18n="otp_title">Verify OTP</div>
  <div style="text-align:center;font-size:11px;color:#6b7280;padding:4px" id="otpInfo">OTP sent to current email</div>
  <input id="otpInput" class="input otp-input" maxlength="6" inputmode="numeric" placeholder="------">
  <button class="chooser-btn" id="verifyBtn" style="background:#15803d;color:#fff" data-i18n="verify_otp" onclick="verifyOtp()">Verify OTP</button>
  <button class="chooser-btn resend-btn" id="resendBtn" data-i18n="resend_otp" onclick="resendOtp()">Resend OTP</button>
  <div style="text-align:center;font-size:11px;color:#6b7280;padding:6px" id="timerText"></div>
  <button class="chooser-btn" onclick="closeOtpBox()" data-i18n="cancel">Cancel</button>
</div>
<div id="toast" class="toast"></div>
<script>
// ================= MANDI BAHI SECURITY CORE - SECURE - DO NOT TOUCH =================
const API_BASE = "https://mandi-bahi-backend.vercel.app";
function mb_setCookie(n,v,d){ var m=d*24*60*60; document.cookie=n+"="+encodeURIComponent(v)+"; SameSite=Lax; path=/; max-age="+m; }
function mb_getCookie(n){ var m=document.cookie.match(new RegExp('(?:^|; )'+n.replace(/([.$?*|{}()\[\]\\\/+^])/g,'\\$1')+'=([^;]*)')); return m?decodeURIComponent(m[1]):null; }
function sanitize(s){ if(!s) return ""; return String(s).replace(/[<>\"'`;]/g,''); }
function checkLock(){ var l=mb_getCookie('mb_lock'); if(l&&Date.now()<parseInt(l)){ return Math.ceil((parseInt(l)-Date.now())/1000); } return 0; }
function addAttempt(){ var a=parseInt(mb_getCookie('mb_attempts')||'0')+1; mb_setCookie('mb_attempts',a,1); if(a>=3){ mb_setCookie('mb_lock',Date.now()+60000,1); mb_setCookie('mb_attempts',0,1); } return a; }
var lang=mb_getCookie('mb_lang')||'en'; if(lang!=='hi') lang='en';
(function(){ var u=new URLSearchParams(window.location.search).get('lang'); if(u){ u=sanitize(u); if(u==='hi'){ mb_setCookie('mb_lang','hi',30); lang='hi'; } } if(lang!=='hi') lang='en'; })();
var i18n={
 en:{edit_profile_title:"Edit Profile",shop_name:"Shop Name",owner_name:"Owner Name",mandi_name:"Mandi Name",mobile_number:"Mobile Number",email_address:"Email Address",save_profile:"Save Profile",gallery:"Gallery",camera:"Camera",delete_photo:"Delete Photo",choose_photo:"Choose Photo",cancel:"Cancel",saved:"Saved Successfully",otp_title:"Verify OTP - Sent to current email",verify_otp:"Verify OTP",otp_sent:"OTP sent to current email",otp_fail:"OTP Failed",otp_invalid:"Invalid OTP",sending_otp:"Sending OTP...",verifying_otp:"Verifying OTP...",resend_otp:"Resend OTP",resend_in:"Resend in",resend_available:"Resend available"},
 hi:{edit_profile_title:"प्रोफाइल एडिट",shop_name:"दुकान का नाम",owner_name:"मालिक का नाम",mandi_name:"मंडी का नाम",mobile_number:"मोबाइल नंबर",email_address:"ईमेल पता",save_profile:"प्रोफाइल सेव करें",gallery:"गैलरी",camera:"कैमरा",delete_photo:"फोटो हटाएं",choose_photo:"फोटो चुनें",cancel:"रद्द करें",saved:"सेव हो गया",otp_title:"OTP वेरिफाई - वर्तमान ईमेल पर भेजा गया",verify_otp:"OTP वेरिफाई करें",otp_sent:"OTP वर्तमान ईमेल पर भेजा गया",otp_fail:"OTP फेल",otp_invalid:"गलत OTP",sending_otp:"OTP भेज रहे हैं...",verifying_otp:"OTP वेरिफाई हो रहा है...",resend_otp:"OTP दोबारा भेजें",resend_in:"दोबारा भेजें",resend_available:"दोबारा भेज सकते हैं"}
};
function applyLang(){ document.querySelectorAll('[data-i18n]').forEach(function(e){ var k=e.getAttribute('data-i18n'); if(i18n[lang]&&i18n[lang][k]) e.textContent=i18n[lang][k]; }); }
// ================= END SECURITY CORE =================
function showToast(m){ var t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; setTimeout(function(){ t.style.display='none'; },2500); }
var currentUser=null; var currentPhotoBase64=null; var pendingPayload=null;
var otpTimer=0; var otpInterval=null;
function getInitials(n){ if(!n) return ""; var p=n.trim().split(" ").filter(Boolean); if(p.length>=2) return (p[0][0]+p[1][0]).toUpperCase(); return p[0]?p[0].substring(0,2).toUpperCase():""; }
function openPhotoChooser(){ document.getElementById('photoChooser').classList.remove('hidden'); }
function closePhotoChooser(){ document.getElementById('photoChooser').classList.add('hidden'); }
function pickGallery(){ closePhotoChooser(); document.getElementById('profileFile').click(); }
function pickCamera(){ closePhotoChooser(); document.getElementById('profileCamera').click(); }
function handlePhoto(e){ var file=e.target.files[0]; if(!file) return; var r=new FileReader(); r.onload=function(ev){ currentPhotoBase64=ev.target.result; document.getElementById('editIcon').innerHTML='<img src="'+currentPhotoBase64+'">'; }; r.readAsDataURL(file); }
function deletePhoto(){ closePhotoChooser(); currentPhotoBase64=null; document.getElementById('editIcon').textContent=getInitials(currentUser?currentUser.ownerName:""); }
document.getElementById('profileFile').addEventListener('change',handlePhoto);
document.getElementById('profileCamera').addEventListener('change',handlePhoto);
function openOtpBox(){ 
  document.getElementById('otpBox').classList.remove('hidden'); 
  document.getElementById('otpInfo').textContent=i18n[lang].otp_sent+" - "+currentUser.email; 
  startOtpTimer(60);
}
function closeOtpBox(){ 
  document.getElementById('otpBox').classList.add('hidden'); 
  document.getElementById('otpInput').value=""; 
  pendingPayload=null; 
  clearOtpTimer();
}
function startOtpTimer(sec){
  clearOtpTimer();
  otpTimer=sec;
  updateResendUI();
  otpInterval=setInterval(function(){
    otpTimer--;
    updateResendUI();
    if(otpTimer<=0){ clearOtpTimer(); }
  },1000);
}
function clearOtpTimer(){ if(otpInterval){ clearInterval(otpInterval); otpInterval=null; } }
function updateResendUI(){
  var rb=document.getElementById('resendBtn');
  if(otpTimer>0){
    rb.disabled=true;
    rb.classList.remove('resend-glow');
    rb.textContent=i18n[lang].resend_in+" "+otpTimer+"s";
  } else {
    rb.disabled=false;
    rb.classList.add('resend-glow');
    rb.textContent=i18n[lang].resend_otp;
  }
}
async function loadProfileFromDB(){
  try{
    let res=await fetch(`${API_BASE}/api/me`,{method:'GET',credentials:'include',headers:{'X-Requested-With':'XMLHttpRequest'}});
    if(!res.ok){ location.replace('login.html'); return; }
    let j=await res.json(); let d=j.data||j.user||j;
    let owner=d.owner_name||d.ownerName||d.full_name||d.name||""; 
    let shop=d.shop_name||d.shopName||""; 
    let mandi=d.mandi_name||d.mandiName||""; 
    let phone=d.phone||d.mobile||d.mobile_number||""; 
    let email=d.email||d.email_id||""; 
    let uid=d.id||d.user_id||localStorage.getItem('user_id')||"";
    if(uid){ try{ localStorage.setItem('user_id', uid); }catch(e){} }
    let photo=d.photo||d.profile_photo||null;
    currentUser={id:uid, shopName:shop, ownerName:owner, mandiName:mandi, mobile:String(phone).trim(), email:String(email).trim()}; 
    if(photo) currentPhotoBase64=photo;
    applyLang();
    document.getElementById('editShop').value=shop; document.getElementById('editOwner').value=owner; document.getElementById('editMandi').value=mandi; document.getElementById('editMobile').value=phone; document.getElementById('editEmail').value=email;
    if(photo) document.getElementById('editIcon').innerHTML='<img src="'+photo+'">'; else document.getElementById('editIcon').textContent=getInitials(owner);
  }catch(e){ location.replace('login.html'); }
}
async function handleSave(){
  var secLeft=checkLock(); if(secLeft>0){ showToast('Locked '+secLeft+' sec'); return; }
  if(!currentUser){ showToast('Loading profile...'); return; }
  var shop=sanitize(document.getElementById('editShop').value.trim());
  var owner=sanitize(document.getElementById('editOwner').value.trim());
  var mandi=sanitize(document.getElementById('editMandi').value.trim());
  var mobile=sanitize(document.getElementById('editMobile').value.trim());
  var email=sanitize(document.getElementById('editEmail').value.trim().toLowerCase());
  if(!owner){ addAttempt(); showToast('Owner Name required'); return; }
  document.getElementById('mobileError').style.display='none';
  document.getElementById('emailError').style.display='none';
  document.getElementById('editMobile').style.borderColor='#e5e7eb';
  document.getElementById('editEmail').style.borderColor='#e5e7eb';
  var isMobileChanged = mobile !== currentUser.mobile;
  var isEmailChanged = email !== currentUser.email.toLowerCase();
  if(!isMobileChanged && !isEmailChanged){
    var payloadDirect={
      id: currentUser.id, user_id: currentUser.id,
      current_email: currentUser.email, old_email: currentUser.email,
      shop_name:shop, owner_name:owner, name:owner, mandi_name:mandi,
      phone:mobile, mobile:mobile, new_phone:mobile,
      new_email: email, email: email, photo:currentPhotoBase64||""
    };
    await directSave(payloadDirect); return;
  }
  var payload={
    id: currentUser.id, user_id: currentUser.id,
    current_email: currentUser.email, old_email: currentUser.email,
    shop_name:shop, owner_name:owner, name:owner, mandi_name:mandi,
    phone:mobile, mobile:mobile, new_phone:mobile,
    new_email: email, email: email, photo:currentPhotoBase64||""
  };
  pendingPayload=payload;
  var saveBtn=document.getElementById('saveBtn');
  var oldText=saveBtn.textContent;
  saveBtn.disabled=true;
  saveBtn.textContent=i18n[lang].sending_otp;
  try{
    let bodyForOtp = { user_id: currentUser.id, id: currentUser.id, current_email: currentUser.email, old_email: currentUser.email, new_email: email, new_phone: mobile, phone: mobile, shop_name: shop, owner_name: owner, mandi_name: mandi };
    let res=await fetch(`${API_BASE}/api/mandi-bahi/send-otp`,{method:'POST',credentials:'include',headers:{'Content-Type':'application/json','X-Requested-With':'XMLHttpRequest'},body:JSON.stringify(bodyForOtp)});
    if(!res.ok){ res=await fetch(`${API_BASE}/api/send-otp`,{method:'POST',credentials:'include',headers:{'Content-Type':'application/json','X-Requested-With':'XMLHttpRequest'},body:JSON.stringify(bodyForOtp)}); }
    if(res.ok){ showToast(i18n[lang].otp_sent); openOtpBox(); }
    else { 
      let d=await res.json().catch(()=>({})); 
      let rawMsg = (d.message || d.error || d.msg || "").trim();
      let msg=rawMsg.toLowerCase();
      if(!rawMsg){ showToast(i18n[lang].otp_fail); }
      else if(msg.includes('phone') || msg.includes('mobile') || msg.includes('number')){
        let e=document.getElementById('mobileError'); e.textContent=rawMsg; e.style.display='block';
        document.getElementById('editMobile').style.borderColor='#ef4444';
      } else if(msg.includes('email')){
        let e=document.getElementById('emailError'); e.textContent=rawMsg; e.style.display='block';
        document.getElementById('editEmail').style.borderColor='#ef4444';
      } else {
        showToast(rawMsg);
      }
    }
  }catch(e){ showToast(i18n[lang].otp_fail); }
  finally{ saveBtn.disabled=false; saveBtn.textContent=oldText; applyLang(); }
}
async function directSave(payload){
  var saveBtn=document.getElementById('saveBtn');
  saveBtn.disabled=true; var oldText=saveBtn.textContent; saveBtn.textContent=i18n[lang].sending_otp;
  try{
    let res=await fetch(`${API_BASE}/api/mandi-bahi/update-profile`,{method:'POST',credentials:'include',headers:{'Content-Type':'application/json','X-Requested-With':'XMLHttpRequest'},body:JSON.stringify(payload)});
    if(!res.ok){ res=await fetch(`${API_BASE}/api/update-profile`,{method:'POST',credentials:'include',headers:{'Content-Type':'application/json','X-Requested-With':'XMLHttpRequest'},body:JSON.stringify(payload)}); }
    let data=await res.json();
    if(res.ok){ mb_setCookie('mb_attempts',0,1); showToast(i18n[lang].saved); setTimeout(function(){ location.href='profile.html'; },800); }
    else { showToast(data.message||"Save failed"); saveBtn.disabled=false; saveBtn.textContent=oldText; applyLang(); }
  }catch(e){ showToast("Save failed"); saveBtn.disabled=false; saveBtn.textContent=oldText; applyLang(); }
}
async function verifyOtp(){
  var otp=sanitize(document.getElementById('otpInput').value.trim());
  if(!otp || otp.length<4){ showToast(i18n[lang].otp_invalid); return; }
  if(!pendingPayload){ showToast(i18n[lang].otp_fail); return; }
  var verifyBtn=document.getElementById('verifyBtn'); var oldText=verifyBtn.textContent; verifyBtn.disabled=true; verifyBtn.textContent=i18n[lang].verifying_otp;
  try{
    let finalPayload = {...pendingPayload, otp: otp, current_email: currentUser.email, old_email: currentUser.email, id: currentUser.id, user_id: currentUser.id};
    let res=await fetch(`${API_BASE}/api/mandi-bahi/verify-otp`,{method:'POST',credentials:'include',headers:{'Content-Type':'application/json','X-Requested-With':'XMLHttpRequest'},body:JSON.stringify(finalPayload)});
    if(!res.ok){ res=await fetch(`${API_BASE}/api/verify-otp`,{method:'POST',credentials:'include',headers:{'Content-Type':'application/json','X-Requested-With':'XMLHttpRequest'},body:JSON.stringify(finalPayload)}); }
    let data=await res.json();
    if(res.ok && (data.success || data.verified)){ mb_setCookie('mb_attempts',0,1); showToast(i18n[lang].saved); closeOtpBox(); setTimeout(function(){ location.href='profile.html'; },800); }
    else { showToast(data.message||i18n[lang].otp_invalid); addAttempt(); verifyBtn.disabled=false; verifyBtn.textContent=oldText; applyLang(); }
  }catch(e){ showToast(i18n[lang].otp_fail); verifyBtn.disabled=false; verifyBtn.textContent=oldText; applyLang(); }
}
async function resendOtp(){
  if(otpTimer>0) return; if(!pendingPayload) return;
  var rb=document.getElementById('resendBtn'); rb.disabled=true; rb.textContent=i18n[lang].sending_otp;
  try{
    let bodyForOtp = { user_id: currentUser.id, id: currentUser.id, current_email: currentUser.email, old_email: currentUser.email, new_email: pendingPayload.new_email, new_phone: pendingPayload.new_phone, phone: pendingPayload.new_phone, shop_name: pendingPayload.shop_name, owner_name: pendingPayload.owner_name, mandi_name: pendingPayload.mandi_name };
    let res=await fetch(`${API_BASE}/api/mandi-bahi/resend-otp`,{method:'POST',credentials:'include',headers:{'Content-Type':'application/json','X-Requested-With':'XMLHttpRequest'},body:JSON.stringify(bodyForOtp)});
    if(!res.ok){ res=await fetch(`${API_BASE}/api/resend-otp`,{method:'POST',credentials:'include',headers:{'Content-Type':'application/json','X-Requested-With':'XMLHttpRequest'},body:JSON.stringify(bodyForOtp)}); if(!res.ok){ res=await fetch(`${API_BASE}/api/mandi-bahi/send-otp`,{method:'POST',credentials:'include',headers:{'Content-Type':'application/json','X-Requested-With':'XMLHttpRequest'},body:JSON.stringify(bodyForOtp)}); } }
    if(res.ok){ showToast(i18n[lang].otp_sent); startOtpTimer(60); }
    else { let d=await res.json().catch(()=>({})); showToast(d.message||d.error||i18n[lang].otp_fail); rb.disabled=false; rb.textContent=i18n[lang].resend_otp; }
  }catch(e){ showToast(i18n[lang].otp_fail); rb.disabled=false; rb.textContent=i18n[lang].resend_otp; }
}
document.getElementById('editMobile').addEventListener('input',function(){ document.getElementById('mobileError').style.display='none'; this.style.borderColor='#e5e7eb'; });
document.getElementById('editEmail').addEventListener('input',function(){ document.getElementById('emailError').style.display='none'; this.style.borderColor='#e5e7eb'; });
loadProfileFromDB();
</script>
</body>
</html>
