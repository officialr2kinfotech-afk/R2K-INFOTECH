<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart - REKAVO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Roboto,Arial,sans-serif}
body{background:#f1f3f6;padding-bottom:120px}
.top-strip{background:#e6efff;color:#1a4ab0;text-align:center;padding:7px 12px;font-size:12px;font-weight:800;position:sticky;top:0;z-index:100}
.header{background:#2874f0;color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:31px;z-index:99}
.cart-wrap{margin:8px}
.cart-item{background:#fff;border-radius:4px;padding:12px;display:flex;gap:12px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.cart-item img{width:80px;height:80px;object-fit:contain;border:1px solid #f0f0f0;border-radius:4px}
.cart-info{flex:1}
.cart-info b{font-size:13px}
.cart-info div{font-size:12px;color:#555;margin-top:4px}
.qty-row{display:flex;align-items:center;gap:8px;margin-top:8px}
.qty-row button{width:28px;height:28px;border:1px solid #ddd;background:#fff;border-radius:50%;font-weight:700;cursor:pointer}
.remove{color:#d93025;font-size:12px;font-weight:700;cursor:pointer;margin-top:6px;display:inline-block}
.summary{background:#fff;border-radius:4px;padding:12px;margin:8px;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.summary h3{font-size:14px;margin-bottom:8px}
.summary div{display:flex;justify-content:space-between;font-size:13px;margin:4px 0}
.summary b{font-size:14px}
.checkout-btn{position:fixed;bottom:65px;left:0;right:0;background:#fff;padding:10px 12px;display:flex;gap:10px;border-top:1px solid #ddd;z-index:99}
.checkout-btn button{flex:1;height:44px;border:none;border-radius:4px;font-weight:800;color:#fff;cursor:pointer}
.cont{background:#fff;color:#000!important;border:1px solid #ddd!important}
.buy{background:#fb641b}
.empty{background:#fff;margin:20px;border-radius:8px;padding:40px 20px;text-align:center}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid #ddd;z-index:100}
.bottom-nav a{text-align:center;text-decoration:none;color:#555;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;flex:1}
.bottom-nav a.active{color:#2874f0}
</style>
</head>
<body>
<div class="top-strip">🔥 Use Coupon For Extra Discount At 20%, 40%, 50%, 80% And More....</div>
<div class="header"><span onclick="location.href='index.html'" style="font-size:20px;cursor:pointer">←</span><b>My Cart (<span id="cartHeadCount">0</span>)</b></div>

<div id="cartList" class="cart-wrap"><div style="padding:20px;text-align:center">Loading...</div></div>
<div id="summary" class="summary" style="display:none"></div>

<div class="checkout-btn" id="checkoutBtn" style="display:none">
<button class="cont" onclick="location.href='index.html'">Continue Shopping</button>
<button class="buy" onclick="goCheckout()">Place Order</button>
</div>

<div class="bottom-nav">
<a href="index.html"><span>🏠</span><span>Home</span></a>
<a href="account.html"><span>👤</span><span>Account</span></a>
<a href="cart.html" class="active"><span>🛒</span><span>Cart (<span id="cartCount">0</span>)</span></a>
</div>

<script>
const API_BASE="https://rekavo-backend.vercel.app";
function getUser(){try{let u=JSON.parse(localStorage.getItem('rekavo_user')); if(!u) return null; u.user_id=u.user_id||u.id||u._id; return u;}catch(e){return null}}

async function loadCart(){
 let u=getUser();
 let cart=[];
 if(!u){
   cart=JSON.parse(localStorage.getItem('rekavo_cart')||'[]');
   renderCart(cart);
   return;
 }
 try{
  let res=await fetch(`${API_BASE}/cart/get?user_id=${u.user_id}`);
  let data=await res.json();
  cart=Array.isArray(data)?data:[];
  // localStorage ko bhi update rakho taaki count sahi rahe
  localStorage.setItem('rekavo_cart',JSON.stringify(cart.map(i=>({product_id:i.product_id||i.id, id:i.product_id||i.id, name:i.name, price:i.price, qty:i.qty||1, img:i.image||i.img, image:i.image||i.img}))));
  renderCart(cart);
 }catch(e){
  cart=JSON.parse(localStorage.getItem('rekavo_cart')||'[]');
  renderCart(cart);
 }
}

function renderCart(cart){
 let list=document.getElementById('cartList');
 let head=document.getElementById('cartHeadCount');
 let countEl=document.getElementById('cartCount');
 let totalCount=cart.reduce((s,i)=>s+(i.qty||i.quantity||1),0);
 head.innerText=totalCount;
 countEl.innerText=totalCount;

 if(cart.length===0){
   list.innerHTML=`<div class="empty"><h3>Your cart is empty!</h3><p style="font-size:12px;color:#878787;margin-top:6px">Add items to it now.</p><button onclick="location.href='index.html'" style="margin-top:12px;padding:8px 16px;background:#2874f0;color:#fff;border:none;border-radius:4px;font-weight:700;cursor:pointer">Shop now</button></div>`;
   document.getElementById('summary').style.display='none';
   document.getElementById('checkoutBtn').style.display='none';
   return;
 }

 let html='';
 let total=0;
 cart.forEach((item,idx)=>{
   let qty=item.qty||item.quantity||1;
   let price=item.price||0;
   total+=price*qty;
   let img=item.image||item.img||'';
   let name=item.name||'Product';
   let pid=item.product_id||item.id||name;
   html+=`<div class="cart-item"><img src="${img}"><div class="cart-info"><b>${name}</b><div>₹${price} x ${qty} = ₹${price*qty}</div><div class="qty-row"><button onclick="updateQty('${pid}',${qty-1})">-</button><span>${qty}</span><button onclick="updateQty('${pid}',${qty+1})">+</button></div><span class="remove" onclick="removeItem('${pid}')">Remove</span></div></div>`;
 });
 list.innerHTML=html;

 document.getElementById('summary').style.display='block';
 document.getElementById('summary').innerHTML=`<h3>Price Details</h3><div><span>Price (${totalCount} items)</span><span>₹${total}</span></div><div><span>Delivery Charges</span><span style="color:#26a541">FREE</span></div><div style="border-top:1px dashed #ddd;margin-top:8px;padding-top:8px"><b>Total Amount</b><b>₹${total}</b></div>`;
 document.getElementById('checkoutBtn').style.display='flex';
}

async function updateQty(pid,newQty){
 if(newQty<1){ removeItem(pid); return; }
 let u=getUser();
 let cart=JSON.parse(localStorage.getItem('rekavo_cart')||'[]');
 let found=cart.find(c=>(c.product_id===pid)||(c.id===pid));
 if(found){ found.qty=newQty; }
 localStorage.setItem('rekavo_cart',JSON.stringify(cart));
 renderCart(cart);
 if(u){
   try{ await fetch(`${API_BASE}/cart/update`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:u.user_id, product_id:pid, qty:newQty})}); }catch(e){}
   loadCart();
 }
}

async function removeItem(pid){
 let u=getUser();
 let cart=JSON.parse(localStorage.getItem('rekavo_cart')||'[]');
 cart=cart.filter(c=>(c.product_id!==pid && c.id!==pid));
 localStorage.setItem('rekavo_cart',JSON.stringify(cart));
 renderCart(cart);
 if(u){
   try{ await fetch(`${API_BASE}/cart/remove`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:u.user_id, product_id:pid})}); }catch(e){}
   loadCart();
 }
}

function goCheckout(){ location.href='checkout.html'; }

loadCart();
</script>
</body>
</html>
