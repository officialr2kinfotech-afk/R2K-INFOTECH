<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Cart - REKAVO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Roboto,sans-serif}
body{background:#f1f3f6;padding-bottom:130px}
.top-strip{background:#e6efff;color:#1a4ab0;text-align:center;padding:7px;font-size:12px;font-weight:800}
.header{background:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 2px rgba(0,0,0,.1);position:sticky;top:0;z-index:99}
.empty-wrap{background:#fff;min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.empty-icon{width:140px;height:140px;background:#f5f5f5;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:70px;margin-bottom:15px}
.empty-title{font-size:16px;font-weight:600;margin-bottom:18px}
.btn-blue{background:#2874f0;color:#fff;border:none;padding:10px 50px;border-radius:3px;font-weight:600}
.cart-card{background:#fff;margin-bottom:8px;padding:12px}
.item-top{display:flex;gap:12px;cursor:pointer}
.item-img{width:90px;height:90px;object-fit:contain;border:1px solid #f0f0f0;border-radius:4px}
.item-name{font-size:14px;font-weight:500}
.item-detail{font-size:12px;color:#666;margin-top:6px}
.item-price{font-size:18px;font-weight:800;margin-top:8px}
.qty-box{display:flex;align-items:center;gap:12px;margin-top:12px}
.qty-btn{width:32px;height:32px;border:1px solid #c2c2c2;background:#fff;border-radius:50%;font-size:18px;font-weight:700;cursor:pointer}
.qty-num{font-weight:700;min-width:20px;text-align:center}
.action-row{display:flex;gap:10px;margin-top:14px}
.btn-red{flex:1;background:#ff3b3b;color:#fff;border:none;padding:11px 0;border-radius:4px;font-weight:700}
.btn-green{flex:1;background:#0d9d4b;color:#fff;border:none;padding:11px 0;border-radius:4px;font-weight:700}
.bottom-bar{position:fixed;bottom:50px;left:0;right:0;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;box-shadow:0 -2px 8px rgba(0,0,0,.15)}
.place-btn{background:#fb641b;color:#fff;border:none;padding:13px 35px;border-radius:3px;font-weight:700}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:6px 0;border-top:1px solid #ddd}
.bottom-nav a{text-decoration:none;color:#555;font-size:11px;display:flex;flex-direction:column;align-items:center;flex:1}
.bottom-nav a.active{color:#2874f0}
</style>
</head>
<body>
<div class="top-strip">🔥 Extra Discount Coupons Available</div>
<div class="header"><span onclick="history.back()">←</span><h1>My Cart (<span id="cartCount">0</span>)</h1></div>
<div id="cartContainer"></div>
<div id="bottomBar"></div>
<div class="bottom-nav">
<a href="index.html">🏠<span>Home</span></a>
<a href="account.html">👤<span>Account</span></a>
<a href="cart.html" class="active">🛒<span>Cart</span></a>
</div>
<script>
function getCart(){let c=JSON.parse(localStorage.getItem('rekavo_cart')||'[]');return c.map(i=>{if(!i.qty)i.qty=1;return i;})}
function saveCart(c){localStorage.setItem('rekavo_cart',JSON.stringify(c));render();}
function openProduct(i){localStorage.setItem('rekavo_selected_product',JSON.stringify(getCart()[i]));location.href='product.html';}
function render(){
 let cart=getCart();
 document.getElementById('cartCount').innerText=cart.length;
 let con=document.getElementById('cartContainer');
 let bar=document.getElementById('bottomBar');
 if(cart.length===0){
  let user=localStorage.getItem('rekavo_user');
  if(user){con.innerHTML=`<div class="empty-wrap"><div class="empty-icon">🛒</div><div class="empty-title">Your cart is empty!</div><button class="btn-blue" onclick="location.href='index.html'">Shop now</button></div>`;}
  else{con.innerHTML=`<div class="empty-wrap"><div class="empty-icon">🛒</div><div class="empty-title">Missing Cart items?</div><button class="btn-blue" onclick="location.href='account.html'">Login</button></div>`;}
  bar.innerHTML='';return;
 }
 let html='',total=0;
 cart.forEach((item,idx)=>{
  let itemTotal=item.price*item.qty;total+=itemTotal;
  html+=`<div class="cart-card">
   <div class="item-top" onclick="openProduct(${idx})"><img class="item-img" src="${item.img}"><div><div class="item-name">${item.name}</div><div class="item-detail">${item.detail||item.description||''}</div><div class="item-price">₹${itemTotal.toLocaleString()}</div></div></div>
   <div class="qty-box"><button class="qty-btn" onclick="changeQty(${idx},-1)">-</button><span class="qty-num">${item.qty}</span><button class="qty-btn" onclick="changeQty(${idx},1)">+</button></div>
   <div class="action-row"><button class="btn-red" onclick="removeItem(${idx})">REMOVE</button><button class="btn-green" onclick="buyNow(${idx})">BUY THIS NOW</button></div>
  </div>`;
 });
 con.innerHTML=html;
 bar.innerHTML=`<div class="bottom-bar"><div style="font-weight:800;font-size:18px">₹${total.toLocaleString()}</div><button class="place-btn" onclick="location.href='checkout.html'">PLACE ORDER</button></div>`;
}
function changeQty(i,d){let c=getCart();c[i].qty+=d;if(c[i].qty<1)c[i].qty=1;if(c[i].qty>5)c[i].qty=5;saveCart(c);}
function removeItem(i){if(confirm('Remove?')){let c=getCart();c.splice(i,1);saveCart(c);}}
function buyNow(i){localStorage.setItem('rekavo_buy_now',JSON.stringify(getCart()[i]));location.href='checkout.html';}
render();
</script>
</body>
</html>
