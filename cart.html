<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Cart - REKAVO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Roboto,sans-serif}
body{background:#f1f3f6;padding-bottom:130px}
.top{position:sticky;top:0;background:#2874f0;color:#fff;padding:14px;display:flex;align-items:center;gap:14px;z-index:10}
.top b{font-size:16px;color:#fff}

/* EMPTY CART - PEHLE JAISA */
.empty-box{background:#fff;padding:40px 20px;text-align:center;min-height:60vh}
.empty-box img{width:140px;height:140px;object-fit:contain;margin-bottom:16px;opacity:0.9}
.empty-box h3{font-size:18px;font-weight:700;margin-bottom:6px}
.empty-box p{font-size:13px;color:#878787;margin-bottom:18px;line-height:1.4}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn-login{background:#2874f0;color:#fff;border:1px solid #2874f0;padding:10px 28px;border-radius:4px;font-weight:700;font-size:14px;cursor:pointer}
.btn-shop{background:#fff;color:#2874f0;border:1px solid #2874f0;padding:10px 28px;border-radius:4px;font-weight:700;font-size:14px;cursor:pointer}

/* FILLED CART - FLIPKART JAISA */
.cart-item{background:#fff;margin-bottom:8px;padding:12px}
.badge{color:#26a541;background:#e6f4ea;font-size:11px;font-weight:700;padding:3px 6px;border-radius:3px;display:inline-block;margin-bottom:8px}
.item-row{display:flex;gap:12px}
.item-row img{width:88px;height:88px;object-fit:contain;border:1px solid #f0f0f0;border-radius:6px}
.item-info{flex:1;min-width:0}
.item-name{font-size:14px;font-weight:500;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item-size{font-size:12px;color:#878787;margin-top:4px}
.item-rating{font-size:12px;margin-top:6px;display:flex;align-items:center;gap:6px;color:#878787}
.stars{color:#26a541;font-size:13px}
.price-row{display:flex;align-items:center;gap:10px;margin-top:14px}
.qty-box{border:1px solid #e0e0e0;border-radius:4px;padding:6px 10px;font-size:13px;font-weight:700;background:#fff;display:flex;align-items:center;gap:6px;cursor:pointer}
.off{color:#26a541;font-size:14px;font-weight:700}
.old{text-decoration:line-through;color:#878787;font-size:14px}
.new{font-size:18px;font-weight:800}
.delivery{font-size:12px;margin-top:10px}
.action-row{display:flex;border-top:1px solid #f0f0f0;margin-top:12px}
.action-row button{flex:1;background:#fff;border:none;padding:14px 4px;font-size:13px;font-weight:600;color:#616161;display:flex;align-items:center;justify-content:center;gap:5px;border-right:1px solid #f0f0f0;cursor:pointer}
.action-row button:last-child{border-right:none}

.bottom-bar{position:fixed;bottom:50px;left:0;right:0;background:#fff;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 -2px 10px rgba(0,0,0,.15);z-index:99}
.place-btn{background:#fb641b;color:#fff;border:none;padding:14px 38px;border-radius:4px;font-weight:800;font-size:15px}

/* FIXED BOTTOM NAV - NO TUTEGA */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;align-items:center;padding:6px 0;border-top:1px solid #ddd;z-index:100;height:50px}
.bottom-nav a{text-decoration:none;color:#555;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;white-space:nowrap;line-height:1.1}
.bottom-nav a.active{color:#2874f0}
.bottom-nav a span{white-space:nowrap!important;display:block}
</style>
</head>
<body>
<div class="top"><span onclick="history.back()" style="font-size:20px;cursor:pointer">←</span><b>My Cart (<span id="count">0</span>)</b></div>
<div id="cartContainer"></div>

<div class="bottom-bar" id="bottomBar" style="display:none">
  <div><div id="totalOld" style="font-size:13px;color:#878787;text-decoration:line-through">0</div><div id="totalNew" style="font-size:20px;font-weight:800">₹0</div></div>
  <button class="place-btn" onclick="placeOrder()">Place order</button>
</div>

<div class="bottom-nav">
  <a href="index.html"><span>🏠</span><span>Home</span></a>
  <a href="account.html"><span>👤</span><span>Account</span></a>
  <a href="cart.html" class="active"><span>🛒</span><span>Cart (<span id="navCount">0</span>)</span></a>
</div>

<script>
let cart = JSON.parse(localStorage.getItem('rekavo_cart')||'[]');
let user = JSON.parse(localStorage.getItem('rekavo_user')||'null');

document.getElementById('count').innerText=cart.length;
document.getElementById('navCount').innerText=cart.length;

if(cart.length===0){
  // PEHLE JAISA EMPTY CART WITH TROLLEY
  if(!user){
    document.getElementById('cartContainer').innerHTML=`
      <div class="empty-box">
        <img src="https://cdn-icons-png.flaticon.com/512/2038/2038855.png" alt="cart">
        <h3>Missing Cart items?</h3>
        <p>Login to see the items you added previously</p>
        <div class="btns">
          <button class="btn-login" onclick="location.href='account.html'">Login</button>
          <button class="btn-shop" onclick="location.href='index.html'">Continue Shopping</button>
        </div>
      </div>`;
  } else {
    document.getElementById('cartContainer').innerHTML=`
      <div class="empty-box">
        <img src="https://cdn-icons-png.flaticon.com/512/2038/2038855.png" alt="cart">
        <h3>Your cart is empty!</h3>
        <p>Add items to it now.</p>
        <div class="btns">
          <button class="btn-shop" onclick="location.href='index.html'">Continue Shopping</button>
        </div>
      </div>`;
  }
  document.getElementById('bottomBar').style.display='none';
} else {
  // LOGIN NAHI HAI TO BHI CART NAHI DIKHAYEGA - LOGIN PE BHEJEGA
  if(!user){
    document.getElementById('cartContainer').innerHTML=`
      <div class="empty-box">
        <img src="https://cdn-icons-png.flaticon.com/512/2038/2038855.png" alt="cart">
        <h3>Missing Cart items?</h3>
        <p>Login to see the items you added previously (${cart.length} items)</p>
        <div class="btns">
          <button class="btn-login" onclick="location.href='account.html'">Login</button>
          <button class="btn-shop" onclick="location.href='index.html'">Continue Shopping</button>
        </div>
      </div>`;
    document.getElementById('bottomBar').style.display='none';
  } else {
    renderCart();
  }
}

function renderCart(){
  cart = JSON.parse(localStorage.getItem('rekavo_cart')||'[]');
  let totalOld=0, totalNew=0;
  document.getElementById('bottomBar').style.display='flex';
  document.getElementById('cartContainer').innerHTML = cart.map((p,i)=>{
    let off = p.originalPrice? Math.round(((p.originalPrice-p.price)/p.originalPrice)*100) : 37;
    totalOld+= (p.originalPrice||Math.round(p.price*1.6))*(p.qty||1);
    totalNew+= p.price*(p.qty||1);
    return `<div class="cart-item">
      <div class="badge">Big Billion Days Price</div>
      <div class="item-row">
        <img src="${p.img}">
        <div class="item-info">
          <div class="item-name">${p.name}</div>
          <div class="item-size">Color: Black, Warranty: 6 Months</div>
          <div class="item-rating"><span class="stars">★★★★★</span> 4.4 • (10,671) <span style="color:#2874f0;font-weight:700">✓Assured</span></div>
        </div>
      </div>
      <div class="price-row">
        <div class="qty-box" onclick="changeQty(${i})">Qty: ${p.qty||1} ▼</div>
        <span class="off">↓${off}%</span>
        <span class="old">₹${p.originalPrice||Math.round(p.price*1.6)}</span>
        <span class="new">₹${p.price}</span>
      </div>
      <div class="delivery">Delivery by ${new Date(Date.now()+3*86400000).toLocaleDateString('en-IN',{day:'numeric',month:'short'})} | <span style="color:#26a541">Free</span></div>
      <div class="action-row">
        <button onclick="saveLater(${i})">⤓ Save for later</button>
        <button onclick="removeItem(${i})">🗑 Remove</button>
        <button onclick="buyNowItem(${i})">⚡ Buy now</button>
      </div>
    </div>`;
  }).join('');
  document.getElementById('totalOld').innerText='₹'+totalOld.toLocaleString('en-IN');
  document.getElementById('totalNew').innerText='₹'+totalNew.toLocaleString('en-IN');
  document.getElementById('count').innerText=cart.length;
  document.getElementById('navCount').innerText=cart.length;
}
function changeQty(i){
  let c=JSON.parse(localStorage.getItem('rekavo_cart')||'[]');
  let q=prompt("Enter Qty 1-5", c[i].qty||1);
  if(q){ c[i].qty=Math.min(5,Math.max(1,parseInt(q)||1)); localStorage.setItem('rekavo_cart',JSON.stringify(c)); renderCart(); }
}
function removeItem(i){ let c=JSON.parse(localStorage.getItem('rekavo_cart')||'[]'); c.splice(i,1); localStorage.setItem('rekavo_cart',JSON.stringify(c)); location.reload(); }
function saveLater(i){ removeItem(i); }
function buyNowItem(i){ let c=JSON.parse(localStorage.getItem('rekavo_cart')||'[]'); localStorage.setItem('rekavo_cart',JSON.stringify([c[i]])); location.href='checkout.html'; }
function placeOrder(){ location.href='checkout.html'; }
</script>
</body>
</html>
