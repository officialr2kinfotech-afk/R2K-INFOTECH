<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Cart - REKAVO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Roboto,sans-serif}
body{background:#f1f3f6;padding-bottom:130px}
.top-strip{background:#e6efff;color:#1a4ab0;text-align:center;padding:7px 12px;font-size:12px;font-weight:800}
.search-wrapper{background:#2874f0;padding:10px 12px;position:sticky;top:0;z-index:99}
.search-box{width:100%;display:flex;background:#fff;border-radius:2px;overflow:hidden;height:42px}
.search-box input{flex:1;border:none;padding:0 14px;outline:none}
.search-box button{background:#fff;border:none;color:#2874f0;padding:0 18px;font-size:20px;font-weight:900}

/* Empty */
.empty-cart-wrap{background:#fff;min-height:75vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 20px;text-align:center}
.trolley-big{font-size:90px;margin-bottom:15px;background:#f7f7f7;width:150px;height:150px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.empty-title{font-size:18px;font-weight:700;margin-bottom:22px}
.btn-login{background:#2874f0;color:#fff;border:none;padding:11px 70px;border-radius:4px;font-weight:700;font-size:15px;cursor:pointer}
.btn-shop{background:#2874f0;color:#fff;border:none;padding:12px 50px;border-radius:4px;font-weight:700;font-size:14px;cursor:pointer}
.continue-link{color:#2874f0;margin-top:16px;font-size:14px;font-weight:600;text-decoration:none;cursor:pointer}

/* Cart Items New */
.cart-card{background:#fff;margin:8px 0;border-radius:2px;padding:12px}
.cart-item{display:flex;gap:10px;padding-bottom:12px;border-bottom:1px solid #f0f0f0}
.cart-item img{width:80px;height:80px;object-fit:contain;border:1px solid #f0f0f0;border-radius:4px}
.item-details{flex:1}
.item-name{font-size:14px;font-weight:500;line-height:18px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item-price{color:#000;font-weight:700;font-size:16px;margin-top:6px}
.item-price.cut{color:#878787;font-weight:400;font-size:13px;text-decoration:line-through;margin-left:6px}
.item-price.off{color:#388e3c;font-size:13px;margin-left:6px}
.qty-row{display:flex;align-items:center;gap:12px;margin-top:10px}
.qty-btn{width:28px;height:28px;border:1px solid #c2c2c2;border-radius:50%;background:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer}
.qty-num{border:1px solid #e0e0e0;width:32px;height:28px;text-align:center;font-size:14px;font-weight:600;border-radius:3px;display:flex;align-items:center;justify-content:center}
.action-row{display:flex;gap:20px;margin-top:14px}
.action-btn{font-size:13px;font-weight:700;color:#000;background:#fff;border:1px solid #e0e0e0;padding:7px 14px;border-radius:4px;cursor:pointer;text-transform:uppercase}
.action-btn.remove{color:#212121}
.action-btn.buy{color:#2874f0;border-color:#2874f0}

/* Price Details */
.price-card{background:#fff;margin:8px 0;padding:12px;border-radius:2px}
.price-title{font-size:14px;font-weight:700;border-bottom:1px solid #f0f0f0;padding-bottom:10px;margin-bottom:10px}
.price-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0}
.price-row.total{font-weight:700;font-size:14px;border-top:1px dashed #e0e0e0;margin-top:8px;padding-top:10px}
.price-row.save{color:#388e3c;font-weight:600}

/* Place Order Bar */
.place-bar{position:fixed;bottom:52px;left:0;right:0;background:#fff;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 -2px 10px rgba(0,0,0,.1);z-index:998}
.place-price{font-size:18px;font-weight:800}
.place-btn{background:#fb641b;color:#fff;border:none;padding:12px 40px;border-radius:4px;font-weight:700;font-size:14px;cursor:pointer}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid #ddd;z-index:999}
.bottom-nav a{text-align:center;text-decoration:none;color:#555;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;white-space:nowrap;flex:1}
.bottom-nav a.active{color:#2874f0}
</style>
</head>
<body>
<div class="top-strip">🔥 Use Coupon For Extra Discount At 20%, 40%, 50%, 80% And More....</div>
<div class="search-wrapper"><div class="search-box"><input placeholder="Search for products" onclick="location.href='index.html'"><button>⌕</button></div></div>

<div id="cartContainer"></div>
<div id="priceDetails"></div>
<div id="placeBar"></div>

<div class="bottom-nav">
<a href="index.html"><span>🏠</span><span>Home</span></a>
<a href="account.html"><span>👤</span><span>Account</span></a>
<a href="cart.html" class="active"><span>🛒</span><span>Cart (<span id="cartCount">0</span>)</span></a>
</div>

<script>
function getCart(){
  let c = JSON.parse(localStorage.getItem('rekavo_cart')||'[]');
  // purane items me qty nahi thi toh 1 add kar do
  return c.map(i=>{ if(!i.qty) i.qty=1; return i; });
}
function saveCart(c){ localStorage.setItem('rekavo_cart', JSON.stringify(c)); render(); }

function render(){
  let cart = getCart();
  let user = localStorage.getItem('rekavo_user');
  document.getElementById('cartCount').innerText = cart.length;
  let container = document.getElementById('cartContainer');
  let priceDiv = document.getElementById('priceDetails');
  let placeDiv = document.getElementById('placeBar');

  if(cart.length === 0){
    container.innerHTML = user?
    `<div class="empty-cart-wrap"><div class="trolley-big">🛒</div><div class="empty-title">Your cart is empty!</div><button class="btn-shop" onclick="location.href='index.html'">Shop now</button></div>` :
    `<div class="empty-cart-wrap"><div class="trolley-big">🛒</div><div class="empty-title">Missing Cart items?</div><button class="btn-login" onclick="location.href='account.html'">Login</button><a class="continue-link" href="index.html">Continue Shopping</a></div>`;
    priceDiv.innerHTML=''; placeDiv.innerHTML='';
    return;
  }

  let html='';
  cart.forEach((item,index)=>{
    let original = item.original || (item.price*2);
    let off = Math.round(((original - item.price)/original)*100);
    html+=`
      <div class="cart-card">
        <div class="cart-item">
          <img src="${item.img}" onerror="this.src='https://via.placeholder.com/80'">
          <div class="item-details">
            <div class="item-name">${item.name}</div>
            <div class="item-price">₹${item.price * item.qty} <span class="cut">₹${original * item.qty}</span> <span class="off">${off}% Off</span></div>
            <div style="font-size:12px;color:#388e3c;margin-top:4px">In Stock • Free Delivery</div>
            <div class="qty-row">
              <button class="qty-btn" onclick="changeQty(${index},-1)">−</button>
              <div class="qty-num">${item.qty}</div>
              <button class="qty-btn" onclick="changeQty(${index},1)">+</button>
            </div>
          </div>
        </div>
        <div class="action-row">
          <button class="action-btn remove" onclick="removeItem(${index})">Remove</button>
          <button class="action-btn buy" onclick="buyNow(${index})">Buy This Now</button>
        </div>
      </div>
    `;
  });
  container.innerHTML = html;

  // Price Details
  let totalMrp=0, totalPrice=0;
  cart.forEach(i=>{
    let orig = i.original || i.price*2;
    totalMrp += orig * i.qty;
    totalPrice += i.price * i.qty;
  });
  let discount = totalMrp - totalPrice;
  priceDiv.innerHTML = `
    <div class="price-card">
      <div class="price-title">PRICE DETAILS (${cart.length} Items)</div>
      <div class="price-row"><span>Price (${cart.length} items)</span><span>₹${totalMrp}</span></div>
      <div class="price-row"><span>Discount</span><span style="color:#388e3c">- ₹${discount}</span></div>
      <div class="price-row"><span>Delivery Charges</span><span style="color:#388e3c">FREE</span></div>
      <div class="price-row total"><span>Total Amount</span><span>₹${totalPrice}</span></div>
      <div class="price-row save">You will save ₹${discount} on this order</div>
    </div>
  `;

  // Place Order Bar
  placeDiv.innerHTML = `
    <div class="place-bar">
      <div class="place-price">₹${totalPrice}</div>
      <button class="place-btn" onclick="placeOrder()">PLACE ORDER</button>
    </div>
  `;
}

function changeQty(idx, delta){
  let cart = getCart();
  cart[idx].qty += delta;
  if(cart[idx].qty < 1) cart[idx].qty = 1;
  saveCart(cart);
}
function removeItem(idx){
  if(!confirm('Remove this item from cart?')) return;
  let cart = getCart();
  cart.splice(idx,1);
  saveCart(cart);
}
function buyNow(idx){
  let cart = getCart();
  let item = cart[idx];
  localStorage.setItem('rekavo_buy_now', JSON.stringify(item));
  location.href='checkout.html';
}
function placeOrder(){
  let user = localStorage.getItem('rekavo_user');
  if(!user){ location.href='account.html'; return; }
  location.href='checkout.html';
}

render();
</script>
</body>
</html>
