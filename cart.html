<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Cart - REKAVO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Roboto, Arial, sans-serif}
body{background:#f1f3f6;padding-bottom:135px}
.top-strip{background:#e6efff;color:#1a4ab0;text-align:center;padding:7px;font-size:12px;font-weight:700}
.header{background:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 1px rgba(0,0,0,.1);position:sticky;top:0;z-index:10}
.header h1{font-size:18px;font-weight:600}
.empty-wrap{background:#fff;min-height:65vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center}
.empty-img{width:150px;height:150px;background:#f9f9f9;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:80px;margin-bottom:15px}
.btn-blue{background:#2874f0;color:#fff;border:none;padding:11px 40px;border-radius:2px;font-weight:600;font-size:14px}
.cart-card{background:#fff;margin-bottom:8px;padding:12px 12px 0 12px;border-top:1px solid #f0f0f0;border-bottom:1px solid #f0f0f0}
.item-top{display:flex;gap:12px}
.item-img-wrap{width:88px;height:88px;border:1px solid #f0f0f0;border-radius:2px;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer}
.item-img{max-width:100%;max-height:100%;object-fit:contain}
.item-info{flex:1}
.item-name{font-size:14px;line-height:19px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.delivery{font-size:12px;color:#388e3c;margin-top:6px;font-weight:500}
.seller{font-size:11px;color:#878787;margin-top:3px}
.price-row{margin-top:8px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.price-now{font-size:18px;font-weight:700}
.price-cut{font-size:13px;color:#878787;text-decoration:line-through}
.off{font-size:13px;color:#388e3c;font-weight:600}
.qty-action-row{display:flex;align-items:center;gap:20px;padding:14px 0 12px 0}
.qty-box{display:flex;align-items:center;border:1px solid #c2c2c2;border-radius:20px;overflow:hidden}
.qty-btn{width:28px;height:28px;border:none;background:#fff;font-size:16px;font-weight:600;cursor:pointer}
.qty-num{width:32px;text-align:center;font-size:14px;font-weight:600;border-left:1px solid #c2c2c2;border-right:1px solid #c2c2c2;background:#fff;height:28px;display:flex;align-items:center;justify-content:center}
.price-detail-card{background:#fff;padding:14px 16px;margin-bottom:8px}
.price-detail-card h3{font-size:14px;font-weight:600;border-bottom:1px dashed #e0e0e0;padding-bottom:12px;margin-bottom:12px}
.price-row2{display:flex;justify-content:space-between;font-size:13px;padding:5px 0}
.price-row2.total{font-weight:700;font-size:15px;border-top:1px dashed #e0e0e0;margin-top:10px;padding-top:12px}
.bottom-bar{position:fixed;bottom:50px;left:0;right:0;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:8px 12px 8px 16px;box-shadow:0 -2px 10px rgba(0,0,0,.15);z-index:20}
.place-btn{background:#fb641b;color:#fff;border:none;padding:14px 40px;border-radius:2px;font-weight:700;font-size:14px;letter-spacing:.3px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:6px 0 4px 0;border-top:1px solid #e0e0e0;z-index:21}
.bottom-nav a{text-decoration:none;color:#878787;font-size:11px;display:flex;flex-direction:column;align-items:center;flex:1}
.bottom-nav a.active{color:#2874f0}
.nav-ico{font-size:18px;margin-bottom:2px}
</style>
</head>
<body>
<div class="top-strip">🔥 Extra Discount Coupons Available</div>
<div class="header"><span onclick="history.back()" style="cursor:pointer">←</span><h1>My Cart (<span id="cartCount">0</span>)</h1></div>
<div id="cartContainer"></div>
<div id="priceContainer"></div>
<div id="bottomBar"></div>
<div class="bottom-nav">
<a href="index.html"><span class="nav-ico">🏠</span>Home</a>
<a href="account.html"><span class="nav-ico">👤</span>Account</a>
<a href="cart.html" class="active"><span class="nav-ico">🛒</span>Cart</a>
</div>
<script>
const API_BASE = "https://rekavo-backend.vercel.app";
function getUser(){try{let u=JSON.parse(localStorage.getItem('rekavo_user')); if(!u) return null; u.user_id = u.user_id || u.id || u._id; return u;}catch(e){return null}}
function getUid(){ let u=getUser(); return u? u.user_id : null; }

function openProduct(idx){
 let cart = JSON.parse(localStorage.getItem('rekavo_cart')||'[]');
 let item = cart[idx];
 if(!item) return;
 localStorage.setItem('rekavo_view_product', JSON.stringify(item));
 let pid = item.product_id || item.id || '';
 if(pid){
   location.href = `product.html?id=${encodeURIComponent(pid)}`;
 } else {
   location.href = `product.html?name=${encodeURIComponent(item.name)}`;
 }
}

function render(){
 let cart = JSON.parse(localStorage.getItem('rekavo_cart')||'[]');
 // duplicate merge - 2 se 6,8 fix
 let map = {};
 cart.forEach(i=>{
   let id = i.product_id || i.id;
   if(!id) return;
   if(map[id]) map[id].qty = (map[id].qty||1) + (i.qty||1);
   else map[id] = {...i, qty: i.qty||1};
 });
 cart = Object.values(map);
 localStorage.setItem('rekavo_cart', JSON.stringify(cart));

 cart = cart.map(i=>{if(!i.qty)i.qty=1;return i;});
 let con=document.getElementById('cartContainer');
 let priceCon=document.getElementById('priceContainer');
 let bar=document.getElementById('bottomBar');
 if(cart.length===0){
  let user=getUser();
  con.innerHTML= `<div class="empty-wrap"><div class="empty-img">🛒</div><div style="font-size:16px;font-weight:600">${user?user.name+', ':''}Your cart is empty</div><div style="margin-top:6px;color:#777">Add some products to get started</div><a href="index.html" style="display:inline-block;margin-top:15px;background:#2874f0;color:#fff;text-decoration:none;padding:10px 20px;border-radius:4px;font-weight:600">Continue Shopping</a></div>`;
  priceCon.innerHTML='';bar.innerHTML='';document.getElementById('cartCount').innerText='0';return;
 }
 document.getElementById('cartCount').innerText = cart.reduce((s,i)=>s+(i.qty||1),0);
 let html='', totalMRP=0, totalNow=0;
 cart.forEach((item,idx)=>{
  let cut = item.original || item.originalPrice || item.mrp || Math.round(item.price*1.3);
  let itemTotal = item.price * item.qty;
  let cutTotal = cut * item.qty;
  totalMRP += cutTotal;
  totalNow += itemTotal;
  html+=`
  <div class="cart-card">
   <div class="item-top">
    <div class="item-img-wrap" onclick="openProduct(${idx})"><img class="item-img" src="${item.img||item.image}"></div>
    <div class="item-info">
     <div class="item-name" onclick="openProduct(${idx})">${item.name} ${item.qty > 1? `(x${item.qty})` : ''}</div>
     <div class="seller">Seller: Rekavo Retail • Coupon Applied</div>
     <div class="price-row"><span class="price-now">₹${itemTotal.toLocaleString()}</span><span style="font-size:11px;color:#878787"> (₹${item.price.toLocaleString()} x ${item.qty})</span><span class="price-cut">₹${cutTotal.toLocaleString()}</span><span class="off">${Math.round((cut-item.price)/cut*100)}% Off</span></div>
     <div class="delivery">Free Delivery • Delivery by Tomorrow</div>
    </div>
   </div>
   <div class="qty-action-row">
    <div class="qty-box"><button class="qty-btn" onclick="changeQty(${idx},-1)">−</button><span class="qty-num">${item.qty}</span><button class="qty-btn" onclick="changeQty(${idx},1)">+</button></div>
    <div style="flex:1;display:flex;gap:8px;"><button onclick="removeItem(${idx})" style="flex:1;background:#fff;border:1px solid #ff3b3b;color:#ff3b3b;padding:8px 0;border-radius:6px;font-weight:700;font-size:12px;cursor:pointer;">REMOVE</button><button onclick="buyNow(${idx})" style="flex:1;background:#0f9d58;border:1px solid #0f9d58;color:#fff;padding:8px 0;border-radius:6px;font-weight:700;font-size:12px;cursor:pointer;">BUY THIS NOW</button></div>
   </div>
  </div>`;
 });
 con.innerHTML=html;
 let discount = totalMRP - totalNow;
 priceCon.innerHTML=`<div class="price-detail-card"><h3>PRICE DETAILS</h3><div class="price-row2"><span>Price (${cart.reduce((s,i)=>s+i.qty,0)} items)</span><span>₹${totalMRP.toLocaleString()}</span></div><div class="price-row2"><span>Discount</span><span style="color:#388e3c">- ₹${discount.toLocaleString()}</span></div><div class="price-row2"><span>Coupon Discount</span><span style="color:#388e3c">- Extra 20%</span></div><div class="price-row2"><span>Delivery Charges</span><span style="color:#388e3c">FREE</span></div><div class="price-row2 total"><span>Total Amount</span><span>₹${totalNow.toLocaleString()}</span></div></div>`;
 bar.innerHTML=`<div class="bottom-bar"><div><div style="font-size:12px;color:#878787;text-decoration:line-through">₹${totalMRP.toLocaleString()}</div><div style="font-weight:800;font-size:18px">₹${totalNow.toLocaleString()}</div></div><button class="place-btn" onclick="location.href='checkout.html'">PLACE ORDER</button></div>`;
}

async function syncFromServer(){
 let uid = getUid();
 if(!uid) { render(); return; }
 try{
   let res = await fetch(`${API_BASE}/cart/get?user_id=${uid}`);
   let data = await res.json();
   let arr = Array.isArray(data)? data : (data.cart || data.items || []);
   if(Array.isArray(arr)){
     let map = {};
     arr.forEach(i=>{
       let id = i.product_id || i.id;
       if(!id) return;
       if(map[id]) map[id].qty += (i.qty||1);
       else map[id] = {product_id:id, id:id, name:i.name, price:i.price, qty:i.qty||1, img:i.image||i.img, image:i.image||i.img, original:i.original||i.originalPrice};
     });
     let finalServer = Object.values(map);
     localStorage.setItem('rekavo_cart', JSON.stringify(finalServer));
   }
 }catch(e){}
 render();
}

async function changeQty(idx,d){
 let c=JSON.parse(localStorage.getItem('rekavo_cart')||'[]');
 if(!c[idx]) return;
 c[idx].qty+=d;if(c[idx].qty<1)c[idx].qty=1;if(c[idx].qty>5)c[idx].qty=5;
 localStorage.setItem('rekavo_cart',JSON.stringify(c));
 render();
 // backend pe bhi update
 try{
   let uid=getUid(); if(!uid) return;
   let item=c[idx];
   await fetch(`${API_BASE}/cart/add`,{
     method:'POST',
     headers:{'Content-Type':'application/json'},
     body: JSON.stringify({user_id:uid, product_id:item.product_id||item.id, name:item.name, price:item.price, qty:item.qty, image:item.img||item.image})
   });
 }catch(e){}
}

async function removeItem(idx){
 if(!confirm('Remove this item?'))return;
 let c=JSON.parse(localStorage.getItem('rekavo_cart')||'[]');
 let removed = c[idx];
 c.splice(idx,1);localStorage.setItem('rekavo_cart',JSON.stringify(c));
 render();
 try{
   let uid=getUid(); if(!uid) return;
   let u=getUser();
   await fetch(`${API_BASE}/cart/remove`,{
     method:'POST',
     headers:{'Content-Type':'application/json'},
     body: JSON.stringify({user_id:uid, email:u?u.email:'', product_id:removed.product_id||removed.id})
   });
 }catch(e){}
}

function buyNow(i){let cart=JSON.parse(localStorage.getItem('rekavo_cart')||'[]');localStorage.setItem('rekavo_buy_now',JSON.stringify(cart[i]));location.href='checkout.html';}

// INIT - pehle local se instant, fir server se real
(function(){
 try{
   let localCart = JSON.parse(localStorage.getItem('rekavo_cart')||'[]');
   let cnt = localCart.reduce((s,i)=>s+(i.qty||1),0);
   document.getElementById('cartCount').innerText = cnt;
 }catch(e){}
 syncFromServer();
})();
</script>
</body>
</html>
