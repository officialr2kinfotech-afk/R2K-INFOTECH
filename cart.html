<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REKAVO - Cart</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Roboto,sans-serif}
body{background:#f1f3f6;padding-bottom:70px}
.top-strip{background:#e6efff;color:#1a4ab0;text-align:center;padding:7px 12px;font-size:12px;font-weight:800;border-bottom:2px solid #fff;margin-bottom:2px}
.search-wrapper{background:#2874f0;padding:10px 12px;position:sticky;top:0;z-index:99;border-top:2px solid #fff}
.search-box{width:100%;display:flex;background:#fff;border-radius:2px;height:42px;position:relative}
.search-box input{flex:1;border:none;padding:0 14px;outline:none;font-size:14px}
.search-box button{border:none;background:#fff;color:#2874f0;padding:0 18px;font-size:20px;font-weight:900}
.search-results{position:absolute;top:44px;left:0;right:0;background:#fff;max-height:420px;overflow:auto;box-shadow:0 8px 16px rgba(0,0,0,.2);display:none;z-index:30}
.search-results.show{display:block}
.sr-item{display:flex;gap:10px;padding:10px;border-bottom:1px solid #f0f0f0;cursor:pointer;align-items:center}
.sr-item img{width:50px;height:50px;object-fit:contain;border:1px solid #eee;border-radius:4px}
.checkout-input{width:100%;padding:10px;margin:5px 0;border:1px solid #e0e0e0;border-radius:4px;font-size:13px}
.btn-cart{width:100%;margin-top:8px;background:#ff9f00;color:#fff;border:none;padding:10px;border-radius:4px;font-weight:700;cursor:pointer}
.btn-buy{width:100%;margin-top:8px;background:#fb641b;color:#fff;border:none;padding:10px;border-radius:4px;font-weight:700;cursor:pointer}
.pay-box{border:1px solid #e0e0e0;background:#f9f9f9;border-radius:4px;padding:10px;margin:10px 0;display:flex;gap:10px;align-items:center;font-weight:600;font-size:13px}
.modal{display:none;position:fixed;z-index:100;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,.6);align-items:center;justify-content:center;padding:12px}
.modal.show{display:flex}
.modal-content{background:#fff;width:100%;max-width:360px;border-radius:6px;padding:16px;text-align:center;position:relative;max-height:90vh;overflow:auto}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:6px 0;border-top:1px solid #ddd;z-index:999}
.bottom-nav a{text-decoration:none;color:#555;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center}
.bottom-nav a.active{color:#2874f0}
</style>
</head>
<body>
<div class="top-strip">🔥 Use Coupon For Extra Discount At 20%, 40%, 50%, 80% And More....</div>
<div class="search-wrapper"><div class="search-box"><input id="mainSearch" placeholder="Search for products" onfocus="handleSearchFocus()" oninput="liveSearch(this.value)" autocomplete="off"><button>⌕</button><div id="searchResults" class="search-results"></div></div></div>
<div style="background:#fff;padding:12px;display:flex;align-items:center;gap:10px"><button onclick="location.href='index.html'" style="background:#f0f0f0;border:none;padding:6px 12px;border-radius:4px;font-weight:700">← Back</button><h3>Cart & Checkout</h3></div>

<div style="background:#fff;margin:8px;border-radius:4px;padding:12px">
<h3>Your Cart</h3>
<div id="cartItems" style="margin:12px 0"></div>
<b>Total: ₹<span id="cartTotal">0</span></b>
</div>

<div style="background:#fff;margin:8px;border-radius:4px;padding:12px">
<h3>Delivery Address</h3>
<div id="savedAddressList" style="margin:10px 0"></div>
<div id="addAddressForm" style="display:none;border-top:1px dashed #ccc;padding-top:12px;margin-top:12px">
<input id="cName" class="checkout-input" placeholder="Full Name">
<input id="cPhone" type="tel" class="checkout-input" placeholder="Phone Number" maxlength="10" oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,10)">
<input id="cAddress" class="checkout-input" placeholder="Full Address">
<div style="display:flex;gap:8px"><input id="cPincode" type="tel" class="checkout-input" placeholder="Pincode" maxlength="6"><input id="cCity" class="checkout-input" placeholder="City"></div>
<button class="btn-cart" onclick="saveNewAddress()">Save This Address</button>
</div>
<button id="addNewBtn" class="btn-cart" style="background:#fff;color:#2874f0;border:1.5px dashed #2874f0" onclick="showAddForm()">+ Add New Address</button>

<div class="pay-box" style="margin-top:15px"><span>💳</span><div><div>Pay via UPI</div><div style="font-size:11px;color:#555">PhonePe, GPay, Paytm</div></div></div>
<div style="display:flex;justify-content:space-between;margin:10px 0;font-weight:800;font-size:17px"><span>To Pay</span><span>₹<span id="checkoutTotal">0</span></span></div>
<button class="btn-buy" style="padding:14px;font-size:15px" onclick="payWithUPI()">Place Order</button>
</div>

<div id="upiModal" class="modal"><div class="modal-content"><h3>Complete Payment</h3><p style="font-size:13px;color:#555;margin:8px 0">Pay <b>₹<span id="upiAmount">0</span></b> via UPI</p><img id="qrImg" style="width:180px;height:180px;margin:10px auto;border:1px solid #eee;border-radius:10px"><br><button class="btn-buy" onclick="openUpiApp()">Open UPI App</button><button onclick="paymentDone()" style="width:100%;margin-top:10px;padding:11px;background:#e8f5e9;color:#2e7d32;border:none;border-radius:6px;font-weight:700">I Have Paid - Confirm</button><p onclick="document.getElementById('upiModal').classList.remove('show')" style="font-size:12px;color:#888;margin-top:10px;cursor:pointer">Cancel</p></div></div>

<div class="bottom-nav"><a href="index.html"><span>🏠</span>Home</a><a href="account.html"><span>👤</span>Account</a><a href="cart.html" class="active"><span>🛒</span>Cart</a></div>

<script>
const categoryData={powerbank:[{name:"Power Bank 10000mAh",price:499,originalPrice:1299,coupon:"REKAVOPB10K40PERCENT",img:"https://images.unsplash.com/photo-1609091839311-d5365f9ff1c5?w=300"},{name:"Power Bank 20000mAh",price:799,originalPrice:1999,coupon:"REKAVOPB20K60PERCENT",img:"https://images.unsplash.com/photo-1609091839311-d5365f9ff1c5?w=300"},{name:"Power Bank 30000mAh",price:1099,originalPrice:2999,coupon:"REKAVOPB30K70PERCENT",img:"https://images.unsplash.com/photo-1609091839311-d5365f9ff1c5?w=300"}],neckband:[{name:"Neckband Boat 100",price:199,originalPrice:999,coupon:"REKAVONB10050PERCENT",img:"https://images.unsplash.com/photo-1546435770-a3e426bf472b?w=300"},{name:"Neckband 500 Premium",price:549,originalPrice:1999,coupon:"REKAVONB50040PERCENT",img:"https://images.unsplash.com/photo-1546435770-a3e426bf472b?w=300"}],earbuds:[{name:"Earbuds TWS 400",price:449,originalPrice:1499,coupon:"REKAVOEB40060PERCENT",img:"https://images.unsplash.com/photo-1572569511254-d8f925fe2cbb?w=300"},{name:"Earbuds Pro Sound",price:999,originalPrice:4999,coupon:"REKAVOEBPRO80PERCENT",img:"https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=300"}],cable:[{name:"Cable Type-C 100",price:99,originalPrice:299,coupon:"REKAVOCB10050PERCENT",img:"https://images.unsplash.com/photo-1625842268584-8f3296236761?w=300"},{name:"Cable Fast 3A",price:199,originalPrice:499,coupon:"REKAVOCB3A40PERCENT",img:"https://images.unsplash.com/photo-1587037542707-1dad5a1cfa9d?w=300"}],charger:[{name:"Charger 20W Fast",price:299,originalPrice:999,coupon:"REKAVOCH20W60PERCENT",img:"https://images.unsplash.com/photo-1583863788434-e58a36330cf0?w=300"},{name:"Charger 65W",price:699,originalPrice:2499,coupon:"REKAVOCH65W70PERCENT",img:"https://images.unsplash.com/photo-1583863788434-e58a36330cf0?w=300"}]};
function getAllProducts(){let all=[];for(let c in categoryData){categoryData[c].forEach((p,i)=>{all.push({...p,cat:c,idx:i})})}return all}
function handleSearchFocus(){window.scrollTo({top:0,behavior:'smooth'});liveSearch(document.getElementById('mainSearch').value)}
function liveSearch(q){let box=document.getElementById('searchResults');let all=getAllProducts();let query=q.trim().toLowerCase();let filtered=query===""?all:all.filter(p=>p.name.toLowerCase().includes(query)||p.cat.includes(query));box.innerHTML=filtered.map(p=>`<div class="sr-item" onclick="location.href='product.html?cat=${p.cat}&idx=${p.idx}'"><img src="${p.img}"><div><div style="font-size:13px;font-weight:600">${p.name}</div><div style="font-size:12px;color:#388e3c">₹${p.price}</div></div></div>`).join('');box.classList.add('show')}

let cart=JSON.parse(localStorage.getItem('rekavo_cart')||'[]'),orders=JSON.parse(localStorage.getItem('rekavo_orders')||'[]'),currentUser=JSON.parse(localStorage.getItem('rekavo_user')||'null'),savedAddresses=JSON.parse(localStorage.getItem('rekavo_addresses')||'[]'),selectedAddressIndex=0;

function updateCartUI(){
let div=document.getElementById('cartItems');
if(cart.length==0){div.innerHTML='<p style="text-align:center;padding:15px">Your cart is empty</p>'}
else{div.innerHTML=cart.map((c,i)=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee"><span>${c.name} - ₹${c.price}</span><button onclick="cart.splice(${i},1);localStorage.setItem('rekavo_cart',JSON.stringify(cart));updateCartUI();" style="background:#ff3b30;color:#fff;border:none;padding:3px 8px;border-radius:4px">X</button></div>`).join('')}
let tot=cart.reduce((s,i)=>s+i.price,0);
document.getElementById('cartTotal').innerText=tot;
document.getElementById('checkoutTotal').innerText=tot;
}

function renderAddresses(){
let listDiv=document.getElementById('savedAddressList'),formDiv=document.getElementById('addAddressForm'),addBtn=document.getElementById('addNewBtn');
if(savedAddresses.length===0){
listDiv.innerHTML='<p style="font-size:13px;color:#666">No saved address, please add one</p>';
formDiv.style.display='block';addBtn.style.display='none'
}else{
listDiv.innerHTML=savedAddresses.map((ad,i)=>`<label style="display:flex;gap:10px;border:2px solid ${i===selectedAddressIndex?'#2874f0':'#e0e0e0'};background:${i===selectedAddressIndex?'#f0f7ff':'#fff'};border-radius:8px;padding:10px;margin-bottom:8px;cursor:pointer"><input type="radio" name="addr" ${i===selectedAddressIndex?'checked':''} onchange="selectAddr(${i})"><div style="font-size:13px;line-height:1.4"><b>${ad.name} - ${ad.phone}</b><br>${ad.address}, ${ad.city} - ${ad.pincode}</div></label>`).join('');
formDiv.style.display='none';addBtn.style.display='block'
}
}

function showAddForm(){document.getElementById('addAddressForm').style.display='block';document.getElementById('addNewBtn').style.display='none'}
function selectAddr(i){selectedAddressIndex=i;renderAddresses()}
function saveNewAddress(){
let name=document.getElementById('cName').value.trim(),phone=document.getElementById('cPhone').value.trim(),address=document.getElementById('cAddress').value.trim(),pin=document.getElementById('cPincode').value.trim(),city=document.getElementById('cCity').value.trim();
if(!name||!phone||!address||!pin||!city){alert("Fill complete address");return}
savedAddresses.push({name,phone,address,pincode:pin,city});
localStorage.setItem('rekavo_addresses',JSON.stringify(savedAddresses));
selectedAddressIndex=savedAddresses.length-1;
['cName','cPhone','cAddress','cPincode','cCity'].forEach(id=>document.getElementById(id).value='');
renderAddresses()
}

let MERCHANT_UPI="rekavo@ybl",MERCHANT_NAME="REKAVO",currentUpiLink="";
function payWithUPI(){
if(!currentUser){alert("Please login");location.href='account.html';return}
if(cart.length==0){alert("Cart empty");return}
if(savedAddresses.length==0){alert("Save address");return}
let amount=document.getElementById('checkoutTotal').innerText;
document.getElementById('upiAmount').innerText=amount;
currentUpiLink=`upi://pay?pa=${MERCHANT_UPI}&pn=${encodeURIComponent(MERCHANT_NAME)}&am=${amount}&cu=INR&tn=REKAVO Order ${Date.now()}`;
document.getElementById('qrImg').src=`https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(currentUpiLink)}`;
document.getElementById('upiModal').classList.add('show');
if(/Android|iPhone/i.test(navigator.userAgent)){setTimeout(()=>{window.location.href=currentUpiLink},600)}
}
function openUpiApp(){window.location.href=currentUpiLink}
function paymentDone(){
let orderId="REKAVO"+Date.now().toString().slice(-6),total=document.getElementById('checkoutTotal').innerText,addr=savedAddresses[selectedAddressIndex],newOrder={orderId,products:[...cart],total,email:currentUser.email,mobile:currentUser.mobile,name:currentUser.name,address:addr,status:"Placed",tracking:"",date:new Date().toLocaleDateString()};
orders.unshift(newOrder);localStorage.setItem('rekavo_orders',JSON.stringify(orders));
alert("Order Placed! ID: "+orderId);
cart=[];localStorage.setItem('rekavo_cart',JSON.stringify(cart));
document.getElementById('upiModal').classList.remove('show');
location.href='account.html'
}

window.onclick=(e)=>{
if(e.target.closest&&!e.target.closest('.search-wrapper')){let sr=document.getElementById('searchResults');if(sr)sr.classList.remove('show')}
if(e.target.classList&&e.target.classList.contains('modal')){e.target.classList.remove('show')}
}

updateCartUI();renderAddresses();
</script>
</body>
</html>
