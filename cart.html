<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Cart - REKAVO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Roboto,sans-serif}
body{background:#f1f3f6;padding-bottom:140px}
.top-strip{background:#e6efff;color:#1a4ab0;text-align:center;padding:7px;font-size:12px;font-weight:800}
.header{background:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 2px rgba(0,0,0,.1);position:sticky;top:0;z-index:99}
.header h1{font-size:16px;font-weight:500}

/* Empty - IF ELSE DONO SAFE HAI */
.empty-wrap{background:#fff;min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.empty-icon{font-size:70px;background:#f5f5f5;width:120px;height:120px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.empty-title{font-size:16px;font-weight:600;margin-bottom:18px}
.btn-blue{background:#2874f0;color:#fff;border:none;padding:10px 50px;border-radius:3px;font-weight:600;cursor:pointer}

/* Cart Card */
.cart-card{background:#fff;margin-bottom:8px;padding:12px;border-radius:2px}
.item-top{display:flex;gap:12px}
.item-img{width:90px;height:90px;object-fit:contain;border:1px solid #f0f0f0;border-radius:4px}
.item-right{flex:1}
.item-name{font-size:14px;line-height:18px;font-weight:500}
.item-detail{font-size:12px;color:#555;margin-top:5px;line-height:16px;background:#f9f9f9;padding:6px;border-radius:3px}
.item-price{font-size:17px;font-weight:800;margin-top:8px;color:#000}

/* QTY LIST - LINE SE */
.qty-section{margin-top:10px}
.qty-label{font-size:12px;color:#555;font-weight:600;margin-bottom:5px}
.qty-list{display:flex;gap:8px}
.qty-list span{border:1px solid #c2c2c2;min-width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:4px;font-size:13px;font-weight:700;background:#fff;cursor:pointer}
.qty-list span.active{background:#2874f0;color:#fff;border-color:#2874f0}

/* Buttons - Red / Green */
.action-row{display:flex;gap:10px;margin-top:14px}
.btn-red{flex:1;background:#ff3b3b;color:#fff;border:none;padding:11px 0;border-radius:4px;font-size:13px;font-weight:700;text-transform:uppercase;cursor:pointer}
.btn-green{flex:1;background:#0d9d4b;color:#fff;border:none;padding:11px 0;border-radius:4px;font-size:13px;font-weight:700;text-transform:uppercase;cursor:pointer}

.bottom-bar{position:fixed;bottom:52px;left:0;right:0;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;box-shadow:0 -2px 8px rgba(0,0,0,.15);z-index:998}
.place-btn{background:#fb641b;color:#fff;border:none;padding:13px 35px;border-radius:3px;font-weight:700;font-size:14px;cursor:pointer}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:6px 0;border-top:1px solid #ddd;z-index:999}
.bottom-nav a{text-decoration:none;color:#555;font-size:11px;display:flex;flex-direction:column;align-items:center;flex:1}
.bottom-nav a.active{color:#2874f0}
</style>
</head>
<body>
<div class="top-strip">🔥 Extra Discount Coupons Available</div>
<div class="header"><span onclick="history.back()">←</span><h1>My Cart</h1></div>

<div id="cartContainer"></div>
<div id="bottomBar"></div>

<div class="bottom-nav">
<a href="index.html">Home</a>
<a href="account.html">Account</a>
<a href="cart.html" class="active">Cart (<span id="cartCount">0</span>)</a>
</div>

<script>
function getCart(){
  let c=JSON.parse(localStorage.getItem('rekavo_cart')||'[]');
  return c.map(i=>{ if(!i.qty) i.qty=1; return i; });
}
function saveCart(c){ localStorage.setItem('rekavo_cart', JSON.stringify(c)); render(); }

function render(){
  let cart=getCart();
  let user=localStorage.getItem('rekavo_user');
  document.getElementById('cartCount').innerText=cart.length;
  let con=document.getElementById('cartContainer');
  let bar=document.getElementById('bottomBar');

  if(cart.length===0){
    if(user){
      con.innerHTML=`<div class="empty-wrap"><div class="empty-icon">🛒</div><div class="empty-title">Your cart is empty!</div><button class="btn-blue" onclick="location.href='index.html'">Shop now</button></div>`;
    }else{
      con.innerHTML=`<div class="empty-wrap"><div class="empty-icon">🛒</div><div class="empty-title">Missing Cart items?</div><button class="btn-blue" onclick="location.href='account.html'">Login</button></div>`;
    }
    bar.innerHTML=''; return;
  }

  let html=''; let total=0;
  cart.forEach((item, idx)=>{
    let itemTotal = item.price * item.qty;
    total+=itemTotal;
    // product detail nikalna - jo bhi key ho usse
    let detailText = item.detail || item.details || item.description || item.desc || item.info || "No details available for this product";

    html+=`
    <div class="cart-card">
      <div class="item-top">
        <img class="item-img" src="${item.img}">
        <div class="item-right">
          <div class="item-name">${item.name}</div>
          <div class="item-price">₹${itemTotal.toLocaleString()}</div>
          <div class="item-detail">${detailText}</div>
        </div>
      </div>

      <div class="qty-section">
        <div class="qty-label">Quantity:</div>
        <div class="qty-list">
          <span class="${item.qty==1?'active':''}" onclick="changeQty(${idx},1)">1</span>
          <span class="${item.qty==2?'active':''}" onclick="changeQty(${idx},2)">2</span>
          <span class="${item.qty==3?'active':''}" onclick="changeQty(${idx},3)">3</span>
          <span class="${item.qty==4?'active':''}" onclick="changeQty(${idx},4)">4</span>
          <span class="${item.qty==5?'active':''}" onclick="changeQty(${idx},5)">5</span>
        </div>
      </div>

      <div class="action-row">
        <button class="btn-red" onclick="removeItem(${idx})">Remove</button>
        <button class="btn-green" onclick="buyNow(${idx})">Buy This Now</button>
      </div>
    </div>`;
  });
  con.innerHTML=html;
  bar.innerHTML=`<div class="bottom-bar"><div style="font-weight:800;font-size:18px">₹${total.toLocaleString()}</div><button class="place-btn" onclick="placeOrder()">PLACE ORDER</button></div>`;
}

function changeQty(idx,val){ let c=getCart(); c[idx].qty=val; saveCart(c); }
function removeItem(idx){ if(confirm('Remove this item?')){ let c=getCart(); c.splice(idx,1); saveCart(c); } }
function buyNow(idx){ let c=getCart(); localStorage.setItem('rekavo_buy_now', JSON.stringify(c[idx])); location.href='checkout.html'; }
function placeOrder(){
  let u=localStorage.getItem('rekavo_user');
  if(!u){ location.href='account.html'; return; }
  location.href='checkout.html';
}
render();
</script>
</body>
</html>
