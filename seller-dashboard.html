<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rekavo Seller Hub</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>*{font-family:'Roboto',sans-serif} body{background:#F0F2F5}</style>
</head>
<body class="pb-24">

<header class="bg-[#2874F0] h-[56px] flex items-center justify-between px-4 sticky top-0 z-50 text-white">
  <div class="flex items-center gap-3"><i class="fa-solid fa-bars text-[18px]"></i><div class="flex items-center gap-1.5"><div class="w-7 h-7 bg-white rounded-full flex items-center justify-center text-[#2874F0] font-black">R</div><div class="leading-none"><p class="font-black text-[13px]">Rekavo Seller</p><p class="text-[10px] font-bold opacity-90 -mt-0.5">HUB</p></div></div></div>
  <div class="flex items-center gap-4"><i class="fa-regular fa-bell text-[20px]"></i><button id="dotBtn"><i class="fa-solid fa-ellipsis-vertical text-[18px]"></i></button></div>
</header>

<div class="bg-white border-b px-4 py-3 flex justify-between items-center">
  <div><p class="text-[13px] text-gray-600">Good Morning,</p><h2 id="sellerName" class="font-black text-[16px] -mt-1">Seller</h2></div>
  <div class="flex items-center gap-2 bg-[#E8F5E9] px-3 py-1.5 rounded-full border"><div class="w-2 h-2 bg-[#2E7D32] rounded-full animate-pulse"></div><span class="text-[11px] font-bold text-[#2E7D32]">Active</span></div>
</div>

<main class="max-w-[520px] mx-auto p-3 space-y-3">
  <div class="bg-white rounded-xl border p-4"><div class="flex gap-3"><div class="w-11 h-11 bg-[#E3F2FD] rounded-full flex items-center justify-center text-[#2874F0]"><i class="fa-solid fa-box-open"></i></div><div><p class="text-[13px] text-gray-600">Orders to Dispatch</p><h1 id="ordersCount" class="text-[28px] font-black leading-none mt-1">0</h1></div></div><button class="mt-4 w-full bg-[#2874F0] text-white py-2.5 rounded-lg font-bold text-[13px]">Ship Now</button></div>
  <div class="grid grid-cols-2 gap-3">
    <div class="bg-white rounded-xl border p-4"><div class="w-9 h-9 bg-[#FFF3E0] rounded-full flex items-center justify-center text-[#EF6C00]"><i class="fa-solid fa-rotate-left"></i></div><p class="text-[12px] text-gray-500 mt-3">Returns</p><h2 class="text-[22px] font-black">0</h2></div>
    <div class="bg-white rounded-xl border p-4"><div class="w-9 h-9 bg-[#E8F5E9] rounded-full flex items-center justify-center text-[#2E7D32]"><i class="fa-solid fa-indian-rupee-sign"></i></div><p class="text-[12px] text-gray-500 mt-3">Payments</p><h2 id="payAmount" class="text-[22px] font-black">₹0</h2></div>
  </div>
  <div class="bg-white rounded-xl border p-4"><div class="flex justify-between"><div class="flex items-center gap-3"><div class="w-9 h-9 bg-[#F3E5F5] rounded-full flex items-center justify-center text-[#8E24AA]"><i class="fa-solid fa-cubes"></i></div><div><p class="text-[13px] font-bold">Inventory</p><p class="text-[11px] text-gray-400">Active items</p></div></div><h2 id="invCount" class="text-[22px] font-black">0</h2></div><div id="invList" class="mt-3 space-y-2"></div></div>
</main>

<!-- BOTTOM NAV - ADD ITEM EK DUM CENTER ME -->
<div class="fixed bottom-0 left-0 right-0 bg-white border-t h-[64px] z-40">
  <div class="max-w-[520px] mx-auto h-full flex justify-around items-center relative px-2">
    <button class="flex flex-col items-center text-[#2874F0] w-12"><i class="fa-solid fa-house text-[18px]"></i><span class="text-[10px] font-bold mt-1">Home</span></button>
    <button class="flex flex-col items-center text-gray-400 w-12"><i class="fa-solid fa-box text-[18px]"></i><span class="text-[10px] font-bold mt-1">Orders</span></button>

    <!-- CENTER ADD ITEM -->
    <div class="w-20"></div> <!-- space for center button -->
    <div class="absolute left-1/2 -translate-x-1/2 -top-5 flex flex-col items-center">
      <button onclick="openAdd()" class="w-[56px] h-[56px] bg-[#2874F0] rounded-full flex items-center justify-center text-white shadow-[0_4px_12px_rgba(40,116,240,0.4)] border-4 border-[#F0F2F5] active:scale-95 transition"><i class="fa-solid fa-plus text-[22px]"></i></button>
      <span class="text-[10px] font-black mt-1 tracking-wide">Add Item</span>
    </div>

    <button class="flex flex-col items-center text-gray-400 w-12"><i class="fa-solid fa-cubes text-[18px]"></i><span class="text-[10px] font-bold mt-1">Inventory</span></button>
    <button class="flex flex-col items-center text-gray-400 w-12"><i class="fa-solid fa-wallet text-[18px]"></i><span class="text-[10px] font-bold mt-1">Payments</span></button>
  </div>
</div>

<!-- ADD ITEM MODAL -->
<div id="addModal" class="fixed inset-0 bg-black/60 hidden z-[99] flex items-end md:items-center justify-center">
  <div class="bg-white w-full max-w-[520px] rounded-t-[20px] md:rounded-[20px] p-5">
    <div class="flex justify-between"><h3 class="font-black text-[15px]">Add Item</h3><button onclick="closeAdd()" class="w-8 h-8 bg-gray-100 rounded-full"><i class="fa-solid fa-xmark text-[12px]"></i></button></div>
    <div onclick="document.getElementById('imgInp').click()" class="mt-4 border-2 border-dashed rounded-xl h-[90px] flex items-center justify-center gap-3 cursor-pointer bg-[#FAFBFF] overflow-hidden"><div id="uploadText" class="flex items-center gap-2"><i class="fa-solid fa-camera text-[#2874F0]"></i><span class="text-[12px] font-bold">Upload Photo</span></div><img id="prev" class="hidden w-full h-full object-cover"></div>
    <input type="file" id="imgInp" accept="image/*" class="hidden" onchange="preview(event)">
    <input id="pName" placeholder="Item Name" class="w-full mt-4 bg-[#F0F2F5] p-3.5 rounded-xl text-[13px]">
    <div class="flex gap-3 mt-3"><input id="pPrice" type="number" placeholder="Price ₹" class="w-1/2 bg-[#F0F2F5] p-3.5 rounded-xl text-[13px]"><input id="pStock" type="number" placeholder="Stock" class="w-1/2 bg-[#F0F2F5] p-3.5 rounded-xl text-[13px]"></div>
    <button onclick="saveProd()" class="w-full mt-5 bg-[#FB641B] text-white py-3.5 rounded-xl font-black text-[13px]">ADD ITEM NOW</button>
    <p class="text-[10px] text-center text-gray-400 mt-2">Item will be live on main website (index.html) automatically</p>
  </div>
</div>

<script>
let products=JSON.parse(localStorage.getItem('rekavo_products')||'[]');
let tempImg='';
document.getElementById('sellerName').innerText=localStorage.getItem('rekavo_seller_email')?.split('@')[0] || 'Seller';
function openAdd(){document.getElementById('addModal').classList.remove('hidden')}function closeAdd(){document.getElementById('addModal').classList.add('hidden')}
function preview(e){let r=new FileReader();r.onload=()=>{tempImg=r.result;let p=document.getElementById('prev');p.src=tempImg;p.classList.remove('hidden');document.getElementById('uploadText').classList.add('hidden');};r.readAsDataURL(e.target.files[0]);}
function saveProd(){
 let n=document.getElementById('pName').value,p=parseInt(document.getElementById('pPrice').value),s=parseInt(document.getElementById('pStock').value);
 if(!n||!p||!s)return alert('Fill all');
 let newProduct={id:Date.now(),name:n,price:p,stock:s,img:tempImg,category:'Seller Added'};
 products.push(newProduct);
 localStorage.setItem('rekavo_products',JSON.stringify(products));
 // IMPORTANT: customer site ke liye bhi same key pe save kar rahe hai
 localStorage.setItem('rekavo_all_products',JSON.stringify(products));
 closeAdd();render();alert('Item Added! Ab ye index.html pe dikhega');
 document.getElementById('pName').value='';document.getElementById('pPrice').value='';document.getElementById('pStock').value='';tempImg='';document.getElementById('prev').classList.add('hidden');document.getElementById('uploadText').classList.remove('hidden');
}
function render(){
 let total=products.reduce((a,b)=>a+b.price*b.stock,0);
 document.getElementById('ordersCount').innerText=products.length?products.length*3:0;
 document.getElementById('invCount').innerText=products.length;
 document.getElementById('payAmount').innerText='₹'+Math.floor(total*0.9).toLocaleString('en-IN');
 document.getElementById('invList').innerHTML=products.map(p=>`<div class="flex items-center gap-3 p-2 bg-[#F8F9FA] rounded-lg"><div class="w-10 h-10 bg-white rounded-lg overflow-hidden flex items-center justify-center font-bold">${p.img?`<img src="${p.img}" class="w-full h-full object-cover">`:p.name[0]}</div><div class="flex-1"><p class="font-bold text-[12px] truncate">${p.name}</p><p class="text-[11px] text-gray-500">₹${p.price} • ${p.stock} pcs</p></div><span class="text-[10px] bg-[#E8F5E9] text-[#2E7D32] px-2 py-1 rounded-full font-bold">Live</span></div>`).join('') || '<p class="text-[11px] text-gray-400 text-center py-2">No items yet. Tap Add Item</p>';
}
render();
</script>
</body>
</html>
