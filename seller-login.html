<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seller Login - Rekavo</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family: Arial, sans-serif;}
  body{
    background:#f5f5f5;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
  }
  .card{
    background:white;
    width:100%;
    max-width:420px;
    padding:32px 28px;
    border-radius:12px;
    box-shadow:0 4px 20px rgba(0,0,0,0.08);
  }
  h2{font-size:24px;margin-bottom:6px;color:#111;}
  p.sub{font-size:14px;color:#666;margin-bottom:24px;}
  input{
    width:100%;
    padding:14px 14px;
    border:1px solid #ddd;
    border-radius:8px;
    margin-bottom:16px;
    font-size:15px;
    outline:none;
  }
  input:focus{border-color:#ff6a00;}
  .btn{
    width:100%;
    background:#ff6a00;
    color:white;
    border:none;
    padding:14px;
    border-radius:8px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    margin-top:4px;
  }
  .btn:hover{background:#e65f00;}
  .link{
    margin-top:18px;
    font-size:14px;
  }
  .link a{color:#0b7dda;text-decoration:none;font-weight:600;}
</style>
</head>
<body>
  <div class="card">
    <h2>Seller Login</h2>
    <p class="sub">Login to your seller account</p>
    <input type="text" placeholder="Email / Mobile Number">
    <input type="password" placeholder="Password">
    <button class="btn">Login</button>
    <div class="link">New Seller? <a href="seller-register.html">Register Here</a></div>
  </div>
</body>
</html>
