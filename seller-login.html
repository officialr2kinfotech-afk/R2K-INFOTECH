<!DOCTYPE html>
<html>
<head>
    <title>Seller Login - R2K Infotech</title>
    <style>
        body{font-family: Arial; background:#f1f3f6; display:flex; justify-content:center; padding:50px}
        .box{background:white; padding:30px; width:400px; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.1)}
        input{width:100%; padding:12px; margin:10px 0; border:1px solid #ccc; border-radius:4px}
        button{width:100%; padding:12px; background:#fb641b; color:white; border:none; border-radius:4px; font-size:16px; cursor:pointer}
        a{color:#2874f0; text-decoration:none}
    </style>
</head>
<body>
<div class="box">
    <h2>Seller Login</h2>
    <p>Login to your seller account</p>
    <input type="text" id="email" placeholder="Email / Mobile Number">
    <input type="password" id="pass" placeholder="Password">
    <button onclick="sellerLogin()">Login</button>
    <p style="margin-top:15px">New Seller? <a href="seller-register.html">Register Here</a></p>
    <p><a href="index.html">Back to Customer Login</a></p>
</div>
<script>
function sellerLogin(){
    // abhi ke liye backend connect baad me karenge
    const email = document.getElementById('email').value;
    if(email){ 
        alert("Seller Login Success: " + email);
        window.location.href = "seller-dashboard.html"; 
    }
}
</script>
</body>
</html>
