<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REKAVO Seller Login - Sell on REKAVO.in</title>
  <meta name="description" content="REKAVO Seller Login - Official Seller Hub by R2K Infotech. Login to manage your products, orders, inventory and payments on REKAVO.in">
  <meta name="keywords" content="rekavo seller login, rekavo seller, rekavo seller hub, become rekavo seller, rekavo.in seller, seller.rekavo.in, r2k seller login">
  <link rel="canonical" href="https://seller.rekavo.in/">
  <meta name="robots" content="index, follow">

  <!-- Open Graph for Google/WhatsApp Preview -->
  <meta property="og:title" content="REKAVO Seller Login - Sell on REKAVO.in">
  <meta property="og:description" content="Official REKAVO Seller Hub by R2K Infotech. Login to start selling online.">
  <meta property="og:url" content="https://seller.rekavo.in/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="REKAVO">

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>*{font-family:'Roboto',sans-serif}</style>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "REKAVO Seller Hub",
    "url": "https://seller.rekavo.in/",
    "logo": "https://www.rekavo.in/logo.png",
    "description": "Official Seller Login for REKAVO by R2K Infotech"
  }
  </script>
</head>
<body class="bg-[#F0F2F5] min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-[#2874F0] h-[56px] flex items-center px-4 text-white sticky top-0 z-50">
    <div class="flex items-center gap-1.5">
      <div class="w-7 h-7 bg-white rounded-full flex items-center justify-center text-[#2874F0] font-black text-[14px]">R</div>
      <div class="leading-none"><p class="font-black text-[13px] tracking-wide">REKAVO Seller</p><p class="text-[10px] font-bold opacity-90 -mt-0.5 tracking-widest">HUB</p></div>
    </div>
  </header>

  <div class="flex-1 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-[400px] rounded-[16px] border shadow-sm p-6">

      <div class="text-center">
        <div class="w-14 h-14 bg-[#E3F2FD] rounded-full flex items-center justify-center text-[#2874F0] mx-auto text-[22px]"><i class="fa-solid fa-store"></i></div>
        <h1 class="font-black text-[20px] mt-3">REKAVO Seller Login</h1>
        <p class="text-[12px] text-gray-500 mt-1">Login to REKAVO Seller Hub to manage your store</p>
      </div>

      <div class="mt-6 space-y-3">
        <div>
          <label class="text-[11px] font-bold text-gray-600">Email / Mobile Number</label>
          <input id="email" type="text" placeholder="Enter email or mobile" class="w-full mt-1 bg-[#F0F2F5] p-3.5 rounded-xl text-[13px] outline-none border focus:border-[#2874F0] focus:bg-white">
        </div>
        <div>
          <label class="text-[11px] font-bold text-gray-600">Password</label>
          <input id="password" type="password" placeholder="Enter password" class="w-full mt-1 bg-[#F0F2F5] p-3.5 rounded-xl text-[13px] outline-none border focus:border-[#2874F0] focus:bg-white">
        </div>

        <button onclick="doLogin()" class="w-full mt-2 bg-[#FB641B] text-white py-3.5 rounded-xl font-black text-[13px] active:scale-[0.98] transition-all">LOGIN TO SELLER HUB</button>

        <p class="text-center text-[11px] text-gray-500 mt-3">Don't have an account? <button onclick="doRegister()" class="font-bold text-[#2874F0]">Register as Seller</button></p>
      </div>

      <div class="text-center mt-4">
        <a href="/" class="text-[11px] text-gray-400 font-medium"><i class="fa-solid fa-arrow-left mr-1"></i> Back to REKAVO.in Website</a>
      </div>
    </div>
  </div>

<script>
if(localStorage.getItem('rekavo_seller_email')){
  window.location.href = "dashboard.html";
}

function doLogin(){
  let email = document.getElementById('email').value.trim();
  let pass = document.getElementById('password').value.trim();

  if(!email) return alert('Email / Mobile required');
  if(!pass) return alert('Password required');
  if(pass.length < 4) return alert('Password must be at least 4 characters');

  localStorage.setItem('rekavo_seller_email', email);
  alert('Login Success! Welcome to REKAVO Seller Hub');
  window.location.href = "dashboard.html";
}

function doRegister(){
  let email = document.getElementById('email').value.trim();
  if(!email) email = prompt("Enter your Email / Mobile to Register:");
  if(!email) return;

  let pass = prompt("Create Password (min 4 chars):");
  if(!pass || pass.length < 4) return alert('Password too short');

  localStorage.setItem('rekavo_seller_email', email);
  alert('Seller Account Created! Login Success');
  window.location.href = "dashboard.html";
}
</script>
</body>
</html>
