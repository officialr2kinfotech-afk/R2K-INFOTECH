<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account - REKAVO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Roboto,Arial,sans-serif}
body{background:#f1f3f6;padding-bottom:70px}
.top-strip{background:#e6efff;color:#1a4ab0;text-align:center;padding:7px 12px;font-size:12px;font-weight:800}
.search-wrapper{background:#2874f0;padding:10px 12px;position:sticky;top:0;z-index:10}
.search-box{width:100%;display:flex;background:#fff;border-radius:4px;overflow:hidden;height:42px;align-items:center}
.search-box input{flex:1;border:none;padding:0 14px;outline:none;font-size:14px}
.search-box button{background:#fff;border:none;color:#2874f0;padding:0 18px;font-size:22px;font-weight:900}
.page-bg{filter:blur(3px);opacity:0.6;pointer-events:none;padding:10px}
.hero{height:160px;background:linear-gradient(90deg,#0f1a4a,#2a3a8c);border-radius:8px;margin:10px;display:flex;align-items:center;padding:20px;color:#fff}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;z-index:9999;padding:15px}
.modal{width:100%;max-width:400px;background:#fff;border-radius:12px;padding:20px;position:relative;box-shadow:0 8px 25px rgba(0,0,0,0.3);max-height:92vh;overflow-y:auto}
.close{position:absolute;right:14px;top:10px;font-size:22px;font-weight:700;cursor:pointer}
.title{font-size:17px;font-weight:800;margin-bottom:3px}
.sub{font-size:12.5px;color:#878787;margin-bottom:16px}
.tabs{display:flex;border:1px solid #2874f0;border-radius:8px;overflow:hidden;margin-bottom:16px;height:40px}
.tab{flex:1;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;cursor:pointer}
.tab.active{background:#2874f0;color:#fff}
.tab.inactive{background:#fff;color:#2874f0}
.input{width:100%;height:44px;border:1px solid #dbdbdb;border-radius:8px;padding:0 12px;outline:none;font-size:14px;margin:5px 0 2px}
.input.error{border-color:#d93025;background:#fff5f5}
.btn{width:100%;height:44px;background:#ff7a00;color:#fff;border:none;border-radius:8px;font-weight:800;font-size:14px;cursor:pointer;margin-top:6px}
.btn-blue{background:#2874f0}
.btn-green{background:#26a541}
.btn-orange{background:#ff9f00}
.links{display:flex;justify-content:space-between;margin-top:12px}
.link{font-size:12px;color:#2874f0;font-weight:600;cursor:pointer}
.error-msg{color:#d93025;font-size:11px;font-weight:600;margin-top:2px;display:none;background:#fff5f5;padding:5px 7px;border-radius:4px}
.error-msg.show{display:block}
.success-msg{color:#188038;font-size:11px;font-weight:700;margin-top:6px;display:none;background:#e6f4ea;padding:8px;border-radius:4px;text-align:center}
.success-msg.show{display:block}
.hidden{display:none!important}
.otp-box{background:#f8f9ff;border:1px dashed #2874f0;border-radius:8px;padding:15px;margin-top:10px;text-align:center}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid #ddd;z-index:99}
.bottom-nav a{text-align:center;text-decoration:none;color:#555;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;flex:1}
.bottom-nav a.active{color:#2874f0}
.profile-wrap{padding:12px}
.profile-card{background:#fff;border-radius:8px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.1);text-align:center}
.p-circle{width:72px;height:72px;background:#2874f0;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;margin:0 auto}
.p-menu{text-align:left;margin-top:16px}
.p-menu-item{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #f0f0f0;font-size:14px;font-weight:600;cursor:pointer}
.p-menu-item:active{background:#f5f5f5}
.empty-box{background:#fff;border-radius:8px;padding:40px 20px;text-align:center;margin-top:12px}
.empty-box h3{font-size:16px;margin-bottom:6px}
.empty-box p{font-size:12px;color:#878787}
.page-section{position:fixed;top:0;left:0;width:100%;height:100%;background:#f1f3f6;z-index:10000;overflow-y:auto;padding-bottom:70px}
.page-header{background:#2874f0;color:#fff;padding:12px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0}

/* --- FIX: Text select band, tab switch chalu rahega --- */
*{ -webkit-tap-highlight-color: transparent; }
.tab, .btn, .link, .close, .bottom-nav a, .p-menu-item, .page-header, .top-strip, .title{
  user-select: none !important;
  -webkit-user-select: none !important;
  -webkit-touch-callout: none !important;
}
.input, .search-box input{
  user-select: text !important;
  -webkit-user-select: text !important;
}
</head>
<body>
<div class="top-strip">🔥 Use Coupon For Extra Discount At 20%, 40%, 50%, 80% And More....</div>
<div class="search-wrapper"><div class="search-box"><input placeholder="Search for products"><button>⌕</button></div></div>

<div id="profileSection" class="profile-wrap hidden">
  <div class="profile-card">
    <div class="p-circle" id="pIcon">R</div>
    <h3 id="pName" style="margin-top:10px;font-size:17px;font-weight:800"></h3>
    <p id="pEmail" style="font-size:13px;color:#878787;margin-top:2px"></p>
    <p id="pMobile" style="font-size:13px;color:#878787;margin-top:2px"></p>
    <div class="p-menu">
      <div class="p-menu-item" onclick="location.href='cart.html'"><span>🛒 My Cart (<span id="pCartCount">0</span>)</span><span>›</span></div>
      <div class="p-menu-item" onclick="openPage('orders')"><span>📦 My Orders</span><span>›</span></div>
      <div class="p-menu-item" onclick="openPage('wishlist')"><span>❤️ Wishlist (<span id="pWishCount">0</span>)</span><span>›</span></div>
      <div class="p-menu-item" onclick="openPage('address')"><span>🏠 My Addresses</span><span>›</span></div>
      <div class="p-menu-item" onclick="openPage('help')"><span>🎧 Help Center</span><span>›</span></div>
    </div>
    <button class="btn" style="background:#fff;color:#2874f0;border:1px solid #e0e0e0;margin-top:18px" onclick="logout()">Logout</button>
  </div>
</div>

<div id="page-cart" class="page-section hidden">
  <div class="page-header"><span onclick="closePage('cart')" style="font-size:22px;cursor:pointer">←</span><b>My Cart - REAL DATABASE</b></div>
  <div id="cartContent"><div style="padding:20px;text-align:center">Loading...</div></div>
</div>
<div id="page-orders" class="page-section hidden">
  <div class="page-header"><span onclick="closePage('orders')" style="font-size:22px;cursor:pointer">←</span><b>My Orders</b></div>
  <div id="ordersContent"><div style="padding:20px;text-align:center">Loading...</div></div>
</div>
<div id="page-wishlist" class="page-section hidden">
  <div class="page-header"><span onclick="closePage('wishlist')" style="font-size:22px;cursor:pointer">←</span><b>My Wishlist</b></div>
  <div id="wishlistContent"><div style="padding:20px;text-align:center">Loading...</div></div>
</div>
<div id="page-address" class="page-section hidden">
  <div class="page-header"><span onclick="closePage('address')" style="font-size:22px;cursor:pointer">←</span><b>My Addresses</b></div>
  <div id="addressContent"><div style="padding:20px;text-align:center">Loading...</div></div>
</div>
<div id="page-help" class="page-section hidden">
  <div class="page-header"><span onclick="closePage('help')" style="font-size:22px;cursor:pointer">←</span><b>Help Center</b></div>
  <div style="padding:12px">
    <div style="background:#fff;border-radius:8px;padding:12px">
      <h4 style="font-size:14px">📞 Contact Us</h4><p style="font-size:12px;color:#555;margin-top:4px">Email: support@rekavo.com<br>Phone: +91 9876543210<br>Time: 10AM - 7PM</p>
      <hr style="margin:12px 0;border:none;border-top:1px solid #eee">
      <h4 style="font-size:14px">❓ FAQs</h4>
      <p style="font-size:12px;margin-top:8px"><b>Q: Delivery kitne din me?</b><br>A: 3-5 din ke andar.</p>
      <p style="font-size:12px;margin-top:8px"><b>Q: Return policy?</b><br>A: 7 din ka easy return.</p>
      <p style="font-size:12px;margin-top:8px"><b>Q: Payment safe hai?</b><br>A: Haan 100% secure hai.</p>
    </div>
  </div>
</div>

<div id="mainBlurBg" class="page-bg"><div class="hero"><h2>REKAVO<br>ACCESSORIES & ELECTRONICS</h2></div></div>
<div class="overlay" id="overlay">
  <div class="modal">
    <span class="close" onclick="location.href='index.html'">×</span>
    <div class="title">Login to REKAVO</div>
    <div class="sub">Login to keep your orders safe</div>
    <div class="tabs">
      <div class="tab active" id="loginTab" onclick="switchTab('login')">Login</div>
      <div class="tab inactive" id="registerTab" onclick="switchTab('register')">Register</div>
    </div>
    <div id="loginForm">
      <input id="loginEmail" class="input" placeholder="Email / Mobile Number*"><p id="err-loginEmail" class="error-msg"></p>
      <input id="loginPass" class="input" type="password" placeholder="Password*"><p id="err-loginPass" class="error-msg"></p>
      <p id="success-login" class="success-msg"></p>
      <button class="btn" onclick="handleLogin()">Login with Password</button>
      <div class="links"><span class="link" onclick="switchTab('forgot')">Forgot Password?</span><span class="link" onclick="switchTab('register')">Register Now</span></div>
    </div>
    <div id="registerForm" class="hidden">
      <div id="regStep1">
        <input id="regName" class="input" placeholder="Full Name*"><p id="err-regName" class="error-msg"></p>
        <input id="regMobile" class="input" placeholder="Mobile Number* (10 digits)" maxlength="10"><p id="err-regMobile" class="error-msg"></p>
        <input id="regEmail" class="input" placeholder="Email Address*"><p id="err-regEmail" class="error-msg"></p>
        <button id="sendRegBtn" class="btn btn-blue" onclick="sendRegOtp()">Send OTP</button>
      </div>
      <div id="regStep2" class="hidden">
        <div class="otp-box">
          <p id="otpSentTo" class="success-msg show" style="margin-bottom:10px"></p>
          <input id="regOtp" class="input" placeholder="Enter 6-digit OTP*" maxlength="6"><p id="err-regOtp" class="error-msg"></p>
          <button id="validateRegBtn" class="btn btn-orange" onclick="validateRegOtp()">Validate OTP</button>
        </div>
      </div>
      <div id="regStep3" class="hidden">
        <p class="success-msg show">OTP Verified! Create password</p>
        <input id="createPass" class="input" type="password" placeholder="Create Password*"><p id="err-createPass" class="error-msg"></p>
        <input id="confirmPass" class="input" type="password" placeholder="Confirm Password*"><p id="err-confirmPass" class="error-msg"></p>
        <p id="success-regFinal" class="success-msg"></p>
        <button id="createAccBtn" class="btn btn-green" onclick="createAccount()">Create Account</button>
      </div>
    </div>
    <div id="forgotForm" class="hidden">
      <input id="forgotEmail" class="input" placeholder="Enter Registered Email*"><p id="err-forgotEmail" class="error-msg"></p>
      <p id="success-forgot1" class="success-msg"></p>
      <button id="sendOtpBtn" class="btn btn-blue" onclick="sendForgotOtp()">Send OTP</button>
      <div id="forgotOtpBox" class="otp-box hidden" style="display:none">
        <p id="forgotOtpInfo" class="success-msg show"></p>
        <input id="forgotOtp" class="input" placeholder="Enter 6-digit OTP*" maxlength="6"><p id="err-forgotOtp" class="error-msg"></p>
        <button id="validateForgotBtn" class="btn btn-orange" onclick="verifyForgotOtp()">Validate OTP</button>
      </div>
      <div id="newPassBox" class="hidden" style="margin-top:12px">
        <input id="forgotPass" class="input" type="password" placeholder="New Password*"><p id="err-forgotPass" class="error-msg"></p>
        <input id="forgotPass2" class="input" type="password" placeholder="Confirm New Password*"><p id="err-forgotPass2" class="error-msg"></p>
        <p id="success-forgotFinal" class="success-msg"></p>
        <button id="savePassBtn" class="btn btn-green" onclick="saveNewPassword()">Save Password</button>
      </div>
    </div>
  </div>
</div>
<div class="bottom-nav">
<a href="index.html"><span>🏠</span><span>Home</span></a>
<a href="account.html" class="active"><span>👤</span><span>Account</span></a>
<a href="cart.html"><span>🛒</span><span>Cart (<span id="cartCount">0</span>)</span></a>
</div>
<script>
const API_BASE = "https://rekavo-backend.vercel.app";
let regData={}, forgotKey="", forgotOtpVerified=false, currentUser=null;

function switchTab(t){document.getElementById('loginForm').classList.toggle('hidden',t!=='login');document.getElementById('registerForm').classList.toggle('hidden',t!=='register');document.getElementById('forgotForm').classList.toggle('hidden',t!=='forgot');}
function showErr(id,msg){let el=document.getElementById(id);el.innerText=msg;el.classList.add('show');}
function showSuccess(id,msg){let el=document.getElementById(id);el.innerText=msg;el.classList.add('show');}
function clearErrs(){document.querySelectorAll('.error-msg').forEach(e=>e.classList.remove('show'));document.querySelectorAll('.success-msg').forEach(e=>{if(!['otpSentTo','forgotOtpInfo'].includes(e.id)) e.classList.remove('show')})}

async function sendRegOtp(){
 clearErrs(); let name=document.getElementById('regName').value.trim(); let mobile=document.getElementById('regMobile').value.trim(); let email=document.getElementById('regEmail').value.trim().toLowerCase();
 if(name.length<2){showErr('err-regName','Enter name');return;} if(!/^[6-9][0-9]{9}$/.test(mobile)){showErr('err-regMobile','Valid mobile');return;} if(!email.includes('@')){showErr('err-regEmail','Valid email');return;}
 regData={name,mobile,email}; let btn=document.getElementById('sendRegBtn');btn.innerText='Sending...';btn.disabled=true;
 try{let res=await fetch(`${API_BASE}/send-otp`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});let data=await res.json();if(res.ok){document.getElementById('otpSentTo').innerText=`OTP sent to ${email}`;document.getElementById('regStep1').classList.add('hidden');document.getElementById('regStep2').classList.remove('hidden');}else{showErr('err-regEmail',data.error);}}catch(e){showErr('err-regEmail','Network error');}
 btn.innerText='Send OTP';btn.disabled=false;
}
async function validateRegOtp(){
 clearErrs(); let otp=document.getElementById('regOtp').value.trim(); if(otp.length!==6){showErr('err-regOtp','Enter 6-digit OTP');return;}
 let btn=document.getElementById('validateRegBtn');btn.innerText='Verifying...';btn.disabled=true;
 try{let res=await fetch(`${API_BASE}/check-otp`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:regData.email,otp})});let data=await res.json();if(res.ok&&data.success){regData.otpVerified=true;regData.tempOtp=otp;document.getElementById('regStep2').classList.add('hidden');document.getElementById('regStep3').classList.remove('hidden');}else{showErr('err-regOtp',data.error);}}catch(e){showErr('err-regOtp','Network error');}
 btn.innerText='Validate OTP';btn.disabled=false;
}
async function createAccount(){
 clearErrs(); let p=document.getElementById('createPass').value.trim(); let cp=document.getElementById('confirmPass').value.trim(); if(p.length<6){showErr('err-createPass','Min 6 chars');return;} if(p!==cp){showErr('err-confirmPass','Not match');return;}
 let btn=document.getElementById('createAccBtn');btn.innerText='Creating...';btn.disabled=true;
 try{let res=await fetch(`${API_BASE}/verify-otp`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:regData.email,otp:regData.tempOtp,name:regData.name,phone:regData.mobile,password:p})});let data=await res.json();if(res.ok){
  let uid = data.user.id || data.user._id || data.user.user_id;
  localStorage.setItem('rekavo_user',JSON.stringify({id:uid, user_id:uid, name:data.user.name,mobile:data.user.phone,email:data.user.email}));
  showSuccess('success-regFinal','Account Created!');setTimeout(()=>{location.href='index.html';},600);}else{showErr('err-confirmPass',data.error);}}catch(e){showErr('err-confirmPass','Network error');}
 btn.innerText='Create Account';btn.disabled=false;
}
async function handleLogin(){
 clearErrs(); let email=document.getElementById('loginEmail').value.trim().toLowerCase(); let pass=document.getElementById('loginPass').value.trim(); if(!email||!pass){showErr('err-loginEmail','Enter email & pass');return;}
 let btn = document.querySelector('#loginForm .btn');btn.innerText='Logging...';btn.disabled=true;
 try{let res=await fetch(`${API_BASE}/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})});let data=await res.json();if(res.ok){
  let uid = data.user.id || data.user._id || data.user.user_id || data.userId;
  localStorage.setItem('rekavo_user',JSON.stringify({id:uid, user_id:uid, name:data.user.name,mobile:data.user.phone,email:data.user.email}));
  showSuccess('success-login',`Welcome ${data.user.name}`);setTimeout(()=>{location.href='index.html';},600);}else{showErr('err-loginEmail',data.error);}}catch(e){showErr('err-loginEmail','Network error');}
 btn.innerText='Login with Password';btn.disabled=false;
}
async function sendForgotOtp(){
 clearErrs(); forgotKey=document.getElementById('forgotEmail').value.trim().toLowerCase(); if(!forgotKey){showErr('err-forgotEmail','Enter email');return;}
 let btn=document.getElementById('sendOtpBtn');btn.innerText='Sending...';btn.disabled=true;
 try{let res=await fetch(`${API_BASE}/send-otp`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:forgotKey})});let data=await res.json();if(res.ok){showSuccess('success-forgot1',`OTP sent to ${forgotKey}`);document.getElementById('forgotOtpInfo').innerText=`OTP sent to ${forgotKey}`;document.getElementById('forgotOtpBox').style.display='block';document.getElementById('forgotOtpBox').classList.remove('hidden');}else{showErr('err-forgotEmail',data.error);}}catch(e){showErr('err-forgotEmail','Network error');}
 btn.innerText='Resend OTP';btn.disabled=false;
}
async function verifyForgotOtp(){
 clearErrs(); let otp=document.getElementById('forgotOtp').value.trim(); if(otp.length!==6){showErr('err-forgotOtp','Enter OTP');return;}
 let btn=document.getElementById('validateForgotBtn');btn.innerText='Verifying...';btn.disabled=true;
 try{let res=await fetch(`${API_BASE}/check-otp`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:forgotKey,otp})});let data=await res.json();if(res.ok&&data.success){window._forgotOtp=otp;forgotOtpVerified=true;document.getElementById('forgotOtpBox').style.display='none';document.getElementById('newPassBox').classList.remove('hidden');}else{showErr('err-forgotOtp',data.error);}}catch(e){showErr('err-forgotOtp','Network error');}
 btn.innerText='Validate OTP';btn.disabled=false;
}
async function saveNewPassword(){
 clearErrs(); if(!forgotOtpVerified){showErr('err-forgotPass','Verify OTP first');return;} let p1=document.getElementById('forgotPass').value.trim(); let p2=document.getElementById('forgotPass2').value.trim(); if(p1.length<6){showErr('err-forgotPass','Min 6 chars');return;} if(p1!==p2){showErr('err-forgotPass2','Not match');return;}
 let btn=document.getElementById('savePassBtn');btn.innerText='Saving...';btn.disabled=true;
 try{let res=await fetch(`${API_BASE}/reset-password`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:forgotKey,otp:window._forgotOtp,new_password:p1})});let data=await res.json();if(res.ok){showSuccess('success-forgotFinal','Password updated!');setTimeout(()=>switchTab('login'),1000);}else{showErr('err-forgotPass2',data.error);}}catch(e){showErr('err-forgotPass2','Network error');}
 btn.innerText='Save Password';btn.disabled=false;
}

function openPage(type){
 if(!currentUser){alert('Please login first');return;}
 document.getElementById(`page-${type}`).classList.remove('hidden');
 if(type==='cart') renderCart();
 if(type==='orders') renderOrders();
 if(type==='wishlist') renderWishlist();
 if(type==='address') renderAddress();
}
function closePage(type){document.getElementById(`page-${type}`).classList.add('hidden');}

function getUid(){ return currentUser? (currentUser.user_id || currentUser.id) : null; }

async function renderCart(){
 let el=document.getElementById('cartContent');
 el.innerHTML='<div style="padding:20px;text-align:center">Loading real cart...</div>';
 try{
   let uid = getUid();
   let res=await fetch(`${API_BASE}/cart/get?user_id=${uid}`);
   let cart=await res.json();
   if(!Array.isArray(cart) || cart.length===0){el.innerHTML=`<div class="empty-box"><h3>🛒 Your cart is empty</h3><p>This is REAL database cart - same on all devices</p><button class="btn btn-blue" style="margin-top:12px;width:auto;padding:0 20px" onclick="location.href='index.html'">Continue Shopping</button></div>`;return;}
   let html=`<div style="padding:12px">`;
   cart.forEach((c,i)=>{
     html+=`<div style="background:#fff;border-radius:8px;padding:12px;margin-bottom:8px;display:flex;gap:10px;align-items:center">
       <img src="${c.image||''}" style="width:50px;height:50px;object-fit:contain;border:1px solid #eee;border-radius:4px">
       <div style="flex:1"><b style="font-size:13px">${c.name}</b><p style="font-size:12px;color:#555">Qty: ${c.qty} • ₹${c.price}</p></div>
       <button onclick="removeRealCart('${c.product_id}')" style="color:#ff3b3b;border:1px solid #ff3b3b;background:#fff;padding:6px 10px;border-radius:6px;font-size:11px;font-weight:700">REMOVE</button>
     </div>`;
   });
   html+=`</div><div style="padding:0 12px"><button class="btn btn-blue" onclick="location.href='cart.html'">Go to Cart Page</button></div>`;
   el.innerHTML=html;
 }catch(e){el.innerHTML=`<div class="empty-box"><h3>Error loading cart</h3><p>${e.message}</p></div>`;}
}
async function removeRealCart(pid){
 if(!confirm('Remove?'))return;
 let uid = getUid();
 await fetch(`${API_BASE}/cart/remove`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:uid, email:currentUser.email, product_id:pid})});
 renderCart(); updateCountsReal();
}
async function renderWishlist(){
 let el=document.getElementById('wishlistContent');
 el.innerHTML='<div style="padding:20px;text-align:center">Loading wishlist...</div>';
 try{
   let uid = getUid();
   let res=await fetch(`${API_BASE}/wishlist/get?user_id=${uid}`);
   let wish=await res.json();
   if(!Array.isArray(wish) || wish.length===0){el.innerHTML=`<div class="empty-box"><h3>❤️ Your wishlist is empty</h3><p>REAL database wishlist - same on all devices</p><button class="btn btn-blue" style="margin-top:12px;width:auto;padding:0 20px" onclick="location.href='index.html'">Explore Products</button></div>`;return;}

async function addNewAddress(){
 let fn=document.getElementById('newAddrName').value.trim();
 let ph=document.getElementById('newAddrPhone').value.trim();
 let pin=document.getElementById('newAddrPin').value.trim();
 let full=document.getElementById('newAddrFull').value.trim();
 if(!fn||!ph||!pin||!full){alert('Fill all');return;}
 let uid = getUid();
 await fetch(`${API_BASE}/address/add`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:uid, email:currentUser.email,full_name:fn,phone:ph,pincode:pin,full_address:full})});
 alert('Address saved! Cross-device ready'); renderAddress();
}

async function updateCountsReal(){
 // 1. INSTANT local + duplicate merge
 try{
   let localCart = JSON.parse(localStorage.getItem('rekavo_cart')||'[]');
   let map = {};
   localCart.forEach(i=>{
     let id = i.product_id || i.id;
     if(!id) return;
     if(map[id]) map[id].qty = (map[id].qty||1) + (i.qty||1);
     else map[id] = {...i, qty: i.qty||1};
   });
   let finalLocal = Object.values(map);
   localStorage.setItem('rekavo_cart', JSON.stringify(finalLocal));
   let localCnt = finalLocal.reduce((s,i)=>s+(i.qty||1),0);
   let cc = document.getElementById('cartCount'); if(cc) cc.innerText = localCnt;
   let pc = document.getElementById('pCartCount'); if(pc) pc.innerText = localCnt;
 }catch(e){}

 // 2. Background server sync - REPLACE logic
 try{
   let uid = getUid();
   if(!uid) return;
   let [cr,wr]=await Promise.all([
     fetch(`${API_BASE}/cart/get?user_id=${uid}`),
     fetch(`${API_BASE}/wishlist/get?user_id=${uid}`)
   ]);
   let c=await cr.json(); let w=await wr.json();
   if(Array.isArray(c)){
     let map2 = {};
     c.forEach(i=>{
       let id = i.product_id || i.id || i.productId;
       if(!id) return;
       if(map2[id]) map2[id].qty += (i.qty||1);
       else map2[id] = {...i, product_id: id, id: id, qty: i.qty||1, image: i.image||i.img, img: i.image||i.img};
     });
     let finalServer = Object.values(map2);

     let cc2 = document.getElementById('cartCount'); if(cc2) cc2.innerText=cnt;
     let pc2 = document.getElementById('pCartCount'); if(pc2) pc2.innerText=cnt;
     localStorage.setItem('rekavo_cart',JSON.stringify(finalServer));

   }
