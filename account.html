<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account - REKAVO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Roboto,sans-serif}
body{background:#f1f3f6}
.top{position:sticky;top:0;background:#2874f0;color:#fff;padding:14px;display:flex;align-items:center;gap:12px;z-index:10}
.box{background:#fff;margin:10px;border-radius:6px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.inp{width:100%;padding:12px;border:1px solid #e0e0e0;border-radius:4px;margin:8px 0;outline:none}
.btn{width:100%;background:#fb641b;color:#fff;border:none;padding:13px;border-radius:4px;font-weight:800;font-size:14px;cursor:pointer;margin-top:8px}
.btn2{width:100%;background:#2874f0;color:#fff;border:none;padding:13px;border-radius:4px;font-weight:800;font-size:14px;cursor:pointer;margin-top:8px}
.profile-pic{width:80px;height:80px;background:#2874f0;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;margin:0 auto 12px}
.menu-item{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #f0f0f0;font-size:14px;font-weight:500;cursor:pointer}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid #ddd;z-index:100;height:50px}
.bottom-nav a{text-decoration:none;color:#555;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;flex:1;white-space:nowrap}
.bottom-nav a.active{color:#2874f0}
</style>
</head>
<body>
<div class="top"><span onclick="location.href='index.html'" style="font-size:20px;cursor:pointer">←</span><b id="topTitle">Login</b></div>

<div id="loginBox" class="box">
  <h3 style="font-size:16px;font-weight:800">Login / Signup</h3>
  <input id="phone" class="inp" placeholder="Enter Mobile Number (10 digit)" maxlength="10">
  <button class="btn2" onclick="sendOtp()">Continue with OTP (Master: 123456)</button>
  <div id="otpBox" style="display:none">
    <input id="otp" class="inp" placeholder="Enter OTP - Use 123456 for testing">
    <p style="font-size:11px;color:#878787">Demo OTP: <span id="demoOtp"></span> | Master: 123456</p>
    <button class="btn" onclick="verifyOtp()">Verify & Login</button>
  </div>
  <p id="loginMsg" style="font-size:12px;color:red;margin-top:8px"></p>
</div>

<div id="profileBox" class="box" style="display:none">
  <div class="profile-pic" id="pIcon">R</div>
  <h3 id="pName" style="text-align:center;font-size:16px;font-weight:800"></h3>
  <p id="pPhone" style="text-align:center;font-size:13px;color:#878787;margin-top:4px"></p>
  
  <div style="margin-top:20px">
    <div class="menu-item" onclick="location.href='cart.html'"><span>🛒 My Cart</span><span>›</span></div>
    <div class="menu-item"><span>📦 My Orders</span><span>›</span></div>
    <div class="menu-item"><span>❤️ Wishlist</span><span>›</span></div>
    <div class="menu-item"><span>🏠 Addresses</span><span>›</span></div>
    <div class="menu-item"><span>🎧 Help Center</span><span>›</span></div>
  </div>
  
  <button class="btn" style="background:#fff;color:#2874f0;border:1px solid #2874f0;margin-top:20px" onclick="logout()">Logout</button>
</div>

<div class="bottom-nav">
  <a href="index.html"><span>🏠</span><span>Home</span></a>
  <a href="account.html" class="active"><span>👤</span><span>Account</span></a>
  <a href="cart.html"><span>🛒</span><span>Cart (<span id="cartCount">0</span>)</span></a>
</div>

<script>
let cart = JSON.parse(localStorage.getItem('rekavo_cart')||'[]');
document.getElementById('cartCount').innerText = cart.length;

let genOtp = "";
function sendOtp(){
  let ph = document.getElementById('phone').value.trim();
  if(ph.length!=10){ document.getElementById('loginMsg').innerText="Enter 10 digit number"; return; }
  genOtp = Math.floor(100000+Math.random()*900000).toString();
  document.getElementById('demoOtp').innerText = genOtp;
  document.getElementById('otpBox').style.display='block';
  document.getElementById('loginMsg').innerText="OTP sent! Use "+genOtp+" or 123456";
}
function verifyOtp(){
  let otp = document.getElementById('otp').value.trim();
  if(otp===genOtp || otp==="123456"){
    let ph = document.getElementById('phone').value.trim();
    let user = {phone:ph, name:"REKAVO User "+ph.slice(-4)};
    localStorage.setItem('rekavo_user', JSON.stringify(user));
    
    // pending product tha to cart me add kar do
    let pending = localStorage.getItem('rekavo_pending_product');
    if(pending){
      try{
        let pp = JSON.parse(pending);
        // yahan product add logic chahiye to category se utha le
        // abhi ke liye simple
        localStorage.removeItem('rekavo_pending_product');
      }catch(e){}
    }
    
    showProfile();
  } else {
    document.getElementById('loginMsg').innerText="Wrong OTP! Use "+genOtp+" or 123456";
  }
}
function showProfile(){
  let user = JSON.parse(localStorage.getItem('rekavo_user')||'null');
  if(!user) return;
  document.getElementById('loginBox').style.display='none';
  document.getElementById('profileBox').style.display='block';
  document.getElementById('topTitle').innerText='My Account';
  document.getElementById('pName').innerText=user.name;
  document.getElementById('pPhone').innerText='+91 '+user.phone;
  document.getElementById('pIcon').innerText=user.name.charAt(0);
}
function logout(){
  localStorage.removeItem('rekavo_user');
  location.reload();
}
let u = localStorage.getItem('rekavo_user');
if(u) showProfile();
</script>
</body>
</html>
