<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;font-family:sans-serif;background:#f5f5f5;padding-bottom:80px}
.top-box{background:#fff;padding:25px 20px;text-align:center;border-bottom:1px solid #ddd}
.un-circle{width:60px;height:60px;border-radius:50%;border:2px solid #000;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:18px;margin:0 auto 10px}
.user-info{text-align:left;margin-top:15px;padding-left:10px}
.user-info div{margin:4px 0}

.middle-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:20px;background:#fff;margin-top:1px;border-bottom:1px solid #ddd}
.grid-btn{border:1.5px solid #000;padding:14px;text-align:center;border-radius:8px;font-weight:500;background:#fff}

.bottom-list{background:#fff;margin-top:8px;padding:10px 0}
.list-item{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid #eee;font-size:16px}
.list-item span:last-child{font-size:20px}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:12px 0;border-top:1px solid #ddd}
</style>
</head>
<body>

<div class="top-box">
  <div class="un-circle">UN</div>
  <div class="user-info">
    <div>→ User Name : <b id="uName">User Name</b></div>
    <div>→ Mo. No. : <b id="uMo">XXXXXXXXXX</b></div>
  </div>
</div>

<div class="middle-grid">
  <div class="grid-btn" onclick="location.href='orders.html'">My order</div>
  <div class="grid-btn" onclick="location.href='cart.html'">my card</div>
  <div class="grid-btn" onclick="location.href='coupons.html'">coupons</div>
  <div class="grid-btn" onclick="location.href='wishlist.html'">wishlist</div>
</div>

<div class="bottom-list">
  <div class="list-item" onclick="location.href='email.html'"><span>✉️ Email - ......</span><span>></span></div>
  <div class="list-item" onclick="location.href='addresses.html'"><span>📍 Saved Addresses</span><span>></span></div>
  <div class="list-item" onclick="location.href='edit-profile.html'"><span>👤 Edit profile</span><span>></span></div>
  <div class="list-item" onclick="location.href='language.html'"><span>अ/ A Select Language</span><span>></span></div>
  <div class="list-item" onclick="location.href='help.html'"><span>Help center</span><span>></span></div>
</div>

<div class="bottom-nav">
  <span onclick="location.href='index.html'">Home</span>
  <span onclick="location.href='search.html'">Search</span>
  <span onclick="location.href='cart.html'">Cart</span>
  <span><b>Account</b></span>
</div>

<script>
// User data load karega
document.getElementById('uName').innerText = localStorage.getItem('userName') || 'User Name';
document.getElementById('uMo').innerText = localStorage.getItem('userMobile') || 'Mo. No.';
</script>

</body>
</html>
