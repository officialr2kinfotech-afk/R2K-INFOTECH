<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account - REKAVO</title>
<style>
#topStrip,#searchWrapper,#mainBlurBg{ display:none !important; }
*{margin:0;padding:0;box-sizing:border-box;font-family:Roboto,Arial,sans-serif}
body{background:#f1f3f6;padding-bottom:70px} 
.top-strip{background:#e6efff;color:#1a4ab0;text-align:center;padding:7px 12px;font-size:12px;font-weight:800}
.search-wrapper{background:#2874f0;padding:10px 12px;position:sticky;top:0;z-index:10}
.search-box{width:100%;display:flex;background:#fff;border-radius:4px;overflow:hidden;height:42px;align-items:center}
.search-box input{flex:1;border:none;padding:0 14px;outline:none;font-size:14px}
.search-box button{background:#fff;border:none;color:#2874f0;padding:0 18px;font-size:22px;font-weight:900}
.page-bg{filter:blur(3px);opacity:0.6;pointer-events:none;padding:10px}
.hero{height:160px;background:linear-gradient(90deg,#0f1a4a,#2a3a8c);border-radius:8px;margin:10px;display:flex;align-items:center;padding:20px;color:#fff}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;z-index:9999;padding:15px}
.modal{width:100%;max-width:400px;background:#fff;border-radius:12px;padding:20px;position:relative;box-shadow:0 8px 25px rgba(0,0,0,0.3);max-height:92vh;overflow-y:auto}
.close{position:absolute;right:14px;top:10px;font-size:22px;font-weight:700;cursor:pointer}
.title{font-size:17px;font-weight:800;margin-bottom:3px}
.sub{font-size:12.5px;color:#878787;margin-bottom:16px}
.tabs{display:flex;border:1px solid #2874f0;border-radius:8px;overflow:hidden;margin-bottom:16px;height:40px}
.tab{flex:1;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;cursor:pointer}
.tab.active{background:#2874f0;color:#fff}
.tab.inactive{background:#fff;color:#2874f0}
.input{width:100%;height:44px;border:1px solid #dbdbdb;border-radius:8px;padding:0 12px;outline:none;font-size:14px;margin:5px 0 2px}
.input.error{border-color:#d93025;background:#fff5f5}
.btn{width:100%;height:44px;background:#ff7a00;color:#fff;border:none;border-radius:8px;font-weight:800;font-size:14px;cursor:pointer;margin-top:6px}
.btn-blue{background:#2874f0}
.btn-green{background:#26a541}
.btn-orange{background:#ff9f00}
.links{display:flex;justify-content:space-between;margin-top:12px}
.link{font-size:12px;color:#2874f0;font-weight:600;cursor:pointer}
.error-msg{color:#d93025;font-size:12px;font-weight:500;margin-top:4px;display:none;padding:2px 0 6px 2px}
.error-msg.show{display:block}
.success-msg{color:#188038;font-size:11px;font-weight:700;margin-top:6px;display:none;background:#e6f4ea;padding:8px;border-radius:4px;text-align:center}
.success-msg.show{display:block}
.hidden{display:none!important}
.otp-box{background:#f8f9ff;border:1px dashed #2874f0;border-radius:8px;padding:15px;margin-top:10px;text-align:center}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid #ddd;z-index:99}
.bottom-nav a{text-align:center;text-decoration:none;color:#555;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;flex:1}
.bottom-nav a.active{color:#2874f0}
</style>
</head>
<body>
<div class="top-strip" id="topStrip">🔥 Use Coupon For Extra Discount At 20%, 40%, 50%, 80% And More....</div>
<div class="search-wrapper" id="searchWrapper"><div class="search-box"><input placeholder="Search for products"><button>⌕</button></div></div>
<div id="mainBlurBg" class="page-bg" style="display:none !important">
<div class="overlay hidden" id="overlay">
  <div class="modal">
    <span class="close" onclick="location.href='index.html'">×</span>
    <div class="title">Login to REKAVO</div>
    <div class="sub">Login to keep your orders safe</div>
    <div class="tabs"><div class="tab active" id="loginTab" onclick="switchTab('login')">Login</div><div class="tab inactive" id="registerTab" onclick="switchTab('register')">Register</div></div>
    <div id="loginForm">
      <input id="loginEmail" class="input" placeholder="Email / Mobile Number*"><p id="err-loginEmail" class="error-msg"></p>
      <input id="loginPass" class="input" type="password" placeholder="Password*"><p id="err-loginPass" class="error-msg"></p>
      <p id="success-login" class="success-msg"></p>
      <button class="btn" onclick="handleLogin()">Login with Password</button>
      <div class="links"><span class="link" onclick="switchTab('forgot')">Forgot Password?</span><span class="link" onclick="switchTab('register')">Register Now</span></div>
    </div>
    <div id="registerForm" class="hidden">
      <div id="regStep1"><input id="regName" class="input" placeholder="Full Name*"><p id="err-regName" class="error-msg"></p><input id="regMobile" class="input" placeholder="Mobile Number* (10 digits)" maxlength="10"><p id="err-regMobile" class="error-msg"></p><input id="regEmail" class="input" placeholder="Email Address*"><p id="err-regEmail" class="error-msg"></p><button id="sendRegBtn" class="btn btn-blue" onclick="sendRegOtp()">Send OTP</button></div>
      <div id="regStep2" class="hidden"><div class="otp-box"><p id="otpSentTo" class="success-msg show" style="margin-bottom:10px"></p><input id="regOtp" class="input" placeholder="Enter 6-digit OTP*" maxlength="6"><p id="err-regOtp" class="error-msg"></p><button id="validateRegBtn" class="btn btn-orange" onclick="validateRegOtp()">Validate OTP</button></div></div>
      <div id="regStep3" class="hidden"><p class="success-msg show">OTP Verified! Create password</p><input id="createPass" class="input" type="password" placeholder="Create Password*"><p id="err-createPass" class="error-msg"></p><input id="confirmPass" class="input" type="password" placeholder="Confirm Password*"><p id="err-confirmPass" class="error-msg"></p><p id="success-regFinal" class="success-msg"></p><button id="createAccBtn" class="btn btn-green" onclick="createAccount()">Create Account</button></div>
    </div>
    <div id="forgotForm" class="hidden">
      <input id="forgotEmail" class="input" placeholder="Enter Registered Email*"><p id="err-forgotEmail" class="error-msg"></p><p id="success-forgot1" class="success-msg"></p><button id="sendOtpBtn" class="btn btn-blue" onclick="sendForgotOtp()">Send OTP</button>
      <div id="forgotOtpBox" class="otp-box hidden" style="display:none"><p id="forgotOtpInfo" class="success-msg show"></p><input id="forgotOtp" class="input" placeholder="Enter 6-digit OTP*" maxlength="6"><p id="err-forgotOtp" class="error-msg"></p><button id="validateForgotBtn" class="btn btn-orange" onclick="verifyForgotOtp()">Validate OTP</button></div>
      <div id="newPassBox" class="hidden" style="margin-top:12px"><input id="forgotPass" class="input" type="password" placeholder="New Password*"><p id="err-forgotPass" class="error-msg"></p><input id="forgotPass2" class="input" type="password" placeholder="Confirm New Password*"><p id="err-forgotPass2" class="error-msg"></p><p id="success-forgotFinal" class="success-msg"></p><button id="savePassBtn" class="btn btn-green" onclick="saveNewPassword()">Save Password</button></div>
    </div>
  </div>
</div>
<div class="bottom-nav"><a href="index.html"><span>🏠</span><span>Home</span></a><a href="account.html" class="active"><span>👤</span><span>Account</span></a><a href="cart.html"><span>🛒</span><span>Cart (<span id="cartCount">0</span>)</span></a></div>
<script>
const API_BASE = "https://rekavo-backend.vercel.app";
let regData={}, forgotKey="", forgotOtpVerified=false;
function switchTab(t){
  document.getElementById('loginForm').classList.toggle('hidden',t!=='login');
  document.getElementById('registerForm').classList.toggle('hidden',t!=='register');
  document.getElementById('forgotForm').classList.toggle('hidden',t!=='forgot');
  let loginTab=document.getElementById('loginTab'), registerTab=document.getElementById('registerTab');
  if(t==='login'){loginTab.classList.add('active');loginTab.classList.remove('inactive');registerTab.classList.add('inactive');registerTab.classList.remove('active');}
  else if(t==='register'){registerTab.classList.add('active');registerTab.classList.remove('inactive');loginTab.classList.add('inactive');loginTab.classList.remove('active');}
  else {loginTab.classList.add('inactive');loginTab.classList.remove('active');registerTab.classList.add('inactive');registerTab.classList.remove('active');}
  clearErrs();
}
function showErr(id,msg){let el=document.getElementById(id);let input=document.getElementById(id.replace('err-',''));if(el){el.innerText=msg;el.classList.add('show');}if(input){input.classList.add('error');}}
function hideErr(id){let el=document.getElementById(id);let input=document.getElementById(id.replace('err-',''));if(el){el.classList.remove('show');}if(input){input.classList.remove('error');}}
function showSuccess(id,msg){let el=document.getElementById(id);el.innerText=msg;el.classList.add('show');}
function clearErrs(){document.querySelectorAll('.error-msg').forEach(e=>e.classList.remove('show'));document.querySelectorAll('.input').forEach(e=>e.classList.remove('error'));document.querySelectorAll('.success-msg').forEach(e=>{if(!['otpSentTo','forgotOtpInfo'].includes(e.id)) e.classList.remove('show')})}
document.querySelectorAll('.input').forEach(inp=>{inp.addEventListener('input',()=>{let errId='err-'+inp.id;hideErr(errId);});});
async function sendRegOtp(){
 clearErrs();let name=document.getElementById('regName').value.trim();let mobile=document.getElementById('regMobile').value.trim();let email=document.getElementById('regEmail').value.trim().toLowerCase();let ok=true;
 if(name.length<2){showErr('err-regName','Please enter your Full Name'); ok=false;}
 if(!mobile){showErr('err-regMobile','Please enter your Mobile Number'); ok=false;}else if(!/^[6-9][0-9]{9}$/.test(mobile)){showErr('err-regMobile','Please enter a valid 10-digit Mobile Number'); ok=false;}
 if(!email){showErr('err-regEmail','Please enter your Email Address'); ok=false;}else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){showErr('err-regEmail','Please enter a valid Email Address'); ok=false;}
 if(!ok) return;
 regData={name,mobile,email}; let btn=document.getElementById('sendRegBtn');btn.innerText='Sending...';btn.disabled=true;
 try{let res=await fetch(`${API_BASE}/send-otp`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});let data=await res.json();if(res.ok){document.getElementById('otpSentTo').innerText=`OTP sent to ${email}`;document.getElementById('regStep1').classList.add('hidden');document.getElementById('regStep2').classList.remove('hidden');}else{showErr('err-regEmail',data.error||'Email already registered');}}catch(e){showErr('err-regEmail','Network error, please try again');}
 btn.innerText='Send OTP';btn.disabled=false;
}
async function validateRegOtp(){
 clearErrs(); let otp=document.getElementById('regOtp').value.trim();
 if(!otp){showErr('err-regOtp','Please enter OTP');return;}
 if(otp.length!==6){showErr('err-regOtp','Please enter valid 6-digit OTP');return;}
 let btn=document.getElementById('validateRegBtn');btn.innerText='Verifying...';btn.disabled=true;
 try{let res=await fetch(`${API_BASE}/check-otp`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:regData.email,otp})});let data=await res.json();if(res.ok&&data.success){regData.otpVerified=true;regData.tempOtp=otp;document.getElementById('regStep2').classList.add('hidden');document.getElementById('regStep3').classList.remove('hidden');}else{showErr('err-regOtp',data.error||'Invalid OTP, please try again');}}catch(e){showErr('err-regOtp','Network error');}
 btn.innerText='Validate OTP';btn.disabled=false;
}
async function createAccount(){
 clearErrs(); let p=document.getElementById('createPass').value.trim(); let cp=document.getElementById('confirmPass').value.trim();let ok=true;
 if(!p){showErr('err-createPass','Please create a Password'); ok=false;}else if(p.length<6){showErr('err-createPass','Password must be at least 6 characters'); ok=false;}
 if(!cp){showErr('err-confirmPass','Please confirm your Password'); ok=false;}else if(p!==cp){showErr('err-confirmPass','Password does not match'); ok=false;}
 if(!ok) return;
 let btn=document.getElementById('createAccBtn');btn.innerText='Creating...';btn.disabled=true;
 try{let res=await fetch(`${API_BASE}/verify-otp`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:regData.email,otp:regData.tempOtp,name:regData.name,phone:regData.mobile,password:p})});let data=await res.json();if(res.ok){let uid=data.user.id||data.user._id||data.user.user_id;localStorage.setItem('rekavo_user',JSON.stringify({id:uid,user_id:uid,name:data.user.name,mobile:data.user.phone,email:data.user.email}));showSuccess('success-regFinal','Account Created Successfully!');setTimeout(()=>{location.href='index.html';},600);}else{showErr('err-confirmPass',data.error||'Failed to create account');}}catch(e){showErr('err-confirmPass','Network error');}
 btn.innerText='Create Account';btn.disabled=false;
}
async function handleLogin(){
 clearErrs();let emailEl=document.getElementById('loginEmail');let passEl=document.getElementById('loginPass');let email=emailEl.value.trim().toLowerCase();let pass=passEl.value.trim();let valid=true;
 if(!email){showErr('err-loginEmail','Please enter your Email / Mobile Number');valid=false;}else if(email.length<4){showErr('err-loginEmail','Please enter a valid Email / Mobile Number');valid=false;}
 if(!pass){showErr('err-loginPass','Please enter your Password');valid=false;}
 if(!valid) return;
 let btn = document.querySelector('#loginForm .btn');btn.innerText='Logging in...';btn.disabled=true;
 try{let res=await fetch(`${API_BASE}/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})});let data=await res.json();if(res.ok){let uid=data.user.id||data.user._id||data.user.user_id||data.userId;localStorage.setItem('rekavo_user',JSON.stringify({id:uid,user_id:uid,name:data.user.name,mobile:data.user.phone,email:data.user.email}));showSuccess('success-login',`Welcome ${data.user.name}!`);setTimeout(()=>{location.href='index.html';},600);}else{showErr('err-loginPass',data.error||'Wrong password, please try again');}}catch(e){showErr('err-loginPass','Network error, please try again');}
 btn.innerText='Login with Password';btn.disabled=false;
}
async function sendForgotOtp(){
 clearErrs(); forgotKey=document.getElementById('forgotEmail').value.trim().toLowerCase();
 if(!forgotKey){showErr('err-forgotEmail','Please enter your registered Email');return;}
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(forgotKey)){showErr('err-forgotEmail','Please enter a valid Email Address');return;}
 let btn=document.getElementById('sendOtpBtn');btn.innerText='Sending...';btn.disabled=true;
 try{let res=await fetch(`${API_BASE}/send-otp`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:forgotKey})});let data=await res.json();if(res.ok){showSuccess('success-forgot1',`OTP sent to ${forgotKey}`);document.getElementById('forgotOtpInfo').innerText=`OTP sent to ${forgotKey}`;document.getElementById('forgotOtpBox').style.display='block';document.getElementById('forgotOtpBox').classList.remove('hidden');}else{showErr('err-forgotEmail',data.error||'Email not found');}}catch(e){showErr('err-forgotEmail','Network error');}
 btn.innerText='Resend OTP';btn.disabled=false;
}
async function verifyForgotOtp(){
 clearErrs(); let otp=document.getElementById('forgotOtp').value.trim();
 if(!otp){showErr('err-forgotOtp','Please enter OTP');return;}
 if(otp.length!==6){showErr('err-forgotOtp','Please enter valid 6-digit OTP');return;}
 let btn=document.getElementById('validateForgotBtn');btn.innerText='Verifying...';btn.disabled=true;
 try{let res=await fetch(`${API_BASE}/check-otp`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:forgotKey,otp})});let data=await res.json();if(res.ok&&data.success){window._forgotOtp=otp;forgotOtpVerified=true;document.getElementById('forgotOtpBox').style.display='none';document.getElementById('newPassBox').classList.remove('hidden');}else{showErr('err-forgotOtp',data.error||'Invalid OTP');}}catch(e){showErr('err-forgotOtp','Network error');}
 btn.innerText='Validate OTP';btn.disabled=false;
}
async function saveNewPassword(){
 clearErrs(); if(!forgotOtpVerified){showErr('err-forgotPass','Please verify OTP first');return;}
 let p1=document.getElementById('forgotPass').value.trim();let p2=document.getElementById('forgotPass2').value.trim();let ok=true;
 if(!p1){showErr('err-forgotPass','Please enter new Password'); ok=false;}else if(p1.length<6){showErr('err-forgotPass','Password must be at least 6 characters'); ok=false;}
 if(!p2){showErr('err-forgotPass2','Please confirm new Password'); ok=false;}else if(p1!==p2){showErr('err-forgotPass2','Password does not match'); ok=false;}
 if(!ok) return;
 let btn=document.getElementById('savePassBtn');btn.innerText='Saving...';btn.disabled=true;
 try{let res=await fetch(`${API_BASE}/reset-password`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:forgotKey,otp:window._forgotOtp,new_password:p1})});let data=await res.json();if(res.ok){showSuccess('success-forgotFinal','Password updated successfully!');setTimeout(()=>switchTab('login'),1000);}else{showErr('err-forgotPass2',data.error||'Failed to update password');}}catch(e){showErr('err-forgotPass2','Network error');}
 btn.innerText='Save Password';btn.disabled=false;
}
(function(){
  let u=localStorage.getItem('rekavo_user');
  if(u){ location.href='profile.html'; return; }
  try{
    let localCart=JSON.parse(localStorage.getItem('rekavo_cart')||'[]');
    let cnt=localCart.reduce((s,i)=>s+(i.qty||1),0);
    let el=document.getElementById('cartCount');if(el)el.innerText=cnt;
  }catch(e){}
})();

(function(){
  try{
    let u = localStorage.getItem('rekavo_user');
    if(u){
      location.replace('profile.html');
      return;
    }
    // logout hai to cart 0 dikhao
    localStorage.removeItem('rekavo_cart');
    
    let overlay = document.getElementById('overlay');
    if(overlay) overlay.classList.remove('hidden');

    let localCart = JSON.parse(localStorage.getItem('rekavo_cart')||'[]');
    let cnt = localCart.reduce((s,i)=>s+(i.qty||1),0);
    let el = document.getElementById('cartCount');
    if(el) el.innerText = cnt;

  }catch(e){
    let overlay = document.getElementById('overlay');
    if(overlay) overlay.classList.remove('hidden');
  }
})();
</script>
</body>
</html>
