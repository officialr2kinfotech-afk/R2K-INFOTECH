<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account - REKAVO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Roboto,sans-serif}
body{background:#f1f3f6;padding-bottom:70px}
.top-strip{background:#e6efff;color:#1a4ab0;text-align:center;padding:7px 12px;font-size:12px;font-weight:800}
.search-wrapper{background:#2874f0;padding:10px 12px}
.search-box{width:100%;display:flex;background:#fff;border-radius:2px;overflow:hidden;height:42px}
.search-box input{flex:1;border:none;padding:0 14px;outline:none}
.search-box button{background:#fff;border:none;color:#2874f0;padding:0 18px;font-size:20px;font-weight:900}

.account-card{background:#fff;max-width:380px;margin:20px auto;padding:22px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.tabs{display:flex;margin-bottom:18px;border-bottom:1px solid #e0e0e0}
.tab{flex:1;text-align:center;padding:10px;font-weight:700;cursor:pointer;color:#878787;border-bottom:2px solid transparent}
.tab.active{color:#2874f0;border-bottom:2px solid #2874f0}
.input{width:100%;padding:12px;border:1px solid #e0e0e0;border-radius:4px;margin:8px 0;outline:none}
.input:focus{border-color:#2874f0}
.btn{width:100%;padding:12px;background:#fb641b;color:#fff;border:none;border-radius:4px;font-weight:800;font-size:15px;cursor:pointer;margin-top:10px}
.btn-blue{background:#2874f0}
.link{font-size:12px;color:#2874f0;cursor:pointer;margin-top:10px;display:inline-block;font-weight:600}
.msg{font-size:13px;margin-top:8px;font-weight:600}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid #ddd}
.bottom-nav a{text-align:center;text-decoration:none;color:#555;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;flex:1}
.bottom-nav a.active{color:#2874f0}
.hidden{display:none}
</style>
</head>
<body>
<div class="top-strip">🔥 Use Coupon For Extra Discount At 20%, 40%, 50%, 80% And More....</div>
<div class="search-wrapper"><div class="search-box"><input placeholder="Search for products" onclick="location.href='index.html'"><button>⌕</button></div></div>

<div class="account-card">
  <div class="tabs">
    <div class="tab active" id="loginTab" onclick="switchTab('login')">Login</div>
    <div class="tab" id="registerTab" onclick="switchTab('register')">Register</div>
  </div>

  <!-- LOGIN -->
  <div id="loginForm">
    <input id="loginEmail" class="input" placeholder="Email likho bhai">
    <div id="otpField" class="hidden">
      <input id="loginOtp" class="input" placeholder="OTP daalo (6 digit)">
    </div>
    <button id="loginBtn" class="btn" onclick="sendOtp()">Send OTP</button>
    <div style="display:flex;justify-content:space-between;margin-top:12px">
      <span class="link" onclick="switchTab('forgot')">Forgot Password?</span>
      <span class="link" onclick="switchTab('register')">New? Register</span>
    </div>
    <div id="loginMsg" class="msg"></div>
  </div>

  <!-- REGISTER -->
  <div id="registerForm" class="hidden">
    <input class="input" placeholder="Full Name">
    <input class="input" placeholder="Email">
    <input class="input" type="password" placeholder="Password">
    <button class="btn btn-blue">Create Account</button>
    <span class="link" onclick="switchTab('login')">Already have account? Login</span>
  </div>

  <!-- FORGOT -->
  <div id="forgotForm" class="hidden">
    <p style="font-size:13px;color:#555;margin-bottom:8px">Email daalo, hum OTP bhej denge</p>
    <input class="input" placeholder="Email">
    <button class="btn btn-blue">Send Reset OTP</button>
    <span class="link" onclick="switchTab('login')">← Back to Login</span>
  </div>
</div>

<div class="bottom-nav">
<a href="index.html"><span>🏠</span><span>Home</span></a>
<a href="account.html" class="active"><span>👤</span><span>Account</span></a>
<a href="cart.html"><span>🛒</span><span>Cart (0)</span></a>
</div>

<script>
let otpSent = false;
let currentEmail = "";

function switchTab(type){
  document.getElementById('loginForm').classList.add('hidden');
  document.getElementById('registerForm').classList.add('hidden');
  document.getElementById('forgotForm').classList.add('hidden');
  document.getElementById('loginTab').classList.remove('active');
  document.getElementById('registerTab').classList.remove('active');
  
  if(type==='login'){
    document.getElementById('loginForm').classList.remove('hidden');
    document.getElementById('loginTab').classList.add('active');
  } else if(type==='register'){
    document.getElementById('registerForm').classList.remove('hidden');
    document.getElementById('registerTab').classList.add('active');
  } else {
    document.getElementById('forgotForm').classList.remove('hidden');
  }
}

async function sendOtp(){
  const email = document.getElementById('loginEmail').value.trim();
  const msg = document.getElementById('loginMsg');
  if(!email){ msg.innerText="Email likho bhai"; msg.style.color="red"; return; }

  if(!otpSent){
    msg.innerText="OTP bhej rahe hain..."; msg.style.color="#2874f0";
    const res = await fetch('/api/send-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});
    const data = await res.json();
    if(data.success){
      otpSent=true; currentEmail=email;
      document.getElementById('otpField').classList.remove('hidden');
      document.getElementById('loginBtn').innerText="Verify OTP & Login";
      msg.innerText="OTP bhej diya! 5 minute me daal do"; msg.style.color="green";
    } else {
      msg.innerText=data.message; msg.style.color="red";
    }
  } else {
    const otp = document.getElementById('loginOtp').value.trim();
    const res = await fetch('/api/verify-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:currentEmail,otp})});
    const data = await res.json();
    if(data.success){
      msg.innerText="Login Successful!"; msg.style.color="green";
      setTimeout(()=>location.href='index.html',1000);
    } else {
      msg.innerText=data.message; msg.style.color="red";
    }
  }
}
</script>
</body>
</html>
