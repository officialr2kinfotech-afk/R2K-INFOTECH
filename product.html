<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product - REKAVO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Roboto,Arial,sans-serif}
body{background:#f1f3f6;padding-bottom:80px}
.top-strip{background:#e6efff;color:#1a4ab0;text-align:center;padding:7px 12px;font-size:12px;font-weight:800;position:sticky;top:0;z-index:100}
.search-wrapper{background:#2874f0;padding:10px 12px;position:sticky;top:31px;z-index:99}
.search-box{width:100%;display:flex;background:#fff;border-radius:2px;height:42px}
.search-box input{flex:1;border:none;padding:0 14px;outline:none;font-size:14px}
.search-box button{background:#fff;border:none;color:#2874f0;padding:0 18px;font-size:20px;font-weight:900}
.pd-wrap{background:#fff;margin:8px;border-radius:4px;padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.pd-img{width:100%;height:280px;object-fit:contain;border:1px solid #f0f0f0;border-radius:4px}
.pd-title{font-size:16px;font-weight:700;margin-top:10px}
.pd-price{margin-top:8px}
.pd-price b{font-size:20px}
.pd-price s{color:#878787;font-size:14px;margin-left:6px}
.pd-price span{color:#26a541;font-weight:700;margin-left:6px}
.pd-desc{font-size:13px;color:#555;margin-top:10px;line-height:1.5}
.btn-row{display:flex;gap:8px;margin-top:14px}
.btn-row button{flex:1;height:48px;border:none;border-radius:4px;font-weight:800;font-size:14px;cursor:pointer}
.btn-cart{background:#ff9f00;color:#fff}
.btn-buy{background:#fb641b;color:#fff}
.cart-msg{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:20px;font-size:12px;display:none;z-index:1000}
.cart-msg.show{display:block}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid #ddd;z-index:99}
.bottom-nav a{text-align:center;text-decoration:none;color:#555;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;flex:1}
.bottom-nav a.active{color:#2874f0}
</style>
</head>
<body>
<div class="top-strip">🔥 Use Coupon For Extra Discount At 20%, 40%, 50%, 80% And More....</div>
<div class="search-wrapper"><div class="search-box"><input placeholder="Search for products"><button>⌕</button></div></div>

<div class="pd-wrap" id="pdWrap">
<div style="text-align:center;padding:20px">Loading...</div>
</div>
<div id="cartMsg" class="cart-msg"></div>

<div class="bottom-nav">
<a href="index.html"><span>🏠</span><span>Home</span></a>
<a href="account.html"><span>👤</span><span>Account</span></a>
<a href="cart.html"><span>🛒</span><span>Cart (<span id="cartCount">0</span>)</span></a>
</div>

<script>
const API_BASE="https://rekavo-backend.vercel.app";
const categoryData={powerbank:[{name:"Power Bank 10000mAh",price:499,originalPrice:1299,img:"https://images.unsplash.com/photo-1609091839311-d5365f9ff1c5?w=300",desc:"10000mAh Power Bank with fast charging",spec:"Capacity: 10000mAh, Input: Type-C, Output: USB"},{name:"Power Bank 20000mAh",price:799,originalPrice:1999,img:"https://images.unsplash.com/photo-1609091839311-d5365f9ff1c5?w=300",desc:"20000mAh high capacity",spec:"Capacity: 20000mAh, Dual USB"},{name:"Power Bank 30000mAh",price:1099,originalPrice:2999,img:"https://images.unsplash.com/photo-1609091839311-d5365f9ff1c5?w=300",desc:"30000mAh for long trips",spec:"Capacity: 30000mAh, 3 Output"}],neckband:[{name:"Neckband Boat 100",price:199,originalPrice:999,img:"https://images.unsplash.com/photo-1546435770-a3e426bf472b?w=300",desc:"Boat neckband with deep bass",spec:"Battery: 20H, Bluetooth 5.0"},{name:"Neckband 500 Premium",price:549,originalPrice:1999,img:"https://images.unsplash.com/photo-1546435770-a3e426bf472b?w=300",desc:"Premium neckband",spec:"Battery: 40H, Fast Charge"}],earbuds:[{name:"Earbuds TWS 400",price:449,originalPrice:1499,img:"https://images.unsplash.com/photo-1572569511254-d8f925fe2cbb?w=300",desc:"TWS Earbuds",spec:"Battery: 30H, Type-C"},{name:"Earbuds Pro Sound",price:999,originalPrice:4999,img:"https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=300",desc:"Pro sound earbuds",spec:"ANC, 40H battery"}],cable:[{name:"Cable Type-C 100",price:99,originalPrice:299,img:"https://images.unsplash.com/photo-1625842268584-8f3296236761?w=300",desc:"Type-C Cable",spec:"Length: 1m, Fast charge"},{name:"Cable Fast 3A",price:199,originalPrice:499,img:"https://images.unsplash.com/photo-1587037542707-1dad5a1cfa9d?w=300",desc:"3A Fast Cable",spec:"Length: 1.5m"}],charger:[{name:"Charger 20W Fast",price:299,originalPrice:999,img:"https://images.unsplash.com/photo-1583863788434-e58a36330cf0?w=300",desc:"20W Fast Charger",spec:"Type-C PD"},{name:"Charger 65W",price:699,originalPrice:2499,img:"https://images.unsplash.com/photo-1583863788434-e58a36330cf0?w=300",desc:"65W Super Fast",spec:"GaN Tech"}]};

let cat=new URLSearchParams(location.search).get('cat')||'powerbank';
let idx=parseInt(new URLSearchParams(location.search).get('idx')||0);
let product=categoryData[cat]?.[idx];
let finalPrice=product?product.price:0;

function getUser(){try{let u=JSON.parse(localStorage.getItem('rekavo_user')); if(!u) return null; u.user_id=u.user_id||u.id||u._id; return u;}catch(e){return null}}

function renderProduct(){
 if(!product){document.getElementById('pdWrap').innerHTML='<div style="padding:20px;text-align:center">Product not found</div>';return;}
 let off=Math.round((product.originalPrice-product.price)/product.originalPrice*100);
 document.getElementById('pdWrap').innerHTML=`
 <img class="pd-img" src="${product.img}">
 <div class="pd-title">${product.name}</div>
 <div class="pd-price"><b>₹${product.price}</b> <s>₹${product.originalPrice}</s> <span>${off}% off</span></div>
 <div class="pd-desc"><b>Description:</b> ${product.desc}<br><br><b>Specification:</b> ${product.spec}<br><br><div style="color:#26a541;font-weight:700">✓ Extra coupon available - Extra ${off}% OFF</div></div>
 <div class="btn-row"><button class="btn-cart" onclick="addToCart()">ADD TO CART</button><button class="btn-buy" onclick="buyNow()">BUY NOW</button></div>
 `;
 finalPrice=product.price;
}

async function updateCartCount(){
  try{
    let u=getUser();
    let el=document.getElementById('cartCount');
    if(!u){
      let cart=JSON.parse(localStorage.getItem('rekavo_cart')||'[]');
      if(el) el.innerText=cart.reduce((s,i)=>s+(i.qty||1),0);
      return;
    }
    let res=await fetch(`${API_BASE}/cart/get?user_id=${u.user_id}`);
    let cart=await res.json();
    if(el) el.innerText=Array.isArray(cart)?cart.reduce((s,i)=>s+(i.qty||1),0):0;
  }catch(e){
    let cart=JSON.parse(localStorage.getItem('rekavo_cart')||'[]');
    let el=document.getElementById('cartCount');
    if(el) el.innerText=cart.reduce((s,i)=>s+(i.qty||1),0);
  }
}

function addToCart(){
  let pid = `${cat}_${idx}`;
  let cart = JSON.parse(localStorage.getItem('rekavo_cart')||'[]');
  let existing = cart.find(c=>c.product_id===pid);
  if(existing){ existing.qty=(existing.qty||1)+1; }
  else{
    cart.push({product_id: pid, id:pid, name:product.name, price:finalPrice, qty:1, img:product.img, image:product.img, desc:product.desc, spec:product.spec, original:product.originalPrice, mrp:product.originalPrice, cat:cat, idx:idx});
  }
  localStorage.setItem('rekavo_cart',JSON.stringify(cart));
  let count = cart.reduce((s,i)=>s+(i.qty||1),0);
  document.getElementById('cartCount').innerText = count;
  let msg=document.getElementById('cartMsg');
  msg.innerText = product.name+" added to cart ₹"+finalPrice+" ✓";
  msg.classList.add('show');
  setTimeout(()=>msg.classList.remove('show'),2000);

  let user=getUser();
  if(user && user.user_id){
    fetch(`${API_BASE}/cart/add`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:user.user_id, email:user.email, product_id:pid, name:product.name, price:finalPrice, qty:1, image:product.img})}).catch(()=>{});
  }
}

function buyNow(){
  let user=getUser();
  if(!user){ location.href='account.html'; return; }
  let pid=`${cat}_${idx}`;
  let buyItem={product_id:pid, name:product.name, price:finalPrice, qty:1, img:product.img, image:product.img, cat:cat, idx:idx};
  localStorage.setItem('rekavo_buy_now',JSON.stringify(buyItem));
  location.href='checkout.html';
}

renderProduct();
updateCartCount();
</script>
</body>
</html>
