<!DOCTYPE html>
<html>
<head>
    <title>Seller Register - R2K Infotech</title>
    <style>
        body{font-family: Arial; background:#f1f3f6; display:flex; justify-content:center; padding:30px}
        .box{background:white; padding:30px; width:500px; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.1)}
        input{width:100%; padding:10px; margin:8px 0; border:1px solid #ccc; border-radius:4px}
        button{width:100%; padding:12px; background:#2874f0; color:white; border:none; border-radius:4px; font-size:16px; cursor:pointer; margin-top:10px}
        label{font-weight:bold; font-size:14px; margin-top:10px; display:block}
    </style>
</head>
<body>
<div class="box">
    <h2>Become a Seller on R2K</h2>
    
    <label>1. Store / Business Name</label>
    <input type="text" placeholder="Ex: R2K Electronics">

    <label>2. Mobile Number</label>
    <input type="text" placeholder="10 digit mobile">

    <label>3. Email & Password</label>
    <input type="email" placeholder="Seller Email">
    <input type="password" placeholder="Create Password">

    <label>4. GSTIN Number</label>
    <input type="text" placeholder="22AAAAA0000A1Z5">

    <label>5. PAN Card Number</label>
    <input type="text" placeholder="ABCDE1234F">

    <label>6. Pickup Address & Pincode</label>
    <input type="text" placeholder="Full Address">
    <input type="text" placeholder="Pincode">

    <label>7. Bank Details</label>
    <input type="text" placeholder="Account Holder Name">
    <input type="text" placeholder="Account Number">
    <input type="text" placeholder="IFSC Code">

    <button onclick="alert('Seller Registered! Now login')">Register & Submit for Verification</button>
    <p style="text-align:center; margin-top:15px">Already a seller? <a href="seller-login.html">Login</a></p>
</div>
</body>
</html>
